<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>試験の糸 — Cram Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161f; --card:#1b222e; --card2:#232c3a; --line:#2e3949;
  --thread:#e8e0ce; --ai:#7d9cc9; --akane:#d4685e; --moegi:#93b06b;
  --kuchiba:#c9b370; --dim:#8b95a5; --ad-gap:90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--thread);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:var(--ad-gap)}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
h1{font-family:'Shippori Mincho B1',serif;font-size:22px;font-weight:700;letter-spacing:.06em}
h1 span{color:var(--akane)}
.hpill{font-size:12px;color:var(--ink);background:var(--thread);border-radius:999px;padding:3px 10px;font-weight:700}
.hlink{text-decoration:none;font-family:'Shippori Mincho B1',serif;font-size:15px;color:var(--akane);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;font-weight:500;padding:12px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--thread);border-bottom-color:var(--akane)}
main{padding:16px;max-width:620px;margin:0 auto}
.hint{color:var(--dim);font-size:13px;line-height:1.7}
.sec{margin-top:18px;margin-bottom:7px;font-size:11px;color:var(--ai);letter-spacing:.18em}
.sec:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:999px;font-size:13px;padding:7px 13px}
.chip.on{border-color:var(--akane);color:var(--akane);background:#2a1f22}
.chip.warn.on{border-color:var(--kuchiba);color:var(--kuchiba);background:#2a2618}
.chip.sm{font-size:12px;padding:6px 11px}
input[type=text],input[type=search],select{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:15px;padding:10px 13px;border-radius:10px;width:100%;-webkit-appearance:none}
input::placeholder{color:#6b7585}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.count{margin-top:14px;font-size:13px;color:var(--dim)}
.count b{color:var(--thread);font-size:17px;font-family:'Shippori Mincho B1',serif}
.go{width:100%;margin-top:12px;background:var(--akane);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:15px;border:none;border-radius:12px}
.go:disabled{background:var(--card2);color:var(--dim)}
.gorow{display:flex;gap:8px;margin-top:12px}
.gorow .go{margin-top:0;flex:2}
.gorow .alt{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:14px;border-radius:12px}
.list{margin-top:16px}
.lrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:7px;gap:10px}
.lrow .lj{font-family:'Shippori Mincho B1',serif;font-size:18px;line-height:1.4}
.lrow .lk{font-size:11px;color:var(--dim);margin-top:2px}
.lrow .lm{font-size:12px;color:var(--ai);margin-top:3px;line-height:1.5}
.lrow .lft{flex:1;min-width:0}
.lrow .rgt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:middle}
.tag.g1{color:#d99b93;border-color:#5c3b38}.tag.g2{color:#9dc07a;border-color:#3f5230}.tag.g3{color:#8fb0d6;border-color:#33465e}
.tag.tr{color:var(--kuchiba);border-color:#5c5130}
.tag.jt{color:#c39ad4;border-color:#4c3556}
.mini{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;font-family:inherit;font-size:12px;padding:5px 9px}
.star{background:none;border:none;color:var(--line);font-size:19px;padding:2px 4px;line-height:1}
.star.on{color:var(--kuchiba)}
.conj{background:var(--card2);border:1px solid var(--line);border-radius:10px;margin-top:-3px;padding:10px 13px;font-size:14px}
.conj div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #2a3342}
.conj div:last-child{border-bottom:none}
.conj .cf{color:var(--dim);font-size:12px;flex-shrink:0}
.conj .cv{font-family:'Shippori Mincho B1',serif;font-size:17px;text-align:right}
.conj .cv small{display:block;font-family:'Noto Sans JP';font-size:11px;color:var(--dim)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:var(--thread)}
.empty{text-align:center;color:var(--dim);font-size:14px;margin-top:34px;line-height:2}
/* furigana — UI chrome only. Card fronts never carry ruby: that would hand
   over the very reading being tested. */
ruby{ruby-position:over}
rt{font-size:.52em;color:var(--dim);font-weight:400;letter-spacing:0;line-height:1;
   -webkit-user-select:none;user-select:none}
nav button ruby rt{font-size:.55em}
.chip{line-height:1.35}
.fcue rt,.fans rt{color:var(--dim)}
.fbtns button rt{color:rgba(18,22,31,.55)}
.fdone button rt,.ftap rt{color:var(--dim)}
.fbar .mute{font-size:16px;padding:0 6px;background:none;border:none}
.fbar .mute.off{opacity:.4}
.fex .ek{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6}
.picked{margin-top:10px;font-size:12.5px;color:var(--ai);line-height:1.9}
/* two-line chips: Japanese label above, plain-English gloss below */
.chip.two{text-align:center;line-height:1.3;padding:6px 12px}
.chip.two i{display:block;font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.02em}
.chip.two.on i{color:var(--akane);opacity:.8}
/* 口ドリル */
.drillbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:20px 17px;margin-top:14px;min-height:190px}
.d-en{font-size:17px;color:var(--thread);line-height:1.6;min-height:52px}
.d-en .dnum{font-size:11px;color:var(--dim);margin-right:6px}
.d-ja{font-family:'Shippori Mincho B1',serif;font-size:23px;line-height:1.7;margin-top:14px;
  color:var(--card2);min-height:64px;transition:color .2s}
.d-ja.shown{color:var(--thread)}
.d-kn{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6;min-height:18px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--akane);
  margin-right:8px;animation:pu 1.2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
nav button{font-size:13px;padding:12px 2px}
.picked .warnx{color:var(--akane)}

/* ---------- flashcard overlay ---------- */
#flash{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;flex-direction:column}
#flash.on{display:flex}
.fbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.fbar .x{background:none;border:none;color:var(--dim);font-size:20px;font-family:inherit;padding:0 4px}
.fprog{flex:1;height:4px;background:var(--card2);border-radius:99px;overflow:hidden}
.fprog i{display:block;height:100%;background:var(--akane);width:0;transition:width .2s}
.fnum{font-size:12px;color:var(--dim);white-space:nowrap}
.fwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 18px;max-width:620px;margin:0 auto;width:100%;overflow-y:auto}
.fcue{text-align:center}
.fcue span{display:inline-block;font-size:13px;color:var(--ai);letter-spacing:.14em;
  background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
.ffront{font-family:'Shippori Mincho B1',serif;font-size:38px;line-height:1.5;text-align:center;margin-top:16px;word-break:keep-all;overflow-wrap:anywhere}
.ffront.en{font-family:'Noto Sans JP';font-size:23px;line-height:1.6;font-weight:500}
.fsub{text-align:center;color:var(--dim);font-size:14px;margin-top:12px;line-height:1.7}
.fback{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.fans{font-family:'Shippori Mincho B1',serif;font-size:34px;line-height:1.5;text-align:center;color:var(--akane);word-break:keep-all;overflow-wrap:anywhere}
.fans.en{font-family:'Noto Sans JP';font-size:21px;line-height:1.6;color:var(--thread);font-weight:500}
.fkana{text-align:center;color:var(--dim);font-size:14px;margin-top:8px}
.fex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-top:18px}
.fex .ej{font-family:'Shippori Mincho B1',serif;font-size:19px;line-height:1.7}
.fex .ee{font-size:13px;color:var(--ai);margin-top:6px;line-height:1.6}
.fnote{font-size:12.5px;color:var(--dim);line-height:1.8;margin-top:14px;border-left:2px solid var(--line);padding-left:12px}
.ftap{text-align:center;color:var(--dim);font-size:12px;margin-top:26px;letter-spacing:.1em}
.fbtns{display:flex;gap:9px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-width:620px;margin:0 auto;width:100%}
.fbtns button{flex:1;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;padding:16px 0;color:var(--ink)}
.fb-again{background:#b0655d}.fb-ok{background:var(--moegi)}
.fbtns .aud{flex:0 0 58px;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-weight:400;font-size:18px}
.fbtns .strb{flex:0 0 52px;background:var(--card2);border:1px solid var(--line);color:var(--line);font-size:19px}
.fbtns .strb.on{color:var(--kuchiba)}
.fdone{text-align:center;margin-top:40px}
.fdone .big{font-family:'Shippori Mincho B1',serif;font-size:26px;line-height:1.9}
.fdone .sc{font-size:44px;font-family:'Shippori Mincho B1',serif;color:var(--moegi);margin:10px 0}
.fdone button{width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:15px;padding:14px;border-radius:12px}
.fdone button.pri{background:var(--akane);color:var(--ink);border:none;font-weight:700}
</style>
</head>

const GRAM_S1=[
{id:"GA01",lv:1,l:1,t:"助詞",jp:"〜は",en:"topic marker — 'as for ～'",ja:"わたしはマイクです。",kn:"わたしはまいくです。",ee:"I'm Mike.",n:"Written は, pronounced WA. It flags the topic, not the subject — the two only look identical in easy sentences."},
{id:"GA02",lv:1,l:2,t:"助詞",jp:"〜の〜",en:"connects two nouns: possession, affiliation, type",ja:"IMCの社員です。",kn:"あいえむしーのしゃいんです。",ee:"I'm an IMC employee.",n:"Backwards from English: the OWNER comes first. 日本語の本 = book of Japanese, not Japanese of book."},
{id:"GA03",lv:1,l:4,t:"助詞",jp:"〜に（時）",en:"at [a specific clock time / date]",ja:"七時に起きます。",kn:"しちじにおきます。",ee:"I get up at seven.",n:"に only attaches to times you could point at on a clock or calendar. 今日・明日・毎朝 take NO に — they're relative, not absolute."},
{id:"GA04",lv:1,l:4,t:"対比",jp:"きょう / あした / まいあさ ＋ ✗に",en:"relative time words refuse に",ja:"あした日本へ行きます。",kn:"あしたにほんへいきます。",ee:"I'm going to Japan tomorrow.",n:"Classic test trap. 六時に○ but 明日に✗. If the word only means something relative to 'now', it takes no particle."},
{id:"GA05",lv:1,l:5,t:"助詞",jp:"〜へ / 〜に（方向）",en:"to [a destination]",ja:"京都へ行きます。",kn:"きょうとへいきます。",ee:"I'm going to Kyoto.",n:"へ is written へ but pronounced E. With 行きます・来ます・帰ります both へ and に work; へ leans on the direction, に on the arrival point."},
{id:"GA06",lv:1,l:5,t:"助詞",jp:"〜で（手段）",en:"by [means of transport / tool / language]",ja:"電車で行きます。",kn:"でんしゃでいきます。",ee:"I'll go by train.",n:"But 歩いて行きます takes NO で — walking isn't a vehicle you get inside. Frequently tested."},
{id:"GA07",lv:1,l:6,t:"対比",jp:"〜で（動作の場所） ⇔ 〜に（存在の場所）",en:"で = where an action happens; に = where a thing exists",ja:"食堂で昼ごはんを食べます。",kn:"しょくどうでひるごはんをたべます。",ee:"I eat lunch in the cafeteria.",n:"THE particle question on every early test. Verb of doing → で. あります・います・住んでいます → に. 'I study in my room' で / 'my book is in my room' に."},
{id:"GA08",lv:1,l:6,t:"文型",jp:"〜ませんか ⇔ 〜ましょう",en:"ませんか = inviting (you may say no); ましょう = let's (already agreed)",ja:"いっしょに昼ごはんを食べませんか。",kn:"いっしょにひるごはんをたべませんか。",ee:"Won't you have lunch with me?",n:"Backwards-feeling: the NEGATIVE question is the polite one. Opening with ましょう to a stranger sounds like you've decided for them."},
{id:"GA09",lv:1,l:7,t:"助詞",jp:"〜で（道具）",en:"with / using [a tool]",ja:"はしで食べます。",kn:"はしでたべます。",ee:"I eat with chopsticks.",n:"Same で as transport — Japanese treats a train and a pair of chopsticks as the same kind of instrument."},
{id:"GA10",lv:1,l:7,t:"授受",jp:"〜に あげます ⇔ 〜に もらいます",en:"に marks the receiver with あげます, but the SOURCE with もらいます",ja:"友達に花をもらいました。",kn:"ともだちにはなをもらいました。",ee:"I received flowers from a friend.",n:"に flips direction depending on the verb. With もらいます you can swap in から; with あげます you cannot."},
{id:"GA11",lv:1,l:8,t:"対比",jp:"い形容詞 ⇔ な形容詞（否定・過去）",en:"い-adj: 高くない / 高かった. な-adj: 静かじゃない / 静かでした",ja:"この部屋は静かじゃありません。",kn:"このへやはしずかじゃありません。",ee:"This room isn't quiet.",n:"い-adjectives conjugate like verbs; な-adjectives are really nouns wearing a costume. いい is irregular: よくない, よかった — never いくない."},
{id:"GA12",lv:1,l:9,t:"助詞",jp:"〜が 好き／上手／わかります／あります",en:"が, not を, for liking, skill, understanding, having",ja:"日本語がわかります。",kn:"にほんごがわかります。",ee:"I understand Japanese.",n:"Feels wrong to English brains: 'I understand Japanese' has no object in Japanese. The Japanese is closer to 'Japanese is understandable [to me]'."},
{id:"GA13",lv:1,l:9,t:"助詞",jp:"〜から（理由）",en:"because ～ — reason clause comes FIRST",ja:"時間がありませんから、行きません。",kn:"じかんがありませんから、いきません。",ee:"I won't go, because I have no time.",n:"Reverse of English order. から sits at the END of the reason, not the start."},
{id:"GA14",lv:1,l:10,t:"対比",jp:"あります ⇔ います",en:"あります = inanimate; います = animate (people, animals)",ja:"庭に猫がいます。",kn:"にわにねこがいます。",ee:"There's a cat in the garden.",n:"Plants and dead fish take あります; a fish swimming in a tank takes います. The line is 'can it move itself', not 'is it alive'."},
{id:"GA15",lv:1,l:11,t:"文型",jp:"数量詞 ＋ 動詞（助詞なし）",en:"counters sit bare, right before the verb",ja:"りんごを四つ買いました。",kn:"りんごをよっつかいました。",ee:"I bought four apples.",n:"No particle on the number. 四つのりんごを買いました is grammatical but stiff and rarely what a test wants."},
{id:"GA16",lv:1,l:11,t:"助詞",jp:"期間 ＋ 動詞（助詞なし）",en:"durations take no particle",ja:"一週間休みます。",kn:"いっしゅうかんやすみます。",ee:"I'll take a week off.",n:"Compare 三時に (point in time, に) vs 三時間 (duration, nothing). One kanji 間 flips the particle rule."},
{id:"GA17",lv:1,l:12,t:"文型",jp:"〜のほうが〜より〜です",en:"A is more ～ than B",ja:"電車のほうがバスより速いです。",kn:"でんしゃのほうがばすよりはやいです。",ee:"The train is faster than the bus.",n:"より attaches to the LOSER and follows it. English puts 'than' before the loser; Japanese puts より after it."},
{id:"GA18",lv:1,l:12,t:"文型",jp:"〜の中で〜が一番〜です",en:"among ～, ～ is the most ～",ja:"スポーツで何が一番好きですか。",kn:"すぽーつでなにがいちばんすきですか。",ee:"Among sports, what do you like best?",n:"Category takes で (or の中で). And the answer needs が, never は — superlatives select, and selection is が's job."},
{id:"GA19",lv:1,l:13,t:"文型",jp:"〜が欲しいです / 〜たいです",en:"want [a thing] / want to [do]",ja:"冷たい水が飲みたいです。",kn:"つめたいみずがのみたいです。",ee:"I want to drink cold water.",n:"を softens to が once たい appears. Both are accepted in speech, but が is the textbook answer. Also: never use these to describe a third person's wants — that needs 〜たがっています."},
{id:"GA20",lv:1,l:13,t:"文型",jp:"ますstem ＋ に行きます",en:"go in order to [do]",ja:"デパートへかばんを買いに行きます。",kn:"でぱーとへかばんをかいにいきます。",ee:"I'm going to the department store to buy a bag.",n:"Drop ます, add に. With する-verbs the noun alone works: 買い物に行きます, not 買い物しに行きます."},
{id:"GA21",lv:1,l:14,t:"動詞形",jp:"て形（I類）",en:"い・ち・り→って ／ み・び・に→んで ／ き→いて ／ ぎ→いで ／ し→して",ja:"急いで来てください。",kn:"いそいできてください。",ee:"Please come quickly.",n:"The one exception that ruins the pattern: 行きます → 行って, not 行いて. Test writers love it."},
{id:"GA22",lv:1,l:14,t:"文型",jp:"〜ています（進行）",en:"is ～ing, right now",ja:"今、雨が降っています。",kn:"いま、あめがふっています。",ee:"It's raining right now.",n:"Only works with verbs that take time. 結婚しています does NOT mean 'is getting married' — see the resultant-state card."},
{id:"GA23",lv:1,l:15,t:"文型",jp:"〜てもいいですか ⇔ 〜てはいけません",en:"may I ～? / you mustn't ～",ja:"写真を撮ってもいいですか。",kn:"しゃしんをとってもいいですか。",ee:"May I take a photo?",n:"いけません is blunt — a sign or a boss says it, a friend doesn't. Softer refusal: ちょっと…（trailing off）."},
{id:"GA24",lv:1,l:15,t:"対比",jp:"〜ています（結果の状態）",en:"the action finished; its RESULT is still true",ja:"彼は結婚しています。",kn:"かれはけっこんしています。",ee:"He is married.",n:"Same ています, opposite meaning. 知っています = I know; 住んでいます = I live. But the negative of 知っています is 知りません, never 知っていません — a lopsided pair worth memorising alone."},
{id:"GA25",lv:1,l:16,t:"文型",jp:"〜てから",en:"after doing ～, then ～",ja:"仕事が終わってから、飲みに行きます。",kn:"しごとがおわってから、のみにいきます。",ee:"After work finishes, I'll go drinking.",n:"Only the FINAL verb carries the tense. 終わってからました is impossible — the て-half never conjugates."},
{id:"GA26",lv:1,l:17,t:"動詞形",jp:"ない形",en:"I類 i→a row + ない ／ II類 stem + ない ／ III類 しない・来ない",ja:"今日は会社へ行かない。",kn:"きょうはかいしゃへいかない。",ee:"I'm not going to work today.",n:"買います → 買わない, not 買あない — う-verbs insert わ. And あります → ない, the biggest irregular in the language."},
{id:"GA27",lv:1,l:17,t:"文型",jp:"〜なければなりません",en:"must ～ (lit. 'if I don't, it won't do')",ja:"薬を飲まなければなりません。",kn:"くすりをのまなければなりません。",ee:"I have to take medicine.",n:"A double negative that means MUST. Casual shortcuts you'll hear: 〜なきゃ / 〜ないと."},
{id:"GA28",lv:1,l:17,t:"文型",jp:"〜なくてもいいです",en:"you don't have to ～",ja:"急がなくてもいいですよ。",kn:"いそがなくてもいいですよ。",ee:"You don't have to hurry.",n:"The merciful cousin of なければなりません: 'even not-doing is fine.' Watch the shape — なくて, not ないで."},
{id:"GA29",lv:1,l:17,t:"対比",jp:"〜ないで ⇔ 〜なくて",en:"ないで = without doing it / instead; なくて = because it wasn't",ja:"昨日は寝ないで勉強しました。",kn:"きのうはねないでべんきょうしました。",ee:"Yesterday I studied without sleeping.",n:"ないで links two actions by the same person; なくて gives a reason. 'Didn't sleep, so I'm tired' = 寝なくて疲れました."},
{id:"GA30",lv:1,l:18,t:"動詞形",jp:"辞書形",en:"I類 i→u row ／ II類 stem + る ／ III類 する・来る",ja:"漢字を読むことができます。",kn:"かんじをよむことができます。",ee:"I can read kanji.",n:"The form dictionaries list. From ます-form: 書きます→書く, 食べます→食べる, します→する."},
{id:"GA31",lv:1,l:18,t:"文型",jp:"〜前に",en:"before ～",ja:"寝る前に、歯を磨きます。",kn:"ねるまえに、はをみがきます。",ee:"Before bed I brush my teeth.",n:"ALWAYS dictionary form before 前に, even when the sentence is past: 寝る前に磨きました. Nouns take の: 食事の前に."},
{id:"GA32",lv:1,l:19,t:"文型",jp:"〜たことがあります",en:"have ever done ～ (experience)",ja:"富士山に登ったことがあります。",kn:"ふじさんにのぼったことがあります。",ee:"I've climbed Mt. Fuji.",n:"Experience, not recent past. 昨日すしを食べたことがあります is wrong — yesterday is too close to count as 'ever'."},
{id:"GA33",lv:1,l:19,t:"文型",jp:"〜たり〜たりします",en:"do things like ～ and ～ (a sample, not a list)",ja:"日曜日は掃除したり、洗濯したりします。",kn:"にちようびはそうじしたり、せんたくしたりします。",ee:"On Sundays I do things like cleaning and laundry.",n:"Deliberately incomplete — it implies 'among other things'. The last たり still needs する, and the tense lands on that する."},
{id:"GA34",lv:1,l:19,t:"文型",jp:"〜くなります / 〜になります",en:"い-adj → く + なります; な-adj & nouns → に + なります",ja:"寒くなりました。",kn:"さむくなりました。",ee:"It's gotten cold.",n:"Straight two-way sort, but 有名 and 元気 look like い-adjectives and aren't: 有名になります."},
{id:"GA35",lv:1,l:20,t:"文型",jp:"普通形（casual）",en:"drop です・ます: 行く / 行かない / 行った / 行かなかった",ja:"明日、時間ある？",kn:"あした、じかんある？",ee:"Got time tomorrow?",n:"な-adjectives and nouns keep だ in statements but DROP it in questions: 元気？ not 元気だ？"},
{id:"GA36",lv:1,l:21,t:"文型",jp:"〜と思います",en:"I think that ～",ja:"彼は来ないと思います。",kn:"かれはこないとおもいます。",ee:"I don't think he'll come.",n:"Japanese negates the inner clause: 来ないと思います, not 来ると思いません. English does the opposite."},
{id:"GA37",lv:1,l:21,t:"文型",jp:"〜と言っていました",en:"he/she said that ～ (reported speech)",ja:"田中さんは来週休むと言っていました。",kn:"たなかさんはらいしゅうやすむといっていました。",ee:"Tanaka said he'd take next week off.",n:"Plain form before と. 言いました reports the act of speaking; 言っていました reports the content — the second is what you want when passing on a message."},
{id:"GA38",lv:1,l:22,t:"文型",jp:"名詞修飾（relative clause）",en:"the clause goes BEFORE the noun, plain form, no 'that/which'",ja:"これは私が撮った写真です。",kn:"これはわたしがとったしゃしんです。",ee:"This is the photo I took.",n:"The clause's subject switches from は to が. English relative pronouns simply don't exist here — the clause just leans against the noun."},
{id:"GA39",lv:1,l:23,t:"対比",jp:"〜とき",en:"when ～ — the tense of the とき clause is RELATIVE, not absolute",ja:"日本へ行くとき、かばんを買いました。",kn:"にほんへいくとき、かばんをかいました。",ee:"When I went to Japan, I bought a bag [before departing].",n:"行くとき = bought before going. 行ったとき = bought after arriving. One kana changes where you were standing."},
{id:"GA40",lv:1,l:23,t:"条件",jp:"〜と（自然な結果）",en:"whenever A, B automatically follows",ja:"このボタンを押すと、水が出ます。",kn:"このぼたんをおすと、みずがでます。",ee:"If you press this button, water comes out.",n:"For machines, maps, and laws of nature. と can never be followed by a request, invitation, or intention — 押すと、押してください is broken."},
{id:"GA41",lv:1,l:24,t:"授受",jp:"あげます / くれます / もらいます",en:"あげます = I→others; くれます = others→ME; もらいます = I receive",ja:"友達が本を貸してくれました。",kn:"ともだちがほんをかしてくれました。",ee:"My friend lent me a book.",n:"English has one verb 'give'; Japanese splits it by direction. Using あげます for something done TO you is the single most common learner error — and it sounds arrogant."},
{id:"GA42",lv:1,l:25,t:"条件",jp:"〜たら",en:"if / when A happens, then B — the all-purpose conditional",ja:"雨が降ったら、行きません。",kn:"あめがふったら、いきません。",ee:"If it rains, I won't go.",n:"The most permissive of the four conditionals: it accepts requests, invitations and intentions in the second half, where と cannot."},
{id:"GA43",lv:1,l:25,t:"文型",jp:"〜ても",en:"even if ～",ja:"雨が降っても、行きます。",kn:"あめがふっても、いきます。",ee:"Even if it rains, I'll go.",n:"Built on て-form + も. 降ったら vs 降っても is one syllable apart and completely opposite: 'if' vs 'even if'."}
];
/* 初級II — Minna no Nihongo Shokyuu II, lessons 26–50 */
const GRAM_S2=[
{id:"GB01",lv:2,l:26,t:"文型",jp:"〜んです",en:"explains, asks for an explanation, or sets up a request",ja:"どうして遅れたんですか。",kn:"どうしておくれたんですか。",ee:"Why were you late? [I'd like the story]",n:"Plain form + んです; な-adj and nouns insert な: 元気なんです. Asking a bare どうして遅れましたか sounds like an accusation — んです softens it into curiosity."},
{id:"GB02",lv:2,l:27,t:"動詞形",jp:"可能形",en:"I類 u→e row + る ／ II類 stem + られる ／ できる・来られる",ja:"日本語が話せます。",kn:"にほんごがはなせます。",ee:"I can speak Japanese.",n:"The object flips を→が once the verb is potential. 日本語を話せます is heard, but が is the marked-correct answer."},
{id:"GB03",lv:2,l:27,t:"対比",jp:"見えます ⇔ 見られます",en:"見えます = it's visible (nothing you did); 見られます = you're able to see it",ja:"部屋から海が見えます。",kn:"へやからうみがみえます。",ee:"You can see the sea from the room.",n:"見えます isn't a potential form at all — it's its own verb meaning the thing enters your eyes. 見られます means the opportunity exists. Same for 聞こえます ⇔ 聞けます."},
{id:"GB04",lv:2,l:27,t:"文型",jp:"〜しか〜ません",en:"only ～ (and that's not enough)",ja:"百円しかありません。",kn:"ひゃくえんしかありません。",ee:"I only have 100 yen.",n:"しか REQUIRES a negative verb, and it carries regret. だけ is neutral: 百円だけあります is just a fact."},
{id:"GB05",lv:2,l:28,t:"文型",jp:"〜ながら",en:"doing A while doing B (same person, B is the main action)",ja:"音楽を聞きながら勉強します。",kn:"おんがくをききながらべんきょうします。",ee:"I study while listening to music.",n:"ますstem + ながら. The MAIN action is the second one — 聞きながら勉強します is studying, not listening."},
{id:"GB06",lv:2,l:29,t:"自他",jp:"自動詞 ⇔ 他動詞",en:"自動詞: が + happens by itself ／ 他動詞: を + someone does it",ja:"窓が開いています。",kn:"まどがあいています。",ee:"The window is open.",n:"開きます/開けます, 閉まります/閉めます, つきます/つけます — pairs that English collapses into one word. The particle gives it away: が for 自, を for 他."},
{id:"GB07",lv:2,l:29,t:"対比",jp:"〜ています ⇔ 〜てあります",en:"自動詞+ています = just the state ／ 他動詞+てあります = state someone made on purpose",ja:"窓が開けてあります。",kn:"まどがあけてあります。",ee:"The window has been opened [by someone, deliberately].",n:"The most-tested contrast in Shokyuu II. 開いています = it's open, no comment on why. 開けてあります = somebody opened it and left it that way. Note てあります takes が even though 開けます is a を-verb."},
{id:"GB08",lv:2,l:30,t:"文型",jp:"〜ておきます",en:"do ～ in advance / leave it done",ja:"旅行の前に切符を買っておきます。",kn:"りょこうのまえにきっぷをかっておきます。",ee:"I'll buy the tickets before the trip.",n:"Preparation with an eye on later. Contracts to 〜とく in speech: 買っとく."},
{id:"GB09",lv:2,l:31,t:"動詞形",jp:"意向形",en:"I類 u→o row + う ／ II類 stem + よう ／ しよう・来よう",ja:"来年、留学しようと思っています。",kn:"らいねん、りゅうがくしようとおもっています。",ee:"I'm thinking of studying abroad next year.",n:"The plain form of ましょう. Alone it's a casual 'let's'; with と思っています it's your own settled plan."},
{id:"GB10",lv:2,l:31,t:"対比",jp:"〜(よ)うと思います ⇔ 〜つもりです",en:"意向形+と思います = decided just now / つもりです = a standing intention",ja:"日本で働くつもりです。",kn:"にほんではたらくつもりです。",ee:"I intend to work in Japan.",n:"つもり is firmer and older; 〜(よ)うと思っています (with い) sits in between. Note つもり takes the DICTIONARY form, not 意向形."},
{id:"GB11",lv:2,l:32,t:"文型",jp:"〜たほうがいいです",en:"you'd better ～ / it'd be better not to ～",ja:"薬を飲んだほうがいいですよ。",kn:"くすりをのんだほうがいいですよ。",ee:"You'd better take some medicine.",n:"Affirmative uses た形; negative uses ない形 — 飲まないほうがいい, never 飲まなかったほうがいい."},
{id:"GB12",lv:2,l:32,t:"対比",jp:"〜でしょう ⇔ 〜かもしれません",en:"でしょう ≈ probably (fairly sure) ／ かもしれません ≈ might (much less sure)",ja:"明日は雨が降るでしょう。",kn:"あしたはあめがふるでしょう。",ee:"It'll probably rain tomorrow.",n:"Confidence ladder: 〜ます (certain) > でしょう > かもしれません. Rising でしょう↗ is a different animal — it's seeking agreement."},
{id:"GB13",lv:2,l:33,t:"動詞形",jp:"命令形・禁止形",en:"命令: u→e row / stem+ろ / しろ・来い ／ 禁止: 辞書形 + な",ja:"ここに入るな。",kn:"ここにはいるな。",ee:"Do not enter.",n:"Harsh — signs, coaches, and angry people. As a learner you'll almost never say these, but you must read them: 止まれ, 危険, 触るな."},
{id:"GB14",lv:2,l:34,t:"文型",jp:"〜とおりに",en:"exactly as ～",ja:"私が言ったとおりにしてください。",kn:"わたしがいったとおりにしてください。",ee:"Please do it exactly as I said.",n:"Verb takes plain form; nouns take の: 説明書のとおりに. Reading shifts to どおり when it fuses to a noun: 予定どおり."},
{id:"GB15",lv:2,l:34,t:"対比",jp:"〜てから ⇔ 〜あとで",en:"てから = A then B, tight sequence ／ あとで = simply later, looser",ja:"ご飯を食べたあとで、散歩します。",kn:"ごはんをたべたあとで、さんぽします。",ee:"After eating, I'll take a walk.",n:"あとで takes た形; てから takes て形. てから implies B depends on A finishing; あとで just orders them on a timeline."},
{id:"GB16",lv:2,l:35,t:"条件",jp:"〜ば（条件形）",en:"I類 u→e row + ば ／ II類 stem + れば ／ すれば・来れば",ja:"安ければ買います。",kn:"やすければかいます。",ee:"If it's cheap, I'll buy it.",n:"い-adjectives: 安い→安ければ. Strong general condition — but if both clauses are actions by the same person, ば gets blocked and you need たら."},
{id:"GB17",lv:2,l:35,t:"条件",jp:"〜なら",en:"if we're talking about ～ / given what you just said",ja:"京都へ行くなら、バスが便利ですよ。",kn:"きょうとへいくなら、ばすがべんりですよ。",ee:"If you're going to Kyoto, the bus is handy.",n:"なら picks up the OTHER person's topic and advises on it. It's the only conditional that can put the second clause earlier in time than the first."},
{id:"GB18",lv:2,l:35,t:"対比",jp:"と ／ ば ／ たら ／ なら",en:"と = automatic ／ ば = general condition ／ たら = anything goes ／ なら = given that topic",ja:"春になったら、桜が咲きます。",kn:"はるになったら、さくらがさきます。",ee:"When spring comes, the cherries bloom.",n:"The four-way split that eats N4 test-takers. When stuck, たら is safest — it's the only one that freely allows a request, invitation or plan in the second half."},
{id:"GB19",lv:2,l:36,t:"文型",jp:"〜ように / 〜ようになります",en:"so that ～ / reach the point where ～",ja:"日本語が話せるようになりました。",kn:"にほんごがはなせるようになりました。",ee:"I've become able to speak Japanese.",n:"Marks a change you didn't control. Takes potential or non-volitional verbs — for a deliberate habit you'd say 〜ことにしました."},
{id:"GB20",lv:2,l:37,t:"動詞形",jp:"受身形",en:"I類 a-row + れる ／ II類 stem + られる ／ される・来られる",ja:"先生に褒められました。",kn:"せんせいにほめられました。",ee:"I was praised by the teacher.",n:"Group II potential and passive are IDENTICAL (食べられる) — only context separates them. The doer takes に."},
{id:"GB21",lv:2,l:37,t:"文型",jp:"迷惑の受身",en:"passive used to say something happened TO you, unwanted",ja:"雨に降られました。",kn:"あめにふられました。",ee:"I got rained on.",n:"Has no English equivalent. 財布を盗まれました keeps を — the thing taken stays the object while YOU are the victim-subject."},
{id:"GB22",lv:2,l:38,t:"対比",jp:"〜の ⇔ 〜こと（nominaliser）",en:"の for direct/sensory experience; こと for abstract facts",ja:"ピアノを弾くのが好きです。",kn:"ぴあのをひくのがすきです。",ee:"I like playing the piano.",n:"見る・聞く・手伝う・やめる demand の. 〜ができます, 〜が多い and set phrases like ことがあります demand こと."},
{id:"GB23",lv:2,l:39,t:"対比",jp:"〜ので ⇔ 〜から",en:"ので = softer, more objective ／ から = more personal, more assertive",ja:"用事がありますので、お先に失礼します。",kn:"ようじがありますので、おさきにしつれいします。",ee:"I have an errand, so I'll head off first.",n:"Excuses to a boss take ので. な-adj and nouns need な before ので: 病気なので."},
{id:"GB24",lv:2,l:39,t:"文型",jp:"〜て（原因）",en:"て-form as a cause: 'because of A, B'",ja:"道が込んでいて、遅れました。",kn:"みちがこんでいて、おくれました。",ee:"The roads were crowded, so I was late.",n:"The B half cannot be a request, invitation or command — those need から or ので. て-cause only reports things that simply happened."},
{id:"GB25",lv:2,l:40,t:"文型",jp:"〜かどうか",en:"whether or not ～",ja:"来るかどうかわかりません。",kn:"くるかどうかわかりません。",ee:"I don't know whether he's coming.",n:"For yes/no questions. If the embedded question already has a question word, drop どうか: だれが来るか知っていますか。"},
{id:"GB26",lv:2,l:40,t:"文型",jp:"〜てみます",en:"try doing ～ and see how it goes",ja:"着物を着てみたいです。",kn:"きものをきてみたいです。",ee:"I'd like to try wearing a kimono.",n:"Trying-to-see, not trying-hard. Attempting with effort is 〜ようとします — 開けようとしましたが、開きませんでした."},
{id:"GB27",lv:2,l:41,t:"敬語",jp:"いただきます / くださいます / やります",en:"humble receive / honorific give-to-me / give-to-junior",ja:"部長が推薦状を書いてくださいました。",kn:"ぶちょうがすいせんじょうをかいてくださいました。",ee:"The department head kindly wrote me a reference.",n:"The あげる/くれる/もらう triangle, raised one social storey. くださる and いただく both mean the gift came to you — くださる honours the giver, いただく lowers you."},
{id:"GB28",lv:2,l:42,t:"文型",jp:"〜のに / 〜に（目的）",en:"for the purpose of ～",ja:"この鋏は花を切るのに使います。",kn:"このはさみははなをきるのにつかいます。",ee:"These scissors are used for cutting flowers.",n:"Purpose-のに, unrelated to the 'although' のに. Nouns take に directly: 旅行に便利です."},
{id:"GB29",lv:2,l:43,t:"伝聞",jp:"〜そうです（様態）",en:"looks like ～ / seems about to ～ (from what you can see)",ja:"雨が降りそうです。",kn:"あめがふりそうです。",ee:"It looks like it's going to rain.",n:"ますstem or adjective stem + そう. いい→よさそう, ない→なさそう are irregular. Never for things you can't see: 彼は学生そうです is wrong."},
{id:"GB30",lv:2,l:44,t:"文型",jp:"〜すぎます",en:"too much ～",ja:"ゆうべ飲みすぎました。",kn:"ゆうべのみすぎました。",ee:"I drank too much last night.",n:"Always negative in flavour — it means 'past the acceptable line', so 面白すぎます sounds odd unless you're being playful."},
{id:"GB31",lv:2,l:44,t:"文型",jp:"〜やすいです / 〜にくいです",en:"easy to ～ / hard to ～",ja:"この薬は飲みやすいです。",kn:"このくすりはのみやすいです。",ee:"This medicine is easy to take.",n:"ますstem + やすい/にくい, and the compound then behaves as an い-adjective: 飲みやすかったです."},
{id:"GB32",lv:2,l:45,t:"文型",jp:"〜場合は",en:"in the case that ～",ja:"時間に間に合わない場合は、連絡してください。",kn:"じかんにまにあわないばあいは、れんらくしてください。",ee:"If you can't make it on time, please get in touch.",n:"Formal — signs, manuals, contracts. Nouns take の: 火事の場合は."},
{id:"GB33",lv:2,l:45,t:"対比",jp:"〜のに（逆接）",en:"although ～ — and I'm annoyed or surprised about it",ja:"約束したのに、来ませんでした。",kn:"やくそくしたのに、きませんでした。",ee:"He promised, and yet he didn't come.",n:"のに carries feeling; が and けど are neutral. Because of that, のに can't be followed by a request or invitation."},
{id:"GB34",lv:2,l:46,t:"文型",jp:"〜ところです",en:"辞書形＝about to ／ ています＝mid-way ／ た形＝just finished",ja:"今、出かけるところです。",kn:"いま、でかけるところです。",ee:"I'm just about to head out.",n:"Three time-slices off one word. 食べるところ (haven't started) / 食べているところ (eating) / 食べたところ (just finished)."},
{id:"GB35",lv:2,l:46,t:"対比",jp:"〜たばかりです",en:"just did it — as far as the SPEAKER feels",ja:"日本へ来たばかりです。",kn:"にほんへきたばかりです。",ee:"I've only just come to Japan.",n:"Unlike たところ, ばかり isn't tied to the clock. 三年前に買ったばかりの車 is fine — it feels new to you, and that's enough."},
{id:"GB36",lv:2,l:46,t:"文型",jp:"〜はずです",en:"it should be ～ (I have grounds to expect it)",ja:"彼は今日来るはずです。",kn:"かれはきょうくるはずです。",ee:"He's supposed to be coming today.",n:"Expectation from evidence, not obligation. 'You should study' is 勉強したほうがいい — はず would mean 'I expect you're studying'."},
{id:"GB37",lv:2,l:47,t:"伝聞",jp:"〜そうです（伝聞）",en:"I hear that ～ / they say that ～",ja:"天気予報によると、明日は雪だそうです。",kn:"てんきよほうによると、あしたはゆきだそうです。",ee:"According to the forecast, it'll snow tomorrow.",n:"Same そうです, opposite job. Hearsay takes the PLAIN form before it (降るそうです); appearance takes the stem (降りそうです). One kana of difference."},
{id:"GB38",lv:2,l:47,t:"伝聞",jp:"〜ようです",en:"it seems ～ (my own inference from evidence)",ja:"誰かいるようです。",kn:"だれかいるようです。",ee:"It seems someone's here.",n:"らしい is close but leans on outside information; ようです leans on what you personally sense. みたいです is the casual twin of ようです."},
{id:"GB39",lv:2,l:48,t:"動詞形",jp:"使役形",en:"I類 a-row + せる ／ II類 stem + させる ／ させる・来させる",ja:"部長は私を大阪へ出張させました。",kn:"ぶちょうはわたしをおおさかへしゅっちょうさせました。",ee:"The boss sent me to Osaka on business.",n:"Make OR let — the verb doesn't distinguish; context does. Intransitive verbs mark the person with を, transitive ones with に."},
{id:"GB40",lv:2,l:48,t:"敬語",jp:"〜(さ)せていただけませんか",en:"would you let me ～? (very humble request)",ja:"早退させていただけませんか。",kn:"そうたいさせていただけませんか。",ee:"Might I be allowed to leave early?",n:"Causative + receiving + potential + negative question, stacked. Literally 'could I not receive the favour of being made to leave early' — the politeness comes from the sheer distance."},
{id:"GB41",lv:2,l:49,t:"敬語",jp:"尊敬語",en:"raise the OTHER person: お〜になります / 〜(ら)れます / special verbs",ja:"社長はもうお帰りになりました。",kn:"しゃちょうはもうおかえりになりました。",ee:"The president has already gone home.",n:"Special verbs beat the patterns: いらっしゃいます (行く/来る/いる), 召し上がります (食べる/飲む), おっしゃいます (言う), なさいます (する), ご覧になります (見る)."},
{id:"GB42",lv:2,l:50,t:"敬語",jp:"謙譲語",en:"lower YOURSELF: お〜します + special verbs",ja:"駅までお送りします。",kn:"えきまでおおくりします。",ee:"I'll see you to the station.",n:"Only for actions that touch the other person. Specials: 参ります (行く/来る), いたします (する), 申します (言う), 拝見します (見る), 伺います (聞く/行く), いただきます (食べる/もらう)."},
{id:"GB43",lv:2,l:50,t:"対比",jp:"尊敬語 ⇔ 謙譲語",en:"honorific lifts THEM; humble lowers YOU — never mix them up",ja:"何を召し上がりますか。",kn:"なにをめしあがりますか。",ee:"What will you have? [to a guest]",n:"Saying 何をいただきますか to a guest demotes them. The test loves showing you a sentence about yourself dressed in 尊敬語 and asking what's wrong."}
];
/* 中級・JLPT — Chuukyuu I/II and N3–N1 patterns */
const GRAM_CH=[
{id:"GC01",lv:3,l:0,t:"文型",jp:"〜わけだ",en:"that's why ～ / it follows that ～",ja:"三年住んでいたのか。道理で詳しいわけだ。",kn:"さんねんすんでいたのか。どうりでくわしいわけだ。",ee:"You lived there three years — no wonder you know it so well.",n:"わけ is a conclusion you just worked out. はず is an expectation you held in advance — that's the whole difference."},
{id:"GC02",lv:3,l:0,t:"対比",jp:"〜わけではない ⇔ 〜わけがない",en:"ではない = not entirely so ／ がない = no way, impossible",ja:"嫌いなわけではありません。",kn:"きらいなわけではありません。",ee:"It's not that I dislike it.",n:"One particle apart, miles apart in force. ではない softens a partial denial; がない slams the door."},
{id:"GC03",lv:3,l:0,t:"文型",jp:"〜に違いない",en:"must be ～ (I'm certain)",ja:"彼が犯人に違いない。",kn:"かれがはんにんにちがいない。",ee:"He must be the culprit.",n:"Conviction from evidence. はずだ expects; に違いない insists. Nouns and な-adj attach bare — 犯人に違いない, not 犯人なに違いない."},
{id:"GC04",lv:3,l:0,t:"文型",jp:"〜ものだ",en:"that's how it is / used to ～ / you really ought to ～",ja:"子どものころ、よく川で泳いだものだ。",kn:"こどものころ、よくかわでおよいだものだ。",ee:"As a kid I used to swim in the river a lot.",n:"Three jobs from one word: general truth (辞書形), nostalgic habit (た形), and mild scolding (〜ものではない)."},
{id:"GC05",lv:3,l:0,t:"文型",jp:"〜べきだ",en:"ought to ～ (a moral or logical duty)",ja:"約束は守るべきだ。",kn:"やくそくはまもるべきだ。",ee:"You should keep your promises.",n:"Heavier than 〜たほうがいい — it appeals to principle. する is irregular: すべき is preferred over するべき."},
{id:"GC06",lv:3,l:0,t:"文型",jp:"〜ざるを得ない",en:"have no choice but to ～",ja:"認めざるを得ない。",kn:"みとめざるをえない。",ee:"I have no choice but to admit it.",n:"ない-form minus ない, plus ざるを得ない. する is irregular: せざるを得ない, never しざるを得ない."},
{id:"GC07",lv:3,l:0,t:"対比",jp:"〜にとって ⇔ 〜に対して",en:"にとって = from the standpoint of ／ に対して = directed at / in contrast to",ja:"私にとって家族が一番大切です。",kn:"わたしにとってかぞくがいちばんたいせつです。",ee:"For me, family matters most.",n:"にとって is followed by an evaluation (大切, 必要, 難しい). に対して is followed by an action aimed at a target — 質問に対して答える."},
{id:"GC08",lv:3,l:0,t:"文型",jp:"〜として",en:"in the capacity of ～ / as a ～",ja:"留学生として日本へ来ました。",kn:"りゅうがくせいとしてにほんへきました。",ee:"I came to Japan as an exchange student.",n:"A role or status, not a comparison. 'As big as a house' is a different grammar entirely — 〜ぐらい/〜ほど."},
{id:"GC09",lv:3,l:0,t:"文型",jp:"〜によって",en:"by (agent) / depending on / due to / by means of",ja:"人によって考え方が違います。",kn:"ひとによってかんがえかたがちがいます。",ee:"Ways of thinking differ from person to person.",n:"Four meanings in one phrase — the sentence's ending tells you which. 違います/変わります → 'depending on'; a passive verb → 'by'."},
{id:"GC10",lv:3,l:0,t:"文型",jp:"〜ついでに",en:"while you're at it / on the same occasion",ja:"買い物のついでに郵便局へ寄った。",kn:"かいもののついでにゆうびんきょくへよった。",ee:"While out shopping, I dropped by the post office.",n:"The main errand comes FIRST. ながら is simultaneous; ついでに is opportunistic — one trip, two purposes."},
{id:"GC11",lv:3,l:0,t:"文型",jp:"〜とたん（に）",en:"the instant ～, [something unexpected]",ja:"ドアを開けたとたん、猫が飛び出した。",kn:"どあをあけたとたん、ねこがとびだした。",ee:"The moment I opened the door, the cat shot out.",n:"Always た形 before it, always a surprise after it, always past tense. You can't plan a とたん — 開けたとたん、入ります is broken."},
{id:"GC12",lv:3,l:0,t:"文型",jp:"〜次第",en:"as soon as ～ (then I'll do something deliberate)",ja:"着き次第、連絡します。",kn:"つきしだい、れんらくします。",ee:"I'll contact you as soon as I arrive.",n:"ますstem + 次第. Formal, and the second half must be your intention — the mirror image of とたん, which forbids intention."},
{id:"GC13",lv:3,l:0,t:"対比",jp:"〜くせに ⇔ 〜のに",en:"both = 'although', but くせに adds contempt",ja:"知っているくせに教えてくれない。",kn:"しっているくせにおしえてくれない。",ee:"He knows and still won't tell me.",n:"くせに is rude and only works when the subject is a person you're criticising. Never use it about yourself or your boss."},
{id:"GC14",lv:3,l:0,t:"対比",jp:"〜おかげで ⇔ 〜せいで",en:"おかげで = thanks to (good) ／ せいで = because of (bad, and I blame it)",ja:"先生のおかげで合格できました。",kn:"せんせいのおかげでごうかくできました。",ee:"Thanks to my teacher, I passed.",n:"Both mean 'because of', but they're emotionally opposite. Using せいで where おかげで belongs turns gratitude into an accusation."},
{id:"GC15",lv:3,l:0,t:"文型",jp:"〜だらけ",en:"covered in ～ (unpleasantly)",ja:"部屋がほこりだらけだ。",kn:"へやがほこりだらけだ。",ee:"The room is covered in dust.",n:"Always negative and always physical scatter — 泥, 血, 間違い. 'Full of' in a good sense is 〜でいっぱい."},
{id:"GC16",lv:3,l:0,t:"文型",jp:"〜がち / 〜気味",en:"prone to ～ / a touch of ～",ja:"最近、風邪気味です。",kn:"さいきん、かぜぎみです。",ee:"I've had a bit of a cold lately.",n:"がち = a tendency that repeats (忘れがち, 曇りがち). 気味 = a slight current degree (疲れ気味, 太り気味). Both lean negative."},
{id:"GC17",lv:3,l:0,t:"対比",jp:"〜かねない ⇔ 〜かねます",en:"かねない = might well [something bad] ／ かねます = I'm unable to (polite refusal)",ja:"その計画は失敗しかねない。",kn:"そのけいかくはしっぱいしかねない。",ee:"That plan could well fail.",n:"A negative-looking form that means 'possible', and a positive-looking one that means 'cannot'. かねます is the phrase shops use to say no: 致しかねます."},
{id:"GC18",lv:3,l:0,t:"文型",jp:"〜恐れがある",en:"there's a risk that ～",ja:"台風が上陸する恐れがあります。",kn:"たいふうがじょうりくするおそれがあります。",ee:"There's a risk the typhoon will make landfall.",n:"News and official warnings only. Never for small personal risks — 遅れる恐れがあります about your own lateness is comically grave."},
{id:"GC19",lv:3,l:0,t:"文型",jp:"〜ば〜ほど",en:"the more ～, the more ～",ja:"考えれば考えるほどわからなくなる。",kn:"かんがえればかんがえるほどわからなくなる。",ee:"The more I think, the less I understand.",n:"The verb appears twice — ば-form then dictionary form. な-adjectives use なら〜なほど: 便利なら便利なほど."},
{id:"GC20",lv:3,l:0,t:"文型",jp:"〜たびに",en:"every time ～",ja:"彼に会うたびに元気をもらう。",kn:"かれにあうたびにげんきをもらう。",ee:"Every time I see him I come away energised.",n:"Dictionary form only, even for past events. Nouns take の: 試験のたびに."},
{id:"GC21",lv:3,l:0,t:"文型",jp:"〜にもかかわらず",en:"in spite of ～",ja:"雨にもかかわらず、大勢集まった。",kn:"あめにもかかわらず、おおぜいあつまった。",ee:"Despite the rain, a big crowd gathered.",n:"Formal のに. Note it's かかわらず (regardless), not 関わらず in the 'unrelated' sense — the second half is always a surprise."},
{id:"GC22",lv:3,l:0,t:"文型",jp:"〜からには",en:"now that ～, [I'm committed]",ja:"引き受けたからには、最後までやる。",kn:"ひきうけたからには、さいごまでやる。",ee:"Now that I've taken it on, I'll see it through.",n:"The second half must be resolve, duty or judgement — never a plain fact. It's a promise-shaped conjunction."},
{id:"GC23",lv:3,l:0,t:"文型",jp:"〜どころか",en:"far from ～ — in fact quite the opposite",ja:"漢字どころか、ひらがなも読めない。",kn:"かんじどころか、ひらがなもよめない。",ee:"Forget kanji — he can't even read hiragana.",n:"Sets up an expectation and then undercuts it downward. The second half usually carries も or さえ."},
{id:"GC24",lv:3,l:0,t:"文型",jp:"〜上で",en:"after doing ～, [then decide/act]",ja:"よく考えた上で、返事します。",kn:"よくかんがえたうえで、へんじします。",ee:"I'll reply after thinking it over carefully.",n:"た形 + 上で. More deliberate than てから — it implies the first step INFORMS the second, not just precedes it."},
{id:"GC25",lv:3,l:0,t:"文型",jp:"〜ないわけにはいかない",en:"I can't very well not ～ (social obligation)",ja:"招待されたから、行かないわけにはいかない。",kn:"しょうたいされたから、いかないわけにはいかない。",ee:"I was invited, so I can't very well not go.",n:"Obligation from circumstance, not rules. Positive 〜わけにはいかない means the opposite: 'I can't possibly do it' — 休むわけにはいかない."},
{id:"GC26",lv:3,l:0,t:"動詞形",jp:"使役受身形",en:"was made to ～ (against your will)",ja:"子どものころ、毎日ピアノを練習させられた。",kn:"こどものころ、まいにちぴあのをれんしゅうさせられた。",ee:"As a child I was made to practise piano every day.",n:"Causative + passive stacked. Group I contracts: 飲まされる rather than 飲ませられる — but す-verbs refuse to contract (話させられる)."},
{id:"GC27",lv:3,l:0,t:"文型",jp:"〜まい",en:"surely not ～ / I shan't ～",ja:"二度と行くまいと思った。",kn:"にどといくまいとおもった。",ee:"I decided I'd never go again.",n:"Literary negative volitional. Group I takes dictionary form + まい; Group II takes either stem or dictionary + まい."},
{id:"GC28",lv:3,l:0,t:"対比",jp:"〜らしい ⇔ 〜ようだ ⇔ 〜みたいだ",en:"らしい = heard it elsewhere ／ ようだ = my own inference ／ みたいだ = casual ようだ",ja:"彼は来ないらしい。",kn:"かれはこないらしい。",ee:"Apparently he isn't coming.",n:"らしい has a second life as 'typical of': 男らしい, 学生らしい. Context decides which one you're reading."},
{id:"GC29",lv:3,l:0,t:"文型",jp:"〜ことだ / 〜ことはない",en:"advice: you should ～ / there's no need to ～",ja:"心配することはありません。",kn:"しんぱいすることはありません。",ee:"There's nothing to worry about.",n:"Don't confuse with 〜ことがある (sometimes happens) or 〜たことがある (have experienced). Three ことs, three jobs."},
{id:"GC30",lv:3,l:0,t:"文型",jp:"〜において",en:"in / at (formal setting, field or era)",ja:"会議は東京において行われる。",kn:"かいぎはとうきょうにおいておこなわれる。",ee:"The conference will be held in Tokyo.",n:"Written-language で. Speaking it aloud in a café would sound like reading from a contract."},
{id:"GC31",lv:3,l:0,t:"文型",jp:"〜に関して / 〜について",en:"regarding ～ / about ～",ja:"その件について説明します。",kn:"そのけんについてせつめいします。",ee:"I'll explain about that matter.",n:"について is everyday; に関して is stiffer and broader. Both attach to nouns only — you'll need 〜ことについて for a clause."},
{id:"GC32",lv:3,l:0,t:"文型",jp:"〜っぽい",en:"-ish / tends to be ～",ja:"最近、忘れっぽくなった。",kn:"さいきん、わすれっぽくなった。",ee:"I've become forgetful lately.",n:"Casual and usually critical. 子どもっぽい (childish) is an insult; 子どもらしい (childlike) is a compliment — the suffix carries the whole judgement."}
];

/* ================= TTS =================
   Lifted wholesale from 文型の糸 — every line here is load-bearing on
   iOS/Chrome. Isolated Japanese is always fed as KANA, never kanji, so the
   engine can't misread 行って as おこなって. */
let JV=null,EV=null,currentU=null,unlocked=false,speakToken=0,noJa=false,voicesSettled=false;
const SPOKEN=[];   /* rolling log of what was actually voiced — debug + tests */
/* ---- EDITABLE: TTS pronunciation overrides -------------------------------
   Apple's Kyoko applies sequential voicing (rendaku) across seams it thinks
   it sees inside a kana string, so an isolated word can come out as ...づき
   where ...つき was meant. Google's Japanese voice does not do this.
   Left side = the kana we store. Right side = what to FEED the synthesiser.
   A space or 、 at the seam is usually enough to stop the voicing; katakana
   sometimes helps too. Add entries freely — nothing else depends on this. */
const SAY_FIX = {
  "まいつき":   "まい つき",
  "ひとつき":   "ひと つき",
  "みつき":     "み つき",
  "だいすき":   "だい すき",
  "ものすごい": "もの すごい"
};
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
function pickVoices(){
  const vs = allVoices(), isJa = v => v.lang.replace("_","-").startsWith("ja");
  JV = (S.cfg.jvURI && vs.find(v=>v.voiceURI===S.cfg.jvURI))
     || vs.find(v=>/Google/i.test(v.name)&&isJa(v))
     || vs.find(v=>/Kyoko/i.test(v.name)&&isJa(v))
     || vs.find(isJa) || null;
  EV = (S.cfg.evURI && vs.find(v=>v.voiceURI===S.cfg.evURI))
     || vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>v.lang.startsWith("en")) || null;
  noJa = vs.length>0 && !JV;
}
async function ensureVoices(){
  for(let i=0;i<20;i++){ if(allVoices().length) break; await new Promise(r=>setTimeout(r,120)); }
  pickVoices(); voicesSettled = true;
}
if (typeof speechSynthesis !== "undefined"){
  speechSynthesis.onvoiceschanged = () => pickVoices();
  pickVoices(); ensureVoices();
}
function unlock(){ if(unlocked) return; unlocked = true;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("あ"); u.volume=0; u.rate=1;
       speechSynthesis.speak(u); }catch(e){} }
document.addEventListener("touchstart", unlock, {once:true});
document.addEventListener("click", unlock, {once:true});
function speak(text, jp=true, rate=0.92, _retry=false){
  if(!_retry){ SPOKEN.push(text); if(SPOKEN.length>40) SPOKEN.shift(); }
  if(jp && SAY_FIX[text]) text = SAY_FIX[text];
  const myToken = ++speakToken;
  return new Promise(async res=>{
    try{
      if(!voicesSettled) await ensureVoices();
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      if(busy) speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken !== speakToken) return res();
        pickVoices();
        const u = new SpeechSynthesisUtterance(text);
        currentU = u;
        u.lang = jp ? "ja-JP" : "en-US";
        let v = jp ? JV : EV, r = jp ? rate : 1.0;
        if(_retry){ r = 1.0;
          if(jp){ const alt = allVoices().find(x=>x.lang.replace("_","-").startsWith("ja") && v && x.localService !== v.localService);
                  if(alt) v = alt; } }
        if(v) u.voice = v;
        u.rate = Math.max(0.7, r); u.pitch = 1;
        let done=false, started=false;
        const finish = ()=>{ if(done) return; done=true; clearInterval(kick); res(); };
        u.onstart = ()=>{ started = true; };
        u.onend = finish; u.onerror = finish;
        const est = 600 + text.length*(jp?185:75)/u.rate;
        setTimeout(finish, est+1500);
        setTimeout(()=>{ if(!started && !done && !_retry){ done=true; clearInterval(kick);
            try{ speechSynthesis.cancel(); }catch(e){}
            setTimeout(()=>speak(text,jp,1.0,true).then(res),160); } }, 1400);
        const kick = setInterval(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 2500);
        speechSynthesis.speak(u);
        setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 120);
      }, busy?230:40);
    }catch(e){ res(); }
  });
}
function jaWarnHTML(){ return `<div class="note" style="border-color:var(--akane);color:var(--thread)">
  ⚠ <b>No Japanese voice found in this browser</b> — Japanese audio will be silent until one is installed.<br>
  ・<b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Japanese → download <b>Kyoko</b><br>
  ・<b>Windows:</b> Settings → Time &amp; Language → Language → add 日本語 (with Speech), or use Edge/Chrome<br>
  ・<b>Android:</b> Settings → Google Text-to-speech → install Japanese<br>
  ・<b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage voices → Japanese</div>`; }

/* ================= shared filter helpers ================= */
function parseRanges(str, max){
  str = (str||"").trim(); if(!str) return null;
  const out = [];
  for(const part of str.split(/[,、]/)){
    const p = part.trim(); if(!p) continue;
    const m = p.match(/^(\d+)\s*(?:[-–~〜]\s*(\d+))?$/); if(!m) return null;
    const lo = +m[1], hi = m[2] ? +m[2] : lo;
    if(lo < 1 || hi > max || lo > hi) return null;
    out.push([lo,hi]);
  }
  return out.length ? out : null;
}
const inRanges = (v,rs) => v != null && rs.some(([lo,hi]) => v>=lo && v<=hi);
function shuffled(a){ const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b; }
const kanaSort = (a,b) => a.localeCompare(b,"ja");

function chipRow(items, isOn, onTap, cls){
  return `<div class="chips">` + items.map((it,i) =>
    `<button class="chip ${cls||""} ${isOn(it,i)?"on":""}" data-i="${i}">${esc(it.label)}</button>`).join("") + `</div>`;
}

/* =====================================================================
   語彙 — vocabulary
   ===================================================================== */
const VF = { s1:false, s2:false, n:new Set(), lr:null, lrText:"", q:"", sort:"lesson", star:false };
function vocabPass(w){
  if(VF.star) return starred("V:"+w.w+"|"+w.r);
  const any = VF.s1 || VF.s2 || VF.n.size || VF.lr;
  if(!any) return false;
  const inR = !VF.lr || inRanges(w.l, VF.lr);
  if(VF.s1 && w.l>=1  && w.l<=25 && inR) return true;
  if(VF.s2 && w.l>=26 && w.l<=50 && inR) return true;
  if(w.n && VF.n.has(w.n) && (!VF.lr || inR)) return true;
  if(VF.lr && !VF.s1 && !VF.s2 && !VF.n.size && inRanges(w.l, VF.lr)) return true;
  return false;
}
function vocabSel(){
  let out = WORDS.filter(vocabPass);
  if(VF.q){ const q = VF.q.toLowerCase();
    out = out.filter(w => w.w.includes(VF.q) || w.r.includes(VF.q) || w.m.toLowerCase().includes(q)); }
  if(VF.sort==="kana")   out = out.slice().sort((a,b)=>kanaSort(a.r,b.r));
  if(VF.sort==="jlpt")   out = out.slice().sort((a,b)=>(b.n||0)-(a.n||0) || kanaSort(a.r,b.r));
  if(VF.sort==="random") out = shuffled(out);
  return out;
}

function paintVocab(){
  const sel = vocabSel();
  $("#v-count").innerHTML = `<b>${sel.length}</b> ${RB("語","ご")} selected` + (sel.length>400 ? ` — that's a long sitting; consider narrowing.` : "");
  $("#v-go").disabled = !sel.length;
  const l = $("#v-list");
  if(!sel.length){ l.innerHTML = `<div class="empty">Choose a level or a 課 range above<br>to build a pile.</div>`; return; }
  l.innerHTML = sel.slice(0,300).map(w => {
    const k = "V:"+w.w+"|"+w.r;
    return `<div class="lrow"><div class="lft">
      <div class="lj">${esc(w.w)}</div><div class="lk">${esc(w.r)}</div><div class="lm">${esc(w.m)}</div></div>
      <div class="rgt"><div>${w.l?`<span class="tag">L${w.l}</span>`:""}${w.n?`<span class="tag">N${w.n}</span>`:""}</div>
      <div><button class="mini" data-say="${esc(w.r)}">▶</button>
      <button class="star ${starred(k)?"on":""}" data-star="${esc(k)}">★</button></div></div></div>`; }).join("")
    + (sel.length>300 ? `<div class="count">…showing the first 300. All ${sel.length} go into the flashcards.</div>` : "");

function wireRows(root){
  root.querySelectorAll("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.say); });
  root.querySelectorAll("[data-star]").forEach(b => b.onclick = e => {
    e.stopPropagation(); toggleStar(b.dataset.star); b.classList.toggle("on"); });
}
function vocabCards(sel){
  const dir = S.cfg.vdir;
  return sel.map(w => {
    const tags = (w.l?`L${w.l}`:"") + (w.l&&w.n?" · ":"") + (w.n?`N${w.n}`:"");
    return dir==="ja"
      ? { key:"V:"+w.w+"|"+w.r, cueH:RB("日本語","にほんご")+" → "+RB("意味","いみ"),
          front:w.w, frontEn:false, sub:tags, ans:w.m, ansEn:true, kana:w.r,
          sf:w.r, sb:"" }
      : { key:"V:"+w.w+"|"+w.r, cueH:RB("意味","いみ")+" → "+RB("日本語","にほんご"),
          front:w.m, frontEn:true, sub:tags, ans:w.w, ansEn:false, kana:w.r,
          sf:"", sb:w.r };
  });
}

/* =====================================================================
   動詞 — verb groups and conjugation
   ===================================================================== */
const BF = { g:new Set(), s1:false, s2:false, lr:null, lrText:"", q:"",
             trap:false, pair:false, star:false, sort:"lesson",
             forms:new Set(["group","dict","nai","te"]) };
function verbPass(v){
  if(BF.star) return starred("B:"+v.w+"|"+v.r);
  if(BF.g.size && !BF.g.has(v.g)) return false;
  if(BF.trap && !v.trap) return false;
  if(BF.pair && !v.p) return false;
  const lvAny = BF.s1 || BF.s2;
  const inR = !BF.lr || inRanges(v.l, BF.lr);
  if(!inR) return false;
  if(!lvAny) return true;
  if(BF.s1 && v.l<=25) return true;
  if(BF.s2 && v.l>=26) return true;
  return false;
}
function verbSel(){
  let out = VERBS.filter(verbPass);
  if(BF.q){ const q = BF.q.toLowerCase();
    out = out.filter(v => v.w.includes(BF.q) || v.r.includes(BF.q) || v.m.toLowerCase().includes(q)); }
  if(BF.sort==="kana")   out = out.slice().sort((a,b)=>kanaSort(a.r,b.r));
  if(BF.sort==="group")  out = out.slice().sort((a,b)=>a.g-b.g || a.l-b.l);
  if(BF.sort==="random") out = shuffled(out);
  return out;
}

    box.innerHTML = `<div><span class="cf">グループ</span><span class="cv">${GRP_RUBY[v.g]}</span></div>` +
      FORMS.filter(f=>f[0]!=="group").map(f => {
        const [sf,kf] = c[f[0]];
        return `<div><span class="cf">${FORM_RUBY[f[0]]}</span><span class="cv">${esc(sf)}${sf!==kf?`<small>${esc(kf)}</small>`:""}</span></div>`;
      }).join("");
    box.style.display = "block";
  });
}
function verbCards(sel){
  const out = [];
  const order = FORMS.filter(f => BF.forms.has(f[0]));
  sel.forEach(v => order.forEach(f => {
    const key = "B:"+v.w+"|"+v.r;
    const trapNote = v.trap
      ? `⚠ ${BYREAD[v.r].filter(x=>x!==v).map(x=>x.w+"（"+GRP_SHORT[x.g]+"）").join("、")} shares this reading — the kanji is the only clue.`
      : "";
    if(f[0] === "group"){
      out.push({ key, cueH:"どのグループ？", front:v.w, frontEn:false,
                 sub:v.r + " — " + v.m, ans:GRP_NAME[v.g], ansH:GRP_RUBY[v.g],
                 ansEn:false, kana:"", sf:v.r, sb:"", note:trapNote });
    } else {
      const [sf,kf] = conjugate(v)[f[0]];
      if(sf === "—") return;
      out.push({ key, cueH:FORM_RUBY[f[0]], front:v.w, frontEn:false,
                 sub:`${v.r} — ${v.m}　【${GRP_SHORT[v.g]}】`,
                 ans:sf, ansEn:false, kana:(sf!==kf?kf:""),
                 sf:v.r, sb:kf, note:trapNote });
    }
  }));
  return out;
}

/* =====================================================================
   文法 — grammar points
   ===================================================================== */
/* tag, furigana, plain-English gloss — the bare kanji told you nothing */
const GTAGS_META = [
  ["助詞","じょし","particles"], ["動詞形","どうしけい","verb forms"],
  ["文型","ぶんけい","sentence patterns"], ["対比","たいひ","easily-confused pairs"],
  ["条件","じょうけん","if / when"], ["授受","じゅじゅ","giving & receiving"],
  ["敬語","けいご","polite & humble"], ["自他","じた","transitive vs intransitive"],
  ["伝聞","でんぶん","hearsay & appearance"]];
const GTAGS = GTAGS_META.map(g => g[0]);
const GF = { lv:new Set(), t:new Set(), lr:null, lrText:"", q:"", star:false, sort:"lesson" };
function gramPass(g){
  if(GF.star) return starred("G:"+g.id);
  if(GF.lv.size && !GF.lv.has(g.lv)) return false;
  if(GF.t.size && !GF.t.has(g.t)) return false;
  if(GF.lr && !inRanges(g.l, GF.lr)) return false;
  return true;
}
function gramSel(){
  let out = GRAM.filter(gramPass);
  if(GF.q){ const q = GF.q.toLowerCase();
    out = out.filter(g => g.jp.includes(GF.q) || g.ja.includes(GF.q) || g.kn.includes(GF.q)
                       || g.en.toLowerCase().includes(q) || g.ee.toLowerCase().includes(q)
                       || (g.n||"").toLowerCase().includes(q)); }
  if(GF.sort==="random") out = shuffled(out);
  return out;
}
function renderGram(){
  const m = $("#main");
  m.innerHTML = (noJa ? jaWarnHTML() : "") + `

    <button class="chip ${GF.lv.has(3)?"on":""}" data-l="3">${RB("中級","ちゅうきゅう")}・JLPT</button>

  <div class="sec">タイプ</div>
  <div class="chips" id="g-t">${GTAGS_META.map(g=>`<button class="chip sm two ${GF.t.has(g[0])?"on":""}" data-t="${g[0]}">${RB(g[0],g[1])}<i>${g[2]}</i></button>`).join("")}</div>
  <div class="sec">${RB("絞","しぼ")}り${RB("込","こ")}み</div>
  <div class="row2">
    <input type="text" id="g-lr" placeholder="課（か） e.g. 26-30" value="${esc(GF.lrText)}">
    <select id="g-sort"><option value="lesson">課順（かじゅん）</option><option value="random">ランダム</option></select>
  </div>
  <input type="search" id="g-q" placeholder="検索 — 文型・例文・English" value="${esc(GF.q)}" style="margin-top:8px">
  <div class="count" id="g-count"></div>
  <div class="gorow"><button class="go" id="g-go">▶ めくる</button>
    <select id="g-dir" style="flex:1">
      <option value="jp">文型（ぶんけい） → 意味（いみ）</option>
      <option value="en">意味（いみ） → 文型（ぶんけい）</option>
    </select></div>
  <div class="list" id="g-list"></div>`;
  $("#g-sort").value = GF.sort; $("#g-dir").value = S.cfg.gdir;
  $("#g-lv").querySelectorAll("button").forEach(b => b.onclick = ()=>{
    if(b.dataset.star){ GF.star = !GF.star; }
    else { const l = +b.dataset.l; GF.lv.has(l)?GF.lv.delete(l):GF.lv.add(l); GF.star=false; }

  $("#g-t").querySelectorAll("button").forEach(b => b.onclick = ()=>{
    const t = b.dataset.t; GF.t.has(t)?GF.t.delete(t):GF.t.add(t); renderGram(); });
  $("#g-lr").oninput = e => { GF.lrText = e.target.value; GF.lr = parseRanges(e.target.value,50); paintGram(); };
  $("#g-q").oninput  = e => { GF.q = e.target.value.trim(); paintGram(); };

function paintGram(){
  const sel = gramSel();
  $("#g-count").innerHTML = `<b>${sel.length}</b> ${RB("文型","ぶんけい")} selected`;
  $("#g-go").disabled = !sel.length;

function gramCards(sel){
  const dir = S.cfg.gdir;
  return sel.map(g => {
    const cueH = esc(g.t) + (g.l ? `　L${g.l}` : `　${RB("中級","ちゅうきゅう")}`);
    return dir==="jp"
      ? { key:"G:"+g.id, cueH, front:g.jp, frontEn:false, sub:"", ans:g.en, ansEn:true,
          kana:"", sf:"", sb:g.kn, ex:{ja:g.ja, kn:g.kn, en:g.ee}, note:g.n }
      : { key:"G:"+g.id, cueH, front:g.en, frontEn:true, sub:"", ans:g.jp, ansEn:false,
          kana:"", sf:"", sb:g.kn, ex:{ja:g.ja, kn:g.kn, en:g.ee}, note:g.n };
  });
}

/* =====================================================================
   flashcard runner — deliberately dumb. No scheduling, no memory.
   ===================================================================== */
let FQ = [], FI = 0, FSHOWN = false, FMISS = [], FRIGHT = 0, FTOTAL = 0;
function startFlash(cards){
  if(!cards.length) return;
  FQ = S.cfg.shuffle ? shuffled(cards) : cards;
  FI = 0; FMISS = []; FRIGHT = 0; FTOTAL = FQ.length; FSHOWN = false;
  $("#flash").classList.add("on");
  document.body.style.overflow = "hidden";
  drawCard();
}
function endFlash(){
  $("#flash").classList.remove("on");
  document.body.style.overflow = "";
  try{ speechSynthesis.cancel(); }catch(e){}
  if(TAB==="vocab") paintVocab(); else if(TAB==="verb") paintVerb(); else if(TAB==="gram") paintGram();
}
$("#f-close").onclick = endFlash;
$("#f-mute").onclick = () => { S.cfg.autoplay = !S.cfg.autoplay; save(); paintMute();
  if(!S.cfg.autoplay){ try{ speechSynthesis.cancel(); }catch(e){} } };
function paintMute(){
  const b = $("#f-mute");
  b.textContent = S.cfg.autoplay ? "🔊" : "🔇";
  b.classList.toggle("off", !S.cfg.autoplay);
  b.title = S.cfg.autoplay ? "自動読み上げ ON" : "自動読み上げ OFF";
}
/* audio that matches what is on screen: the front's own reading before the
   flip, the answer's reading after. Never the answer while the front shows. */
function autoSay(){
  if(!S.cfg.autoplay) return;
  const c = FQ[FI]; if(!c) return;
  const t = FSHOWN ? (c.sb || c.sf) : c.sf;
  if(t) speak(t);
}
function sayNow(){
  const c = FQ[FI]; if(!c) return;
  const t = FSHOWN ? (c.sb || c.sf) : (c.sf || c.sb);
  if(t) speak(t);
}
function drawCard(){
  if(FI >= FQ.length) return drawDone();
  const c = FQ[FI];
  $("#f-prog").style.width = (FI/FTOTAL*100) + "%";
  $("#f-num").textContent = `${FI+1} / ${FQ.length}`;
  $("#f-wrap").innerHTML = `
    <div class="fcue"><span>${c.cueH || ""}</span></div>
    <div class="ffront ${c.frontEn?"en":""}">${esc(c.front)}</div>
    ${c.sub ? `<div class="fsub">${esc(c.sub)}</div>` : ""}
    <div id="f-back"></div>
    <div class="ftap" id="f-tap">タップして${RB("答","こた")}え</div>`;
  $("#f-btns").innerHTML = `
    <button class="aud" id="f-aud">🔈</button>
    <button class="strb ${starred(c.key)?"on":""}" id="f-star">★</button>
    <button class="fb-again" id="f-again">もう${RB("一度","いちど")}</button>
    <button class="fb-ok" id="f-ok">できた</button>`;
  FSHOWN = false;
  $("#f-wrap").onclick = flip;
  $("#f-aud").onclick   = e => { e.stopPropagation(); sayNow(); };
  $("#f-star").onclick  = e => { e.stopPropagation(); toggleStar(c.key); $("#f-star").classList.toggle("on"); };
  $("#f-again").onclick = () => { if(!FSHOWN) return flip(); FMISS.push(c); FI++; drawCard(); };
  $("#f-ok").onclick    = () => { if(!FSHOWN) return flip(); FRIGHT++; FI++; drawCard(); };
  paintMute();
  autoSay();
}
/* tap toggles both ways — flip back to re-test yourself without advancing */
function flip(){
  const c = FQ[FI]; if(!c) return;
  FSHOWN = !FSHOWN;
  if(!FSHOWN){
    $("#f-back").innerHTML = "";
    $("#f-tap").style.display = "";
    try{ speechSynthesis.cancel(); }catch(e){}
    return;
  }
  $("#f-tap").style.display = "none";
  $("#f-back").innerHTML = `<div class="fback">
    <div class="fans ${c.ansEn?"en":""}">${c.ansH || esc(c.ans)}</div>
    ${c.kana ? `<div class="fkana">${esc(c.kana)}</div>` : ""}
    ${c.ex ? `<div class="fex"><div class="ej">${esc(c.ex.ja)}</div>
      <div class="ek">${esc(c.ex.kn)}</div><div class="ee">${esc(c.ex.en)}</div></div>` : ""}
    ${c.note ? `<div class="fnote">${esc(c.note)}</div>` : ""}
    <div class="ftap">タップして${RB("戻","もど")}る</div>
  </div>`;
  autoSay();
}
function drawDone(){
  $("#f-prog").style.width = "100%";
  $("#f-num").textContent = `${FTOTAL} / ${FTOTAL}`;
  const pct = FTOTAL ? Math.round(FRIGHT/FTOTAL*100) : 0;
  $("#f-wrap").onclick = null;
  $("#f-wrap").innerHTML = `<div class="fdone">
    <div class="big">${RB("糸","いと")}を${RB("通","とお")}しました。</div>
    <div class="sc">${pct}%</div>
    <div class="fsub">${FRIGHT} / ${FTOTAL} できた${FMISS.length?`　・　${FMISS.length} ${RB("枚","まい")}が${RB("残","のこ")}り`:""}</div>
    <div style="margin-top:26px">
      ${FMISS.length?`<button class="pri" id="d-miss">${RB("間違","まちが")}えた ${FMISS.length} ${RB("枚","まい")}をもう${RB("一度","いちど")}</button>`:""}
      <button id="d-all">${RB("全部","ぜんぶ")}もう${RB("一度","いちど")}</button>
      <button id="d-end">${RB("終","お")}わる</button>
    </div></div>`;
  $("#f-btns").innerHTML = "";
  if(FMISS.length) $("#d-miss").onclick = () => startFlash(FMISS);
  $("#d-all").onclick = () => startFlash(FQ);
  $("#d-end").onclick = endFlash;
}


/* =====================================================================
   口ドリル — hands-free speaking practice.
   Same shape as 型ドリル in 文型の糸: English cue, then SILENCE long enough
   to actually say it, then the Japanese slow, then at speed. The silence is
   the exercise; everything else is scaffolding. Scoped to whichever 課 you
   pick so nothing you haven't met yet can turn up.
   ===================================================================== */
const DF = { lr:null, lrText:"", t:new Set(), q:"", gap:1, twice:true, order:"random" };
let drilling = false, dPaused = false, dIdx = 0, dList = [];
function drillPass(c){
  if(DF.lr && !inRanges(c.l, DF.lr)) return false;
  if(DF.t.size && !DF.t.has(c.t)) return false;
  if(DF.q){ const q = DF.q.toLowerCase();
    if(!(c.ja.includes(DF.q) || c.kn.includes(DF.q) || c.en.toLowerCase().includes(q)
         || c.t.includes(DF.q))) return false; }
  return true;
}
function drillSel(){
  const out = DRILL.filter(drillPass);
  return DF.order==="random" ? shuffled(out) : out;
}
/* patterns available inside the currently chosen 課 range — no point offering
   〜たら chips to somebody drilling L1–10 */
function drillTags(){
  const seen = [];
  DRILL.forEach(c => { if((!DF.lr || inRanges(c.l, DF.lr)) && !seen.includes(c.t)) seen.push(c.t); });
  return seen;
}
function renderDrill(){
  const m = $("#main");
  const tags = drillTags();
  m.innerHTML = (noJa ? jaWarnHTML() : "") + `
  <p class="hint">Hands-free. You hear the English, then a gap — say it out loud in Japanese — then the answer, slowly and then at speed. Put the phone down and talk.</p>
  <div class="sec">${RB("課","か")}をえらぶ</div>
  <div class="chips" id="d-quick">
    <button class="chip sm" data-r="1-25">${RB("初級","しょきゅう")}I ぜんぶ</button>
    <button class="chip sm" data-r="1-10">L1–10</button>
    <button class="chip sm" data-r="11-15">L11–15</button>
    <button class="chip sm" data-r="16-20">L16–20</button>
    <button class="chip sm" data-r="21-25">L21–25</button>
  </div>
  <input type="text" id="d-lr" placeholder="課（か） e.g. 16-20" value="${esc(DF.lrText)}" style="margin-top:9px">
  <div class="sec">${RB("文型","ぶんけい")}（${RB("選","えら")}ばなければ${RB("全部","ぜんぶ")}）</div>
  <div class="chips" id="d-t">${tags.map(t=>
    `<button class="chip sm ${DF.t.has(t)?"on":""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")
    || `<span class="hint">課をえらんでください。</span>`}</div>
  <div class="sec">${RB("間","ま")}のとり${RB("方","かた")}</div>
  <div class="row2">
    <select id="d-gap">
      <option value="1">ふつうの間（standard gap）</option>
      <option value="1.5">長めの間（more thinking time）</option>
      <option value="0.75">短い間（tight, for review）</option>
    </select>
    <select id="d-twice">
      <option value="1">ゆっくり＋ふつう（slow then normal）</option>
      <option value="0">ふつうだけ（normal only）</option>
    </select>
  </div>
  <input type="search" id="d-q" placeholder="検索（けんさく） — 文型・例文・English" value="${esc(DF.q)}" style="margin-top:8px">
  <div class="count" id="d-count"></div>
  <div class="gorow">
    <button class="go" id="d-go">▶ はじめる</button>
    <button class="alt" id="d-pause">⏸</button>
    <button class="alt" id="d-stop">■ さいしょから</button>
  </div>
  <div class="drillbox">
    <div class="d-en" id="d-en">…</div>
    <div class="d-ja" id="d-ja"></div>
    <div class="d-kn" id="d-kn"></div>
  </div>
  <div class="list" id="d-list"></div>`;
  $("#d-gap").value = String(DF.gap);
  $("#d-twice").value = DF.twice ? "1" : "0";
  $("#d-quick").querySelectorAll("button").forEach(b => b.onclick = ()=>{
    DF.lrText = b.dataset.r; DF.lr = parseRanges(b.dataset.r, 25); DF.t = new Set(); dPaused = false; dList = []; dIdx = 0; renderDrill(); });
  $("#d-lr").oninput = e => { DF.lrText = e.target.value; DF.lr = parseRanges(e.target.value, 25);
    DF.t = new Set(); dPaused = false; dList = []; dIdx = 0; renderDrill(); $("#d-lr").focus(); };
  $("#d-t").querySelectorAll("button").forEach(b => b.onclick = ()=>{
    const t = b.dataset.t; DF.t.has(t) ? DF.t.delete(t) : DF.t.add(t); dPaused = false; dList = []; dIdx = 0; renderDrill(); });
  $("#d-q").oninput = e => { DF.q = e.target.value.trim(); paintDrill(); };
  $("#d-gap").onchange = e => { DF.gap = parseFloat(e.target.value); };
  $("#d-twice").onchange = e => { DF.twice = e.target.value === "1"; };

  $("#d-pause").onclick = pauseDrill;

function paintDrillButtons(){
  const go = $("#d-go"), pz = $("#d-pause");
  if(!go) return;
  go.innerHTML = dPaused ? `▶ つづける` : `▶ はじめる`;
  go.disabled = drilling || !drillSel().length;
  if(pz) pz.disabled = !drilling;
}
function paintDrill(){
  const sel = drillSel();
  const mins = Math.round(sel.length * (DF.twice?13:9) * DF.gap / 60);
  $("#d-count").innerHTML = `<b>${sel.length}</b> ${RB("文","ぶん")}`
    + (sel.length ? ` ・ およそ ${mins || 1} ${RB("分","ふん")}` : "")
    + (dPaused && dList.length ? ` ・ <span style="color:var(--kuchiba)">${dIdx+1}${RB("文目","ぶんめ")}で${RB("一時停止","いちじていし")}</span>` : "");
  paintDrillButtons();
  const l = $("#d-list");
  if(!sel.length){ l.innerHTML = `<div class="empty">課をえらぶと文が出ます。</div>`; return; }
  const byL = {};
  sel.forEach(c => (byL[c.l] ??= []).push(c));
  l.innerHTML = Object.keys(byL).sort((a,b)=>a-b).map(k =>
    `<div class="sec">${RB("第","だい")}${k}${RB("課","か")}</div>` + byL[k].map(c =>
      `<div class="lrow"><div class="lft">
        <div class="lj" style="font-size:16px">${esc(c.ja)}</div>
        <div class="lk">${esc(c.kn)}</div>
        <div class="lm">${esc(c.en)}</div></div>
        <div class="rgt"><div><span class="tag">${esc(c.t)}</span></div>
        <div><button class="mini" data-say="${esc(c.kn)}">▶</button></div></div></div>`).join("")).join("");
  wireRows(l);
}
/* pause keeps dList and dIdx, so ▶ つづける picks the same sentence back up.
   A paused sentence restarts from its English cue rather than resuming
   mid-utterance — you want the cue again before you try to say it. */
function pauseDrill(){
  if(!drilling) return;
  drilling = false; dPaused = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  const en = $("#d-en");
  if(en) en.innerHTML = `⏸ ${RB("一時停止","いちじていし")} — ${dIdx+1}/${dList.length}`;
  paintDrill();   /* refresh the count line so it names the paused position */
}
function resetDrill(){
  drilling = false; dPaused = false; dIdx = 0; dList = [];
  try{ speechSynthesis.cancel(); }catch(e){}
  const en = $("#d-en"); if(en) en.textContent = "…";
  const ja = $("#d-ja"); if(ja){ ja.textContent = ""; ja.classList.remove("shown"); }
  const kn = $("#d-kn"); if(kn) kn.textContent = "";
  paintDrill();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function startDrill(){
  if(drilling) return;
  if(!dPaused || !dList.length){ dList = drillSel(); dIdx = 0; }   /* fresh run */
  if(!dList.length) return;
  drilling = true; dPaused = false; unlock();
  paintDrillButtons();
  for(; dIdx < dList.length; dIdx++){
    const c = dList[dIdx], i = dIdx;
    if(!drilling) break;
    /* gap scales with the length of what you have to produce */
    const gap = (2100 + c.kn.length * 135) * DF.gap;
    $("#d-en").innerHTML = `<span class="pulse"></span><span class="dnum">${i+1}/${dList.length}</span> ${esc(c.en)}`;
    $("#d-ja").textContent = ""; $("#d-ja").classList.remove("shown");
    $("#d-kn").textContent = "";
    await speak(c.en, false);                     if(!drilling) break;
    await sleep(gap);                             if(!drilling) break;
    $("#d-ja").textContent = c.ja; $("#d-ja").classList.add("shown");
    $("#d-kn").textContent = c.kn;
    if(DF.twice){ await speak(c.kn, true, 0.72);  if(!drilling) break;
                  await sleep(650);               if(!drilling) break; }
    await speak(c.kn, true, 0.95);                if(!drilling) break;
    await sleep(1500);
  }
  if(drilling){                       /* ran to the end rather than paused */
    $("#d-en").innerHTML = "おしまい — session complete.";
    $("#d-ja").textContent = ""; $("#d-kn").textContent = "";
    dIdx = 0; dPaused = false;
  }
  drilling = false;
  paintDrillButtons();
}

/* =====================================================================
   設定
   ===================================================================== */
function renderSettings(){
  const m = $("#main");
  const vs = allVoices();
  const ja = vs.filter(v => v.lang.replace("_","-").startsWith("ja"));
  const en = vs.filter(v => v.lang.startsWith("en"));
  const opts = (list, sel) => `<option value="">自動で選ぶ</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI===sel?"selected":""}>${esc(v.name)}${v.localService?"（端末内）":"（ネット）"}</option>`).join("");
  m.innerHTML = (noJa ? jaWarnHTML() : "") + `
  <div class="sec">${RB("音声設定","おんせいせってい")}</div>
  <div class="hint" style="margin-bottom:8px">Japanese is always spoken from kana, never kanji — so 行って can't come out as おこなって.</div>
  <select id="s-jv" style="margin-bottom:8px">${opts(ja, S.cfg.jvURI)}</select>
  <select id="s-ev">${opts(en, S.cfg.evURI)}</select>
  <div class="chips" style="margin-top:10px">
    <button class="chip" id="s-test">▶ テスト</button>
    <button class="chip" id="s-reset">${RB("音声","おんせい")}リセット</button>
  </div>
  <div class="sec">めくり${RB("方","かた")}</div>
  <div class="chips">
    <button class="chip ${S.cfg.autoplay?"on":""}" id="s-auto">${RB("自動","じどう")}で${RB("読","よ")}み${RB("上","あ")}げ</button>
    <button class="chip ${S.cfg.shuffle?"on":""}" id="s-shuf">シャッフル</button>
  </div>
  <div class="sec">キープ</div>
  <div class="hint">★ marks cards you want to come back to. They survive re-uploads — the star list is keyed to the word itself, not to its position.</div>
  <div class="chips" style="margin-top:10px">
    <button class="chip" id="s-clear">★ を全部消す（${Object.keys(S.star).length}）</button>
  </div>
  <div class="note">
    <b>試験の糸</b> is the cram half of the site: pick a slice, flip it, forget it.
    Nothing here is scheduled and nothing you do here touches
    <b>文型の糸</b>, which keeps its own spaced-repetition progress under a
    separate key. Use this before a test; use 文型の糸 to actually remember things.<br><br>
    語彙 mirrors the word list from <b>漢字の糸</b> — ${WORDS.length.toLocaleString()} words,
    Minna I &amp; II plus JLPT N5–N1. 動詞 covers ${VERBS.length} Minna verbs with
    hand-checked conjugation groups. 文法 holds ${GRAM.length} patterns.<br><br>
    <b>Note on 中級 vocabulary:</b> the word list carries 課 tags only for
    Minna 初級 I &amp; II (L1–50). Chuukyuu vocabulary isn't lesson-tagged
    anywhere in the data, so for that range use the JLPT chips — N3 and N2
    overlap it closely.
  </div>
  <div class="note">
    <b>iPhone の読み上げについて</b> — Apple の Kyoko は、かな一語の中に切れ目を
    見つけると連濁を起こすことがあります（…つき → …づき）。Google の日本語音声では
    起きません。直したい語は、ファイル内の <b>SAY_FIX</b> に
    「かな」→「読ませたいかな（すきまを入れる）」で足せます。
    上の音声メニューで <b>Otoya</b> など別の日本語音声を選ぶと直ることもあります。
  </div>
  ${canStore ? "" : `<div class="note" style="border-color:var(--akane)">⚠ This browser is blocking local storage, so ★ marks and settings won't survive a reload. Private/Incognito mode is the usual cause.</div>`}`;
  $("#s-jv").onchange = e => { S.cfg.jvURI = e.target.value; save(); pickVoices(); };
  $("#s-ev").onchange = e => { S.cfg.evURI = e.target.value; save(); pickVoices(); };
  $("#s-test").onclick = async () => { await speak("これはテストです。", true, 0.92); speak("This is a test.", false); };
  $("#s-reset").onclick = () => { try{ speechSynthesis.cancel(); }catch(e){}
    voicesSettled = false; unlocked = false; ensureVoices().then(()=>speak("リセットしました。")); };
  $("#s-auto").onclick = e => { S.cfg.autoplay = !S.cfg.autoplay; save(); e.target.classList.toggle("on"); };
  $("#s-shuf").onclick = e => { S.cfg.shuffle = !S.cfg.shuffle; save(); e.target.classList.toggle("on"); };
  $("#s-clear").onclick = () => { if(confirm("★ marks will be cleared. Continue?")){ S.star = {}; save(); renderSettings(); paintPill(); } };
}

/* ================= boot ================= */
/* Everything above lives inside an IIFE so that NOTHING is declared in the
   global lexical scope. That matters: the auto-updater can replace this
   document in place, and a top-level `const` here would collide with the
   same `const` left behind by the outgoing copy — which killed the whole
   script and left a blank page. One deliberate window property instead. */
window.__ito = { WORDS, VERBS, GRAM, DRILL, conjugate, FORMS, S, SPOKEN, SAY_FIX,
                 DF, drillSel, drillTags, get drilling(){ return drilling; },
                 get dPaused(){ return dPaused; }, get dIdx(){ return dIdx; },
                 VF, BF, GF, vocabSel, vocabCards, verbSel, verbCards,
                 gramSel, gramCards, setTab,
                 get FQ(){ return FQ; }, get FI(){ return FI; },
                 get shown(){ return FSHOWN; } };
paintPill();
VF.s1 = true;
renderVocab();
ensureVoices().then(() => { if(noJa && TAB !== "set") setTab(TAB); });

})();
</script>

<script>
/* auto-updater: iOS home-screen apps cache HTML hard. On launch, fetch a fresh
   copy (cache-bypassed); if the server's APPV differs, load the fresh copy.

   We navigate rather than document.write(). document.open() keeps the SAME
   window, so every top-level const/let from the outgoing copy stays declared
   and the incoming copy dies on "already been declared" — a blank page.
   A cache-busted navigation gets a clean realm. The sessionStorage guard
   plus the new ?v= URL make a reload loop impossible.
   Same origin either way, so localStorage/★ marks are untouched.
   Bump APPV each release. */
(function(){var APPV="2026.09.06-2";
try{if(sessionStorage.getItem("itoUpd")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("itoUpd",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
