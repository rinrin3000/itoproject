<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>漢字の糸 — Kanji Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ad-gap:84px; /* clearance for hosting-service banners injected at the bottom */
  --paper:#EFF1EE; --card:#FAFBF8;
  --ink:#1C2B4A; --ink-soft:#3A4A6B; --muted:#67748F;
  --thread:#B9C4D6; --thread-soft:#D6DDE8;
  --seal:#C43D38; --seal-deep:#A32F2B;
  --tile-kanji:#DCE3EF; --lav:#7B6BAF; --lav-bg:#EDEAF6;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif; min-height:100dvh;
  background-image:linear-gradient(var(--thread-soft) 1px, transparent 1px);
  background-size:100% 44px; background-attachment:fixed;
}
.jp{font-family:var(--jpface),"Zen Kaku Gothic New",serif}
/* three faces for Japanese text. 明朝 is the original; 教科書体 (Klee One) is the
   soft pen-drawn shape used in school textbooks and is what most learners have
   actually seen their kanji in; 丸ゴシック is rounded and easiest on the eye. */
:root{--jpface:"Shippori Mincho B1"}
body.face-kyo{--jpface:"Klee One"}
body.face-maru{--jpface:"Zen Maru Gothic"}
body.face-kyo .jp{font-weight:600}
#faceBtn{display:inline-flex;align-items:center;gap:6px;padding:0 11px;white-space:nowrap}
#faceBtn .fchar{font-family:var(--jpface),serif;font-size:1.15rem;line-height:1}
#faceBtn .fname{font-size:.68rem;letter-spacing:.02em;opacity:.75}
.facetoast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9998;
  background:var(--card);border:1px solid var(--line,#2e3949);color:var(--ink);
  padding:9px 16px;border-radius:999px;font-size:.82rem;opacity:0;transition:opacity .25s;
  pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.facetoast.show{opacity:1}

header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:760px;margin:0 auto}
.masthead{display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}
.masthead h1{font-family:var(--jpface),serif;font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.masthead .sub{font-size:.72rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.stats{font-size:.72rem;color:var(--muted);margin-top:2px}
.searchrow{margin-top:12px;display:flex;gap:8px}
.btn{
  border:1.5px solid var(--thread);background:var(--card);color:var(--ink-soft);
  border-radius:var(--radius);padding:0 13px;font-size:.85rem;font-family:inherit;
  font-weight:700;cursor:pointer;min-height:42px;
}
.btn:active{background:var(--tile-kanji)}
#backBtn{font-size:1.1rem;padding:0 14px}
.searchrow input{
  flex:1;min-width:0;border:1.5px solid var(--thread);background:var(--card);
  border-radius:var(--radius);padding:10px 14px;font-size:1rem;color:var(--ink);
  font-family:inherit;outline:none;
}
.searchrow input:focus{border-color:var(--ink-soft)}
.searchrow input::placeholder{color:#9AA6BC}

.trail{
  max-width:760px;margin:10px auto 0;padding:0 16px;display:flex;align-items:center;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.trail::-webkit-scrollbar{display:none}
.trail:empty{display:none}
.trail .hop{
  flex:none;width:40px;height:40px;border-radius:9px;border:1.5px solid var(--thread);
  background:var(--card);font-family:var(--jpface),serif;font-size:1.15rem;
  font-weight:700;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;
}
.trail .hop.current{background:var(--seal);border-color:var(--seal-deep);color:var(--paper)}
.trail .tie{flex:none;width:18px;height:1.5px;background:var(--thread)}
.trail-label{flex:none;font-size:.68rem;color:var(--muted);letter-spacing:.12em;margin-right:10px;text-transform:uppercase}

main{max-width:760px;margin:0 auto;padding:14px 16px calc(var(--ad-gap) + 48px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

.section-label{
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 8px;display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--thread-soft)}
.filterrow{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filterrow::-webkit-scrollbar{display:none}
.fchip{
  flex:none;border:1.5px solid var(--thread);background:var(--card);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.78rem;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip.nchip.on{background:var(--lav);border-color:var(--lav)}
#lrange{
  flex:none;width:84px;border:1.5px solid var(--thread);background:var(--card);
  border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:700;
  color:var(--ink);font-family:inherit;outline:none;text-align:center;
}
#lrange:focus{border-color:var(--ink-soft)}
#lrange::placeholder{color:#9AA6BC;font-weight:400}
.filtnote{font-size:.72rem;color:var(--lav);font-weight:700;margin:-6px 0 12px}
.sortrow{display:flex;gap:6px;margin-top:10px}
.sortrow .seg{
  flex:1;border:1.5px solid var(--thread);background:var(--card);color:var(--muted);
  border-radius:var(--radius);padding:8px 0;font-size:.78rem;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.sortrow .seg.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kchip{
  border:1.5px solid var(--thread);background:var(--card);border-radius:var(--radius);
  aspect-ratio:1/1.08;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;transition:transform .12s ease;
}
.kchip:active{transform:scale(.94)}
.kchip .k{font-family:var(--jpface),serif;font-size:1.6rem;font-weight:700;line-height:1}
.kchip .n{font-size:.6rem;color:var(--muted)}
.wordhit{
  border:1.5px solid var(--thread);background:var(--card);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.wordhit .w{font-family:var(--jpface),serif;font-size:1.15rem;font-weight:700}
.wordhit .r{color:var(--seal);font-size:.85rem}
.wordhit .m{color:var(--muted);font-size:.85rem}
.tag{font-size:.65rem;border-radius:6px;padding:1px 5px;align-self:center}
.ltag{color:var(--muted);border:1px solid var(--thread-soft)}
.ntag{color:var(--lav);background:var(--lav-bg);font-weight:700}
.wordhit .tag:first-of-type{margin-left:auto}
.empty{color:var(--muted);font-size:.9rem;padding:24px 4px;text-align:center}
.morebtn{width:100%;margin-top:4px}

.fan{position:relative;padding-left:104px;min-height:180px}
.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.threads path{fill:none;stroke:var(--thread);stroke-width:1.5}
.seal-wrap{position:absolute;left:0;top:6px;width:88px;text-align:center}
.seal{
  width:84px;height:84px;border-radius:12px;background:var(--seal);color:var(--paper);
  display:grid;place-items:center;font-family:var(--jpface),serif;
  font-size:3.1rem;font-weight:700;box-shadow:0 3px 0 var(--seal-deep);transform:rotate(-1.5deg);
}
.seal-reading{margin-top:8px;font-size:.78rem;color:var(--ink-soft);font-weight:700;line-height:1.35}
.seal-meaning{font-size:.72rem;color:var(--muted);line-height:1.3}
.seal-jlpt{margin-top:5px;display:inline-block}
.words{display:flex;flex-direction:column;gap:10px}
.card{border:1.5px solid var(--thread);background:var(--card);border-radius:var(--radius);padding:10px 12px}
.card .chars{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.chr{
  min-width:36px;height:38px;padding:0 6px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--jpface),serif;font-size:1.35rem;font-weight:700;line-height:1;
}
.chr.kana{color:var(--ink-soft);background:transparent;min-width:22px;padding:0 2px}
.chr.kfocus{background:var(--seal);color:var(--paper)}
.chr.klink{background:var(--tile-kanji);color:var(--ink);cursor:pointer;border:1px solid var(--thread)}
.chr.klink:active{transform:scale(.92)}
.card .gloss{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .r{color:var(--seal);font-size:.85rem;font-weight:500}
.card .m{color:var(--muted);font-size:.85rem}
.card .tag:first-of-type{margin-left:auto}
.hint{font-size:.72rem;color:var(--muted);margin:2px 0 12px}
.related{margin-top:22px}
.relrow{display:flex;gap:8px;flex-wrap:wrap}
.relchip{
  border:1.5px solid var(--thread);background:var(--card);border-radius:var(--radius);
  padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;
}
.relchip .k{font-family:var(--jpface),serif;font-size:1.25rem;font-weight:700}
.relchip .c{font-size:.68rem;color:var(--muted)}

/* flashcards */
.flash{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--ad-gap) + 16px + env(safe-area-inset-bottom))}
.flash-top{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto;
  padding-right:4px}
/* the 糸。pill is position:fixed at the top-right with z-index 9999, so the
   flashcard ✕ used to sit underneath it. Hide the pill while the deck is open —
   it is a full-screen view and the hub link isn't reachable from here anyway. */
body.flash-open #itoHome{display:none}
.flash-top .spacer{flex:1;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}
.flash-stage{flex:1;display:grid;place-items:center;max-width:560px;width:100%;margin:0 auto;perspective:1200px}
.fc{width:100%;max-width:420px;aspect-ratio:5/6;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.4,1)}
.fc.flipped{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1.5px solid var(--thread);background:var(--card);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:22px;text-align:center;box-shadow:0 4px 0 var(--thread-soft)}
.fface.back{transform:rotateY(180deg)}
.fc-word{font-family:var(--jpface),serif;font-weight:700;font-size:2.6rem;line-height:1.25;word-break:keep-all}
.fc-word.long{font-size:1.9rem}
.fc-read{color:var(--seal);font-size:1.4rem;font-weight:700;font-family:var(--jpface),serif}
.fc-mean{color:var(--ink-soft);font-size:1.05rem;line-height:1.5}
.fc-tags{display:flex;gap:6px}
.fc-hint{font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.flash-nav{display:flex;gap:8px;max-width:560px;width:100%;margin:10px auto 0}
.flash-nav .btn{flex:1;min-height:52px;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

@media (max-width:420px){
  .fan{padding-left:88px}
  .seal-wrap{width:74px}
  .seal{width:70px;height:70px;font-size:2.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .threads path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw .5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<a href="index.html" id="itoHome" style="position:fixed;top:10px;right:12px;z-index:9999;text-decoration:none;font-family:var(--jpface),serif;font-size:15px;color:#d4685e;background:rgba(18,22,31,.85);border:1px solid #2e3949;border-radius:999px;padding:5px 13px;backdrop-filter:blur(4px)" title="Back to the Ito hub">糸。</a>

<header>
  <div class="masthead" id="homeBtn" title="Back to all kanji">
    <h1 class="jp">漢字の糸</h1>
    <div>
      <div class="sub">Kanji Web · Minna no Nihongo + JLPT</div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="searchrow">
    <button class="btn hidden" id="backBtn" title="Back one step">←</button>
    <input id="search" type="search" placeholder="Search kanji, reading, meaning, L11-12, N3…" autocomplete="off">
    <button class="btn" id="faceBtn" title="書体を変える — change the Japanese typeface"><span class="fchar">あ</span><span class="fname">明朝</span></button>
    <button class="btn" id="allBtn">All</button>
  </div>
</header>

<div class="trail" id="trail"></div>

<main>
  <div id="indexView">
    <div class="filterrow" id="filterRow">
      <button class="fchip on" data-f="all">All</button>
      <button class="fchip" data-f="s1">初級 I</button>
      <button class="fchip" data-f="s2">初級 II</button>
      <button class="fchip nchip" data-f="n5">N5</button>
      <button class="fchip nchip" data-f="n4">N4</button>
      <button class="fchip nchip" data-f="n3">N3</button>
      <button class="fchip nchip" data-f="n2">N2</button>
      <button class="fchip nchip" data-f="n1">N1</button>
      <input id="lrange" inputmode="numeric" placeholder="L 5-8, 12" autocomplete="off">
    </div>
    <div class="sortrow" id="sortRow">
      <button class="seg on" data-sort="conn">Connections</button>
      <button class="seg" data-sort="lesson">Lesson</button>
      <button class="seg" data-sort="jlpt">JLPT</button>
      <button class="seg" data-sort="comp">部首</button>
    </div>
    <button class="btn morebtn hidden" id="flashBtn"></button>
    <div id="gridArea"></div>
    <div id="wordHits"></div>
    <div class="empty hidden" id="noHits">Nothing found — try a kanji, kana, English, L11-12, L12 &amp; 16, or N3.</div>
  </div>

  <div id="focusView" class="hidden">
    <div class="hint">Tap any highlighted kanji inside a word to follow the thread.</div>
    <div class="filtnote hidden" id="filtNote"></div>
    <div class="fan" id="fan">
      <svg class="threads" id="threads"></svg>
      <div class="seal-wrap">
        <div class="seal jp" id="sealK"></div>
        <div class="seal-reading" id="sealR"></div>
        <div class="seal-meaning" id="sealM"></div>
        <div id="sealN"></div>
      </div>
      <div class="words" id="wordList"></div>
    </div>
    <div class="related" id="relSec">
      <div class="section-label">Shares words with</div>
      <div class="relrow" id="relRow"></div>
    </div>
    <div class="related hidden" id="compSec">
      <div class="section-label">Made of</div>
      <div class="relrow" id="compRow"></div>
    </div>
    <div class="related hidden" id="insideSec">
      <div class="section-label" id="insideLbl">Found inside</div>
      <div id="insideArea"></div>
    </div>
  </div>
</main>

<div class="flash hidden" id="flashView">
  <div class="flash-top">
    <button class="btn" id="fShuf" title="シャッフル — reshuffle this deck">🔀</button>
    <span class="spacer" id="fCount"></span>
    <button class="btn" id="fExit">✕</button>
  </div>
  <div class="flash-stage">
    <div class="fc" id="fCard">
      <div class="fface front">
        <div class="fc-word jp" id="fWord"></div>
        <div class="fc-hint">tap to flip</div>
      </div>
      <div class="fface back">
        <div class="fc-word jp" id="fWord2"></div>
        <div class="fc-read" id="fRead"></div>
        <div class="fc-mean" id="fMean"></div>
        <div class="fc-tags" id="fTags"></div>
      </div>
    </div>
  </div>
  <div class="flash-nav">
    <button class="btn" id="fPrev">←</button>
    <button class="btn" id="fNext">→</button>
  </div>
</div>

<script>

  const i=s.indexOf(":"); const k=s.slice(0,i), ps=[...s.slice(i+1)];
  COMP[k]=ps; ps.forEach(c=>(INV[c]??=[]).push(k));
});
RAD_RAW.forEach(s=>{const[c,st,name,r]=s.split("|");RADS[c]={m:name,r:r||""};if(st)STR[c]=+st;});
STROKE_RAW.forEach(s=>{const[c,st]=s.split("|");STR[c]=+st;});

const isKanji = c => KANJI.hasOwnProperty(c);
const isNode  = c => isKanji(c) || RADS.hasOwnProperty(c);
const metaOf  = k => KANJI[k] || {r:(RADS[k]||{}).r||"", m:(RADS[k]||{}).m||"component", n:null};
const $ = id => document.getElementById(id);
let trail = [], sortMode = "conn";
const WORD_CAP = 100, HIT_CAP = 60, REL_CAP = 40;

/* ---------- range-spec parser: "12", "11-12", "12, 15", "12 & 16", "5-8, 12 & 20" ---------- */
function parseRanges(body, max){
  const toks = body.toLowerCase().split(/[,&＆、]+|\band\b/).map(t=>t.trim()).filter(Boolean);
  if(!toks.length) return null;
  const out=[];
  for(let t of toks){
    t = t.replace(/^[ln]\s*/,"");
    const m = t.match(/^([1-9]\d?)(?:\s*[-–~〜]\s*([1-9]\d?))?$/);
    if(!m) return null;
    let lo=+m[1], hi=m[2]?+m[2]:+m[1];
    if(hi<lo)[lo,hi]=[hi,lo];
    if(lo<1||hi>max) return null;
    out.push([lo,hi]);
  }
  return out;
}
const inRanges=(v,rs)=>v!=null && rs.some(([lo,hi])=>v>=lo&&v<=hi);
const fmtRanges=(rs,p)=>rs.map(([lo,hi])=>lo===hi?p+lo:`${p}${lo}–${hi}`).join(", ");

/* ---------- group filter ---------- */
const filt = { all:true, s1:false, s2:false, nl:new Set(), lr:null };
function passW(wd){
  if(filt.all) return true;
  const inR = !filt.lr || inRanges(wd.l, filt.lr);
  if(filt.s1 && wd.l>=1  && wd.l<=25 && inR) return true;
  if(filt.s2 && wd.l>=26 && wd.l<=50 && inR) return true;
  if(wd.n && filt.nl.has(wd.n)) return true;
  if(filt.lr && !filt.s1 && !filt.s2 && inRanges(wd.l, filt.lr)) return true;
  return false;
}
function filtDesc(){
  if(filt.all) return "";
  const parts=[];
  if(filt.s1) parts.push("初級I");
  if(filt.s2) parts.push("初級II");
  [...filt.nl].sort((a,b)=>b-a).forEach(n=>parts.push("N"+n));
  if(filt.lr) parts.push(fmtRanges(filt.lr,"L"));
  return parts.join(" · ");
}

let K2W={}, KMINL={}, kanjiList=[], activeWords=0, PASSIDX=[];
function rebuild(){
  K2W={}; KMINL={}; activeWords=0; PASSIDX=[];
  WORDS.forEach((wd,i)=>{
    if(!passW(wd)) return;
    activeWords++; PASSIDX.push(i);
    [...new Set([...wd.w])].forEach(c=>{
      if(isKanji(c)){
        (K2W[c]??=[]).push(i);
        if(wd.l && (!KMINL[c] || wd.l < KMINL[c])) KMINL[c]=wd.l;
      }
    });
  });
  let ks = Object.keys(K2W);
  if(!filt.all && filt.nl.size){
    /* N chips admit kanji by their OWN JLPT level (official lists),
       while lesson-based groups admit kanji via word membership. */
    const passViaWordGroup = i => {
      const wd=WORDS[i];
      const inR=!filt.lr||inRanges(wd.l,filt.lr);
      return (filt.s1&&wd.l>=1&&wd.l<=25&&inR) ||
             (filt.s2&&wd.l>=26&&wd.l<=50&&inR) ||
             (filt.lr&&!filt.s1&&!filt.s2&&inRanges(wd.l,filt.lr));
    };
    ks = ks.filter(k =>
      (KANJI[k].n && filt.nl.has(KANJI[k].n)) || K2W[k].some(passViaWordGroup)
    );
    /* official N-level kanji with no surviving words still belong in the grid */
    Object.keys(KANJI).forEach(k=>{
      if(filt.nl.has(KANJI[k].n) && !K2W[k]){ K2W[k]=[]; ks.push(k); }
    });
  }
  kanjiList = ks.sort((a,b)=>K2W[b].length-K2W[a].length || a.localeCompare(b,"ja"));
  const d=filtDesc();
  $("stats").textContent = `${kanjiList.length} kanji · ${activeWords} words` + (d?` · ${d}`:" · L1–50 + N5–N1");
  const note=$("filtNote");
  note.classList.toggle("hidden", !d);
  note.textContent = d ? `Filtered: ${d}` : "";
}

const tags = wd => (wd.l?`<span class="tag ltag">L${wd.l}</span>`:"") + (wd.n?`<span class="tag ntag">N${wd.n}</span>`:"");

function chipSub(k){
  if(sortMode==="lesson") return KMINL[k] ? "L"+KMINL[k] : "–";
  if(sortMode==="jlpt")   return KANJI[k].n ? "N"+KANJI[k].n : "–";
  return K2W[k].length;
}
function makeChip(k){
  const b=document.createElement("button");
  b.className="kchip";
  b.innerHTML=`<span class="k jp">${k}</span><span class="n">${chipSub(k)}</span>`;
  b.onclick=()=>focusKanji(k,true);
  return b;
}
function gridInto(parent, ks){
  const g=document.createElement("div");g.className="grid";
  ks.forEach(k=>g.appendChild(makeChip(k)));
  parent.appendChild(g);
}
function label(parent, text){
  const d=document.createElement("div");d.className="section-label";d.textContent=text;
  parent.appendChild(d);
}
function sortKanji(ks){
  if(sortMode==="lesson")
    return [...ks].sort((a,b)=>(KMINL[a]??99)-(KMINL[b]??99) || K2W[b].length-K2W[a].length);
  if(sortMode==="jlpt")
    return [...ks].sort((a,b)=>(KANJI[b].n??0)-(KANJI[a].n??0) || K2W[b].length-K2W[a].length);
  return ks;
}
function listWords(parent, idxs, title){
  if(!idxs.length) return;
  label(parent, title);
  idxs.slice(0,HIT_CAP).forEach(i=>{
    const wd=WORDS[i];
    const d=document.createElement("div");
    d.className="wordhit";
    d.innerHTML=`<span class="w jp">${wd.w}</span><span class="r">${wd.r}</span><span class="m">${wd.m}</span>${tags(wd)}`;
    d.onclick=()=>{ const fk=[...wd.w].find(isKanji); if(fk) focusKanji(fk,true); };
    parent.appendChild(d);
  });
  if(idxs.length>HIT_CAP){
    const d=document.createElement("div");d.className="empty";
    d.textContent=`Showing ${HIT_CAP} of ${idxs.length} — narrow with more text.`;
    parent.appendChild(d);
  }
}

function renderIndex(query=""){
  $("indexView").classList.remove("hidden");
  $("focusView").classList.add("hidden");
  $("backBtn").classList.add("hidden");
  const area=$("gridArea"), hits=$("wordHits");
  area.innerHTML=""; hits.innerHTML="";
  const raw=query.trim(), q=raw.toLowerCase();
  const lspec = /^l/.test(q) ? parseRanges(q.slice(1),50) : null;
  const nspec = !lspec && /^n/.test(q) ? parseRanges(q.slice(1),5) : null;
  let any=true;

  if(lspec){
    const idxs=WORDS.map((w,i)=>[w,i]).filter(([w])=>inRanges(w.l,lspec)).map(([,i])=>i);
    DECK_TMP=idxs;
    const kset=new Set(); idxs.forEach(i=>[...WORDS[i].w].forEach(c=>{if(isKanji(c))kset.add(c);}));
    const ks=sortKanji(kanjiList.filter(k=>kset.has(k)));
    const name=fmtRanges(lspec,"L");
    label(area,`${name} · ${ks.length} kanji`); gridInto(area,ks);
    listWords(hits, idxs, `${name} · ${idxs.length} words`);
    any = ks.length||idxs.length;
  } else if(nspec){
    const nset=new Set(); nspec.forEach(([lo,hi])=>{for(let n=lo;n<=hi;n++)nset.add(n);});
    const ks=sortKanji(kanjiList.filter(k=>nset.has(KANJI[k].n)));
    const name=[...nset].sort((a,b)=>b-a).map(n=>"N"+n).join(", ");
    label(area,`JLPT ${name} · ${ks.length} kanji`); gridInto(area,ks);
    const idxs=WORDS.map((w,i)=>[w,i]).filter(([w])=>nset.has(w.n)).map(([,i])=>i);
    DECK_TMP=idxs;
    listWords(hits, idxs, `JLPT ${name} · ${idxs.length} words`);
    any = ks.length||idxs.length;
  } else if(q){
    const kset=new Set();
    kanjiList.forEach(k=>{
      const me=KANJI[k];
      if(k===raw || me.r.toLowerCase().includes(q) || me.m.toLowerCase().includes(q)) kset.add(k);
    });
    const widx=[];
    WORDS.forEach((wd,i)=>{
      if(wd.w.includes(raw) || wd.r.includes(q) || wd.m.toLowerCase().includes(q)){
        widx.push(i);
        [...wd.w].forEach(c=>{ if(isKanji(c)) kset.add(c); });
      }
    });
    const ks=sortKanji(kanjiList.filter(k=>kset.has(k)));
    if(ks.length){ label(area,`Kanji matching “${raw}”`); gridInto(area,ks); }
    DECK_TMP=widx;
    listWords(hits, widx, "Words");
    any = ks.length||widx.length;
  } else if(sortMode==="comp"){
    const nodes=Object.keys(INV).sort((a,b)=>(STR[a]??99)-(STR[b]??99) || INV[b].length-INV[a].length);
    label(area,`Building blocks · ${nodes.length} · simple → complex (ignores filters)`);
    const g=document.createElement("div");g.className="grid";
    nodes.forEach(c=>{
      const b=document.createElement("button");b.className="kchip";
      b.innerHTML=`<span class="k jp">${c}</span><span class="n">${INV[c].length}</span>`;
      b.onclick=()=>focusKanji(c,true);
      g.appendChild(b);
    });
    area.appendChild(g);
  } else {
    if(sortMode==="jlpt"){
      for(const N of [5,4,3,2,1,null]){
        const ks=kanjiList.filter(k=>KANJI[k].n===N).sort((a,b)=>K2W[b].length-K2W[a].length);
        if(!ks.length) continue;
        label(area, N?`JLPT N${N} · ${ks.length} kanji`:`Beyond JLPT lists · ${ks.length}`);
        gridInto(area,ks);
      }
    } else {
      label(area, sortMode==="lesson" ? "All kanji · by first lesson" : "All kanji · most connected first");
      gridInto(area, sortKanji(kanjiList));
    }
  }
  $("noHits").classList.toggle("hidden", !!any);
  const deck = lspec||nspec ? DECK_TMP : (q ? DECK_TMP : PASSIDX);
  setDeck(sortMode==="comp" && !q ? [] : deck);
}
let DECK_TMP=[], flashDeck=[], flashPos=0;
function setDeck(idxs){
  flashDeck=idxs||[];
  const b=$("flashBtn");
  b.classList.toggle("hidden", flashDeck.length<2);
  b.textContent=`▶ Flashcards · ${flashDeck.length} words`;
}

/* ---------- focus ---------- */
function focusKanji(k, push){
  if(push){
    if(trail[trail.length-1]!==k) trail.push(k);
    if(trail.length>14) trail=trail.slice(-14);
  }
  renderTrail();
  renderFocus(k);
  window.scrollTo({top:0,behavior:"smooth"});
}
function goBack(){
  if($("focusView").classList.contains("hidden")) return;
  if(trail.length>1){ trail.pop(); renderTrail(); renderFocus(trail[trail.length-1]); window.scrollTo({top:0}); }
  else { trail=[]; renderTrail(); $("search").value=""; renderIndex(); }
}
function renderTrail(){
  const t=$("trail"); t.innerHTML="";
  if(!trail.length) return;
  const lbl=document.createElement("span");
  lbl.className="trail-label"; lbl.textContent="thread";
  t.appendChild(lbl);
  trail.forEach((k,i)=>{
    if(i>0){const tie=document.createElement("span");tie.className="tie";t.appendChild(tie);}
    const b=document.createElement("button");
    b.className="hop jp"+(i===trail.length-1?" current":"");
    b.textContent=k;
    b.onclick=()=>{ trail=trail.slice(0,i+1); renderTrail(); renderFocus(k); };
    t.appendChild(b);
  });
  t.scrollLeft=t.scrollWidth;
}

function renderFocus(k, showAll=false, showAllInside=false){
  $("indexView").classList.add("hidden");
  $("focusView").classList.remove("hidden");
  $("backBtn").classList.remove("hidden");
  const meta=metaOf(k);
  $("sealK").textContent=k;
  $("sealR").textContent=meta.r;
  $("sealM").textContent=meta.m;
  $("sealN").innerHTML = meta.n ? `<span class="tag ntag seal-jlpt">JLPT N${meta.n}</span>` : "";

  const list=$("wordList"); list.innerHTML="";
  const idxs=[...(K2W[k]||[])].sort((a,b)=>
    (WORDS[a].l??99)-(WORDS[b].l??99) ||
    (WORDS[b].n??0)-(WORDS[a].n??0) ||
    WORDS[a].w.length-WORDS[b].w.length ||
    WORDS[a].r.localeCompare(WORDS[b].r,"ja"));
  if(!idxs.length){
    const d=document.createElement("div");d.className="card empty";
    d.textContent = isKanji(k)
      ? `No words for ${k} in the current filter.`
      : `${k} is a building block — no vocabulary of its own.`;
    list.appendChild(d);
  }
  const shown = showAll ? idxs : idxs.slice(0,WORD_CAP);
  shown.forEach((i,nth)=>{
    const wd=WORDS[i];
    const card=document.createElement("div");
    card.className="card";
    card.style.animationDelay=(Math.min(nth,30)*20)+"ms";
    const chars=document.createElement("div"); chars.className="chars";
    [...wd.w].forEach(c=>{
      if(c===k){
        const s=document.createElement("span");s.className="chr kfocus jp";s.textContent=c;chars.appendChild(s);
      } else if(isKanji(c)){
        const b=document.createElement("button");b.className="chr klink jp";b.textContent=c;
        b.onclick=()=>focusKanji(c,true);
        chars.appendChild(b);
      } else {
        const s=document.createElement("span");s.className="chr kana jp";s.textContent=c;chars.appendChild(s);
      }
    });
    const gloss=document.createElement("div");gloss.className="gloss";
    gloss.innerHTML=`<span class="r">${wd.r}</span><span class="m">${wd.m}</span>${tags(wd)}`;
    card.appendChild(chars);card.appendChild(gloss);
    list.appendChild(card);
  });
  if(!showAll && idxs.length>WORD_CAP){
    const b=document.createElement("button");
    b.className="btn morebtn";
    b.textContent=`Show all ${idxs.length} words`;
    b.onclick=()=>renderFocus(k,true);
    list.appendChild(b);
  }

  $("relSec").classList.toggle("hidden", !isKanji(k));
  const relCount={};
  idxs.forEach(i=>{
    [...new Set([...WORDS[i].w])].forEach(c=>{
      if(c!==k && isKanji(c)) relCount[c]=(relCount[c]||0)+1;
    });
  });
  const rel=Object.entries(relCount).sort((a,b)=>b[1]-a[1]);
  const row=$("relRow"); row.innerHTML="";
  if(!rel.length){
    const d=document.createElement("div");d.className="empty";d.style.padding="6px 0";
    d.textContent="This one stands alone (so far).";
    row.appendChild(d);
  }
  rel.slice(0,REL_CAP).forEach(([c,n])=>{
    const b=document.createElement("button");b.className="relchip";
    b.innerHTML=`<span class="k jp">${c}</span><span class="c">${n} word${n>1?"s":""}</span>`;
    b.onclick=()=>focusKanji(c,true);
    row.appendChild(b);
  });
  if(rel.length>REL_CAP){
    const d=document.createElement("span");d.className="relchip";
    d.style.cursor="default";
    d.innerHTML=`<span class="c">+${rel.length-REL_CAP} more</span>`;
    row.appendChild(d);
  }

  /* made of */
  const comps=COMP[k]||[];
  $("compSec").classList.toggle("hidden", !comps.length);
  const crow=$("compRow"); crow.innerHTML="";
  comps.forEach(c=>{
    const b=document.createElement("button");b.className="relchip";
    const nm=metaOf(c).m.split(",")[0].slice(0,16);
    b.innerHTML=`<span class="k jp">${c}</span><span class="c">${nm}</span>`;
    b.onclick=()=>focusKanji(c,true);
    crow.appendChild(b);
  });

  /* found inside */
  const kids=(INV[k]||[]).slice().sort((a,b)=>((K2W[b]||[]).length)-((K2W[a]||[]).length) || (STR[a]??99)-(STR[b]??99));
  $("insideSec").classList.toggle("hidden", !kids.length);
  if(kids.length){
    $("insideLbl").textContent=`Found inside · ${kids.length} kanji`;
    const areaI=$("insideArea"); areaI.innerHTML="";
    const CAP=60, shownK = showAllInside ? kids : kids.slice(0,CAP);
    const g=document.createElement("div");g.className="grid";
    shownK.forEach(c=>{
      const b=document.createElement("button");b.className="kchip";
      const sub=(K2W[c]||[]).length || "·";
      b.innerHTML=`<span class="k jp">${c}</span><span class="n">${sub}</span>`;
      b.onclick=()=>focusKanji(c,true);
      g.appendChild(b);
    });
    areaI.appendChild(g);
    if(!showAllInside && kids.length>CAP){
      const b=document.createElement("button");b.className="btn morebtn";
      b.textContent=`Show all ${kids.length}`;
      b.onclick=()=>renderFocus(k,showAll,true);
      areaI.appendChild(b);
    }
  }

  requestAnimationFrame(()=>requestAnimationFrame(drawThreads));
}

function drawThreads(){
  const svg=$("threads"), fan=$("fan"), seal=$("sealK");
  if($("focusView").classList.contains("hidden")) return;
  const fr=fan.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${fr.width} ${fan.scrollHeight}`);
  svg.style.height=fan.scrollHeight+"px";
  svg.innerHTML="";
  const sr=seal.getBoundingClientRect();
  const x0=sr.right-fr.left-4, y0=sr.top-fr.top+sr.height/2;
  document.querySelectorAll("#wordList .card").forEach(card=>{
    const cr=card.getBoundingClientRect();
    const x1=cr.left-fr.left, y1=cr.top-fr.top+cr.height/2;
    const mx=(x0+x1)/2;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M ${x0} ${y0} C ${mx} ${y0}, ${mx} ${y1}, ${x1} ${y1}`);
    svg.appendChild(p);
  });
}

/* ---------- flashcards ---------- */
let flashOrder=[];
function startFlash(){
  if(flashDeck.length<2) return;
  flashOrder=[...flashDeck]; flashPos=0;
  $("flashView").classList.remove("hidden");
  document.body.classList.add("flash-open");   /* hides the 糸。pill behind ✕ */
  document.body.style.overflow="hidden";
  showCard();
}
function showCard(){
  const wd=WORDS[flashOrder[flashPos]];
  $("fCard").classList.remove("flipped");
  const long = wd.w.length>4;
  $("fWord").textContent=wd.w;  $("fWord").classList.toggle("long",long);
  $("fWord2").textContent=wd.w; $("fWord2").classList.toggle("long",long);
  $("fRead").textContent=wd.r;
  $("fMean").textContent=wd.m;
  $("fTags").innerHTML=tags(wd);
  $("fCount").textContent=`${flashPos+1} / ${flashOrder.length}`;
}
function flashNext(d){
  flashPos=(flashPos+d+flashOrder.length)%flashOrder.length;
  showCard();
}
function exitFlash(){
  $("flashView").classList.add("hidden");
  document.body.classList.remove("flash-open");
  document.body.style.overflow="";
}
$("flashBtn").onclick=startFlash;
$("fCard").onclick=()=>$("fCard").classList.toggle("flipped");
$("fNext").onclick=()=>flashNext(1);
$("fPrev").onclick=()=>flashNext(-1);
$("fExit").onclick=exitFlash;
/* ---------- Japanese typeface ---------- */
const FACES=[
  {k:"",         short:"明朝",   label:"明朝",     en:"Mincho — the original"},
  {k:"face-kyo", short:"教科書", label:"教科書体風", en:"Textbook style — soft pen strokes"},
  {k:"face-maru",short:"丸ゴ",   label:"丸ゴシック", en:"Rounded gothic — easiest to read"}
];
let faceIdx=0;
try{ const sv=localStorage.getItem("kanji_face");
     if(sv!==null){ const i=FACES.findIndex(f=>f.k===sv); if(i>=0) faceIdx=i; } }catch(e){}
function applyFace(announce){
  FACES.forEach(f=>{ if(f.k) document.body.classList.remove(f.k); });
  const f=FACES[faceIdx];
  if(f.k) document.body.classList.add(f.k);
  /* the あ renders in the live face (so the button previews it) and the
     caption names it — otherwise it reads as a stray hiragana button */
  const b=$("faceBtn");
  if(b){ const n=b.querySelector(".fname"); if(n) n.textContent=f.short;
         b.title="書体："+f.label+" — tap to change ("+f.en+")"; }
  try{ localStorage.setItem("kanji_face", f.k); }catch(e){}
  if(announce){
    let t=document.getElementById("faceToast");
    if(!t){ t=document.createElement("div"); t.id="faceToast"; t.className="facetoast";
            document.body.appendChild(t); }
    t.textContent=f.label+" · "+f.en;
    t.classList.add("show");
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600);
  }
}
applyFace(false);
$("faceBtn").onclick=()=>{ faceIdx=(faceIdx+1)%FACES.length; applyFace(true); };

$("fShuf").onclick=()=>{
  for(let i=flashOrder.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashOrder[i],flashOrder[j]]=[flashOrder[j],flashOrder[i]];
  }
  flashPos=0; showCard();
  const c=$("fCount");
  if(c){ const was=c.textContent; c.textContent="シャッフルしました";
         clearTimeout(c._h); c._h=setTimeout(()=>{ if(flashDeck.length) showCard(); else c.textContent=was; },900); }
};
document.addEventListener("keydown",e=>{
  if($("flashView").classList.contains("hidden")) return;
  if(e.key==="ArrowRight") flashNext(1);
  else if(e.key==="ArrowLeft") flashNext(-1);
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();$("fCard").classList.toggle("flipped");}
  else if(e.key==="Escape") exitFlash();
});

/* ---------- wiring ---------- */
$("homeBtn").onclick = ()=>{ $("search").value=""; renderIndex(); };
$("allBtn").onclick  = ()=>{ $("search").value=""; renderIndex(); };
$("backBtn").onclick = goBack;
$("search").addEventListener("input", e=>renderIndex(e.target.value));
function refreshChips(){
  document.querySelectorAll("#filterRow .fchip").forEach(b=>{
    const f=b.dataset.f;
    b.classList.toggle("on",
      f==="all" ? filt.all :
      f==="s1"  ? filt.s1 :
      f==="s2"  ? filt.s2 :
      filt.nl.has(+f[1]));
  });
}
function anySelected(){ return filt.s1||filt.s2||filt.nl.size||filt.lr; }
function afterFilterChange(){
  if(!anySelected()){ filt.all=true; }
  refreshChips(); rebuild();
  if(!$("focusView").classList.contains("hidden") && trail.length){
    renderFocus(trail[trail.length-1]);
  } else {
    renderIndex($("search").value);
  }
}
$("filterRow").addEventListener("click", e=>{
  const b=e.target.closest(".fchip"); if(!b) return;
  const f=b.dataset.f;
  if(f==="all"){
    filt.all=true; filt.s1=filt.s2=false; filt.nl.clear();
    filt.lr=null; $("lrange").value="";
  } else {
    filt.all=false;
    if(f==="s1") filt.s1=!filt.s1;
    else if(f==="s2") filt.s2=!filt.s2;
    else { const n=+f[1]; filt.nl.has(n)?filt.nl.delete(n):filt.nl.add(n); }
  }
  afterFilterChange();
});
$("lrange").addEventListener("input", e=>{
  const v=e.target.value.trim();
  const rs=v?parseRanges(v.replace(/^l/i,""),50):null;
  if(rs){ filt.lr=rs; filt.all=false; }
  else  { filt.lr=null; }
  afterFilterChange();
});
$("sortRow").addEventListener("click", e=>{
  const b=e.target.closest(".seg"); if(!b) return;
  sortMode=b.dataset.sort;
  document.querySelectorAll(".sortrow .seg").forEach(x=>x.classList.toggle("on",x===b));
  renderIndex($("search").value);
});
window.addEventListener("resize", ()=>drawThreads());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>drawThreads());

window.__kanji = { KANJI, WORDS, KANJI_RAW };   /* debug handle only */
rebuild();
renderIndex();
})();
</script>
<script>
/* auto-updater: iOS home-screen apps cache HTML hard. On launch, fetch a fresh
   copy (cache-bypassed); if the server's APPV differs, load the fresh copy.
   We navigate rather than document.write(); own sessionStorage key so a sibling
   app's version string can't mask an update here. Bump APPV each release. */
(function(){var APPV="2026.09.14-1";
try{if(sessionStorage.getItem("itoUpdKanji")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("itoUpdKanji",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
