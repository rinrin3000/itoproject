<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>読解の糸 — Reading Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161f; --card:#1b222e; --card2:#232c3a; --line:#2e3949;
  --thread:#e8e0ce; --ai:#7d9cc9; --akane:#d4685e; --moegi:#93b06b;
  --kuchiba:#c9b370; --dim:#8b95a5; --ad-gap:90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--thread);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:var(--ad-gap)}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
h1{font-family:'Shippori Mincho B1',serif;font-size:22px;font-weight:700;letter-spacing:.06em}
h1 span{color:var(--akane)}
.hpill{font-size:12px;color:var(--ink);background:var(--thread);border-radius:999px;padding:3px 10px;font-weight:700}
.hlink{text-decoration:none;font-family:'Shippori Mincho B1',serif;font-size:15px;color:var(--akane);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;font-weight:500;padding:12px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--thread);border-bottom-color:var(--akane)}
main{padding:16px;max-width:660px;margin:0 auto}
.hint{color:var(--dim);font-size:13px;line-height:1.7}
.sec{margin-top:20px;margin-bottom:8px;font-size:11px;color:var(--ai);letter-spacing:.18em}
.sec:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:999px;font-size:13px;padding:7px 13px;line-height:1.35}
.chip.on{border-color:var(--akane);color:var(--akane);background:#2a1f22}
select{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:15px;padding:10px 13px;border-radius:10px;width:100%;-webkit-appearance:none}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:var(--thread)}
.empty{text-align:center;color:var(--dim);font-size:14px;margin-top:34px;line-height:2}
ruby{ruby-position:over}
rt{font-size:.52em;color:var(--dim);font-weight:400;letter-spacing:0;line-height:1;-webkit-user-select:none;user-select:none}
nav button ruby rt{font-size:.55em}

/* ---------- 本棚 level picker ---------- */
.lvbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px}
.lvtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lvnum{font-family:'Shippori Mincho B1',serif;font-size:34px;line-height:1}
.lvnum small{font-size:14px;color:var(--dim);margin-left:4px}
.lvband{font-size:12px;color:var(--ai);text-align:right;line-height:1.5}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:8px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--akane);margin-top:-10px;border:3px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--akane);border:3px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px}
.stepr{display:flex;gap:6px;margin-top:8px}
.stepr button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:13px;padding:7px 0;border-radius:9px}

.scard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:8px;color:inherit;font-family:inherit}
.scard:active{border-color:var(--akane)}
.scard.fit{border-color:#4a3a3a}
.scard.lock{opacity:.5}
.scard .st{font-family:'Shippori Mincho B1',serif;font-size:20px;line-height:1.5}
.scard .se{font-size:12.5px;color:var(--ai);margin-top:1px}
.scard .sa{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
.scard .sm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--dim)}
.tag.lv{color:var(--akane);border-color:#5c3b38}
.tag.dn{color:var(--moegi);border-color:#3f5230}
.tag.bm{color:var(--kuchiba);border-color:#5c5130}
.tag.rv{color:var(--ai);border-color:#34486a}
.tag rt{font-size:.6em}

/* ---------- reader ---------- */
#rd{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;flex-direction:column}
#rd.on{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.rbar .x{background:none;border:none;color:var(--dim);font-size:20px;padding:0 6px;font-family:inherit}
.rbar .rt{flex:1;min-width:0;font-family:'Shippori Mincho B1',serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .tb{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12.5px;border-radius:999px;padding:5px 10px;white-space:nowrap}
.rbar .tb.on{color:var(--akane);border-color:var(--akane)}
#r-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rwrap{max-width:660px;margin:0 auto;padding:18px 18px 120px}
.rhead{margin-bottom:18px}
.rhead .t{font-family:'Shippori Mincho B1',serif;font-size:27px;line-height:1.8}
.rhead .e{font-size:13px;color:var(--ai)}
.rhead .a{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:8px}
.rhead .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2a2618;border:1px solid #5c5130;color:var(--kuchiba);border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:13px}
.resume button{background:var(--kuchiba);color:var(--ink);border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:13px}
.para{margin-bottom:1.3em}
.body{font-family:'Shippori Mincho B1',serif;font-size:var(--fs,21px);line-height:2.25;word-break:normal;line-break:strict}
.ln{margin-bottom:.35em}
.ln.dlg{display:flex;gap:.6em;align-items:baseline}
.spk{flex:0 0 auto;font-family:'Noto Sans JP',sans-serif;font-size:.56em;color:var(--ai);border:1px solid var(--line);border-radius:6px;padding:0 .5em;line-height:1.9;position:relative;top:-.15em;white-space:nowrap}
.spk rt{font-size:.6em}
.spk.f{color:#d9a7a0}.spk.m{color:#8fb0d6}
.sen{border-radius:6px;transition:background .25s;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sen.now{background:rgba(212,104,94,.17)}
.sen.cur{box-shadow:inset 0 -2px 0 rgba(212,104,94,.55)}
.sen.bmk::before{content:"🔖";font-size:.6em;margin-right:.15em;position:relative;top:-.4em}
.en{display:none;font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.6;color:var(--ai);margin:.1em 0 .6em}
.en-on .sen,.sen.en1{display:block}
.en-on .ln.dlg .sen{display:block}
.en-on .en,.sen.en1 .en{display:block}
.w,.p{cursor:pointer}
/* hidden readings take no width (font-size 0), so 先週 doesn't sprout a gap where
   せんしゅう would sit; revealing one word reflows only that word */
.w rt{visibility:hidden;font-size:0}
.furi-all .w rt,.w.show rt,.w.ex rt,.w.nm rt{visibility:visible;font-size:.5em}
@media (hover:hover){ .w:hover rt{visibility:visible;font-size:.5em} .w:hover{color:#fff} }
.w.ex{text-decoration:underline dotted var(--kuchiba);text-underline-offset:.32em;text-decoration-thickness:1px}
.w.ex rt{color:var(--kuchiba)}
.w.st{text-decoration:underline solid var(--kuchiba);text-underline-offset:.32em;text-decoration-thickness:2px}
.w.tap,.p.tap{background:rgba(125,156,201,.22);border-radius:4px}
.w.sel,.p.sel{background:rgba(201,179,112,.28)}
.selbar{position:sticky;top:0;z-index:3;background:#2a2618;color:var(--kuchiba);border-bottom:1px solid #5c5130;font-size:13px;padding:9px 14px;display:none;justify-content:space-between;align-items:center;gap:10px}
.selbar.on{display:flex}
.selbar button{background:none;border:1px solid #5c5130;color:var(--kuchiba);border-radius:8px;padding:4px 10px;font-family:inherit;font-size:12px}
.endbox{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.endbox .done{width:100%;background:var(--moegi);color:var(--ink);border:none;border-radius:12px;padding:14px;font-family:inherit;font-weight:700;font-size:15px}
.endbox .done.was{background:var(--card2);color:var(--moegi);border:1px solid #3f5230}
.glist{margin-top:16px}
.glist .gi{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.glist .gw{font-family:'Shippori Mincho B1',serif;font-size:17px;flex:0 0 auto}
.glist .gr{color:var(--dim);font-size:12px}
.glist .gm{color:var(--ai);flex:1}
.rctl{display:flex;align-items:center;gap:7px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ink)}
.rctl button{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:12px;font-size:18px;padding:11px 0;flex:1}
.rctl button.play{flex:1.6;background:var(--akane);color:var(--ink);border:none;font-weight:700}
.rctl button.sm{flex:0 0 auto;font-size:12.5px;padding:12px 10px;color:var(--dim)}
.rctl button:disabled{opacity:.4}

/* ---------- bottom sheet ---------- */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.35);display:none}
#scrim.on{display:block}
#sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:72vh;overflow-y:auto}
#sheet.on{transform:none;visibility:visible}
.sh-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sh-word{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sh-w{font-family:'Shippori Mincho B1',serif;font-size:30px;line-height:1.5}
.sh-w rt{visibility:visible}
.sh-d{font-size:13px;color:var(--thread);margin-top:2px;line-height:1.6}
.sh-d .k{color:var(--dim)}
.sh-d .l{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;color:var(--dim)}
.sh-d .l.x{color:var(--kuchiba);border-color:#5c5130}
.sh-sen{font-family:'Shippori Mincho B1',serif;font-size:16px;line-height:1.9;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sh-en{font-size:13px;color:var(--ai);margin-top:4px;line-height:1.6}
.sh-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.sh-btns button{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:10px;font-size:13px;padding:9px 12px}
.sh-btns button.on{color:var(--kuchiba);border-color:#5c5130}
.sh-btns button.pri{background:var(--akane);color:var(--ink);border:none;font-weight:700}
.sh-x{background:none;border:none;color:var(--dim);font-size:18px;padding:2px 4px}

/* ---------- キープ ---------- */
.krow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:7px}
.krow .kl{flex:1;min-width:0}
.krow .kj{font-family:'Shippori Mincho B1',serif;font-size:18px;line-height:1.6}
.krow .kj rt{visibility:visible}
.krow .kk{font-size:11.5px;color:var(--dim);margin-top:2px}
.krow .km{font-size:12.5px;color:var(--ai);margin-top:3px;line-height:1.55}
.krow .kr{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.mini{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;font-family:inherit;font-size:12px;padding:5px 9px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--thread);color:var(--ink);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>読解<span>の</span>糸</h1>
  <span style="display:flex;gap:10px;align-items:center">
    <span class="hpill" id="hpill">…</span>
    <a href="index.html" class="hlink" title="Back to the Ito hub">糸。</a>
  </span>
</header>
<nav>
  <button id="tab-lib" class="on"><ruby>本棚<rt>ほんだな</rt></ruby></button>
  <button id="tab-keep">★ キープ</button>
  <button id="tab-set"><ruby>設定<rt>せってい</rt></ruby></button>
</nav>
<main id="main"></main>

<div id="rd">
  <div class="rbar">
    <button class="x" id="r-close" aria-label="close">✕</button>
    <div class="rt" id="r-title"></div>
    <button class="tb" id="r-furi">あ</button>
    <button class="tb" id="r-en">英</button>
    <button class="tb" id="r-size">Aa</button>
  </div>
  <div id="r-scroll">
    <div class="selbar" id="selbar"><span>✂ フレーズの<b>終わり</b>をタップ（同じ文の中）</span><button id="sel-cancel">やめる</button></div>
    <div class="rwrap" id="r-body"></div>
  </div>
  <div class="rctl">
    <button id="c-prev" aria-label="previous sentence">⏮</button>
    <button id="c-play" class="play">▶</button>
    <button id="c-next" aria-label="next sentence">⏭</button>
    <button id="c-rate" class="sm">0.9×</button>
    <button id="c-mode" class="sm">連続</button>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){

/* =====================================================================
   ==================  DATA — EDITABLE CONTENT SECTION  =================
   =====================================================================
   STORIES is GENERATED by build/build.py from build/stories/*.txt and
   pasted here. Hand edits are fine, but the next build will overwrite
   them — edit the .txt sources instead when you can.

   Each story:
     id   PERMANENT — ★, 🔖 and 続き are keyed to it. Never change or reuse.
     l    ceiling: no vocabulary from a Minna lesson after this one
     f    [lo,hi] focus band — the lessons the story deliberately works
     t    title (markup)    te English title    a  one-line blurb
     p    paragraphs → lines {j: markup, e: English, s?: speaker}
     g    glossary [dictionary form, reading, gloss, lesson (0 = not Minna)]
     sp   speakers {name: [f|m, reading]}
     k    "review" = long cumulative story (everything up to its lesson)
   Markup inside j / t:
     [表記|よみ|g|flags]   g = index into the story's glossary
       flags  *  beyond the story's level → furigana always on, dotted line
              #  proper noun → furigana always on
              !  TTS reads the kana instead of the kanji (known misreads)
     anything outside brackets is plain kana / punctuation
   ===================================================================== */
const STORIES=[

{"id":"R33b","l":33,"f":[29,33],"t":"[駅|えき|0]の[看板|かんばん|1|*]","te":"The station signs","a":"Long review, L29–33: commands (命令形), don'ts (禁止形), \"reads as\" (〜と読みます), \"means\" (〜という意味です), passing on messages (〜と伝えていただけませんか).","p":[[{"j":"[日曜日|にちようび|2]、グエン[さん||3]と[東京|とうきょう||#]へ[行き|いき|4]ました。","e":"On Sunday, I went to Tokyo with Mr. Nguyen."},{"j":"グエン[さん||3]は[来月|らいげつ|5][試験|しけん|6]がありますから、[駅|えき|0]の[看板|かんばん|1|*]で[漢字|かんじ|7]を[練習|れんしゅう|8]しようと[思っ|おもっ|9]ていました。","e":"Because Mr. Nguyen has an exam next month, he was thinking, \"let's practice kanji with the station signs.\""}],[{"j":"マリア[さん||3]、[あの||10][漢字|かんじ|7]は[何|なん|11]と[読み|よみ|12]ますか。","e":"Ms. Maria, that kanji — what do you read it as?","s":"グエン"},{"j":"「[出口|でぐち|13]」です。「[でぐち||13]」と[読み|よみ|12]ます。","e":"It's 出口. You read it as \"deguchi.\"","s":"マリア"},{"j":"[じゃ||14]、[あれ||15]は？","e":"Then, that one?","s":"グエン"},{"j":"「[入口|いりぐち|16]」。「[いりぐち||16]」と[読み|よみ|12]ます。","e":"入口. You read it as \"iriguchi.\"","s":"マリア"},{"j":"「[立入|たちいり|17][禁止|きんし|17]」は[どういう||18][意味|いみ|19]ですか。","e":"立入禁止 — what kind of meaning is it?","s":"グエン"},{"j":"「[入る|はいる|20]な」と[いう||21][意味|いみ|19]です。","e":"It's the meaning \"don't enter!\"","s":"マリア"},{"j":"「[止まれ|とまれ|22]」は？","e":"And 止まれ?","s":"グエン"},{"j":"「[止まれ|とまれ|22]」は「[止まっ|とまっ|22]てください」と[いう||21][意味|いみ|19]。[命令形|めいれいけい|23|*]だよ。","e":"止まれ is the meaning \"please stop.\" It's the command form.","s":"マリア"}],[{"j":"[ホーム||24|*]で、[大きい|おおきい|25][声|こえ|26]が[聞こえ|きこえ|27]ました。","e":"On the platform, a big voice was audible."},{"j":"[危ない|あぶない|28]！[止まれ|とまれ|22]！","e":"Danger! Stop!","s":"駅員"},{"j":"[小さい|ちいさい|29][男の子|おとこのこ|30]が、[電車|でんしゃ|31]の[近く|ちかく|32]へ[走っ|はしっ|33]て[行っ|いっ|4]たんです。","e":"It's that a little boy had run off toward the train."},{"j":"[男の子|おとこのこ|30]は[すぐ||34][止まり|とまり|22]ました。","e":"The boy stopped right away."},{"j":"[日本|にほん||#]の[駅員|えきいん|35][さん||3]は、[いつも||36]「〜てください」と[言う|いう|37]と[思っ|おもっ|9]ていました。","e":"I was thinking that Japanese station staff always say \"please ~.\"","s":"グエン"},{"j":"[危ない|あぶない|28][とき||38]は、[命令形|めいれいけい|23|*]を {"id":"R34b","l":34,"f":[30,34],"t":"[鈴木|すずき||#][さん||0]の[料理|りょうり|1][教室|きょうしつ|2]","te":"Mrs. Suzuki's cooking class","a":"Long review, L30–34: exactly as (〜とおりに), after (〜あとで vs 〜てから), with / without (〜て・〜ないで) — and everything back to L30.","p":[[{"j":"[土曜日|どようび|3]、[鈴木|すずき||#][さん||0]の[うち||4]で[料理|りょうり|1][教室|きょうしつ|2]がありました。","e":"On Saturday, there was a cooking class at Mrs. Suzuki's home."},{"j":"[習い|ならい|5]に[来|き|6]たのは、アヤ[さん||0]と[わたし||7]です。","e":"Those who came to learn are Aya and me."},{"j":"[きょう||8]は、[日本|にほん||#]の[カレー||9]を[作り|つくり|10]ます。","e":"Today, we'll make Japanese curry."}],[{"j":"[材料|ざいりょう|11]は[もう||12][全部|ぜんぶ|13][買っ|かっ|14]てあります。","e":"The ingredients have all already been bought (and are ready).","s":"鈴木"},{"j":"[野菜|やさい|15]も[洗っ|あらっ|16]ておきました。","e":"The vegetables too, I washed in advance.","s":"鈴木"},{"j":"[きょう||8]は、[わたし||7]がするとおりに、してくださいね。","e":"Today, please do exactly as I do, okay?","s":"鈴木"},{"j":"[はい||17]、[先生|せんせい|18]！","e":"Yes, teacher!","s":"アヤ"}],[{"j":"[まず||19]、[手|て|20]を[洗っ|あらっ|16]てから、[エプロン||21|*]をしてください。","e":"First, after washing your hands, please put on an apron.","s":"鈴木"},{"j":"[それ||22]から、[玉ねぎ|たまねぎ|23]を[切り|きり|24]ます。","e":"After that, we cut the onion.","s":"鈴木"},{"j":"アヤ[さん||0]は、[玉ねぎ|たまねぎ|23]を[切り|きり|24]ながら、「[目|め|25]が[痛い|いたい|26]！」と[言っ|いっ|27]ていました。","e":"Cutting the onion, Aya was saying, \"My eyes hurt!\""},{"j":"[めがね||28]を[かけ||29]て、[切っ|きっ|24]てください。[少し|すこし|30]いいですよ。","e":"Wearing glasses, please cut. It's a little better.","s":"鈴木"},{"j":"アヤ[さん||0]は[わたし||7]の[めがね||28]を[かけ||29]て、[切り|きり|24]ました。","e":"Wearing my glasses, Aya cut."}],[{"j":"[肉|にく|31]を[入れ|いれ|32]た[あと||33]で、[野菜|やさい|15]を[入れ|いれ|32]ます。","e":"After the meat has been put in, we put in the vegetables.","s":"鈴木"},{"j":"[野菜|やさい|15]を[入れ|いれ|32]てから、[水|みず|34]を[入れ|いれ|32]ますか。","e":"After putting in the vegetables, do we put in water?","s":"マリア"},{"j":"そうです。[この||35][紙|かみ|36]に[書い|かい|37]てあるとおりに、[水|みず|34]を[入れ|いれ|32]てください。","e":"That's right. Exactly as it's written on this paper, please put in water.","s":"鈴木"},{"j":"[紙|かみ|36]には「[水|みず|34]　[六百|ろくひゃく][ミリリットル||38|*]」と[書い|かい|37]てありました。","e":"On the paper, \"water: 600 milliliters\" had been written."},{"j":"[わたし||7]は[紙|かみ|36]のとおりに、[六百|ろくひゃく][ミリリットル||38|*][入れ|いれ|32]ました。","e":"Exactly as the paper said, I put in 600 milliliters."}],[{"j":"[二十|にじゅう][分|ふん|39]ぐらい[煮|に|40]た[あと||33]で、[カレー||9]の[ルー||41|*]を[入れ|いれ|32]ました。","e":"After simmering about twenty minutes, we put in the curry roux."},{"j":"[早く|はやく|42][食べ|たべ|43]たい！","e":"I want to eat soon!","s":"アヤ"},{"j":"[もう||44][少し|すこし|44][待っ|まっ|45]てください。[ルー||41|*]を[入れ|いれ|32]た[あと||33]で、[十分|じゅっぷん|46][煮|に|40]なければなりません。","e":"Please wait a little more. After putting in the roux, we must simmer for ten minutes.","s":"鈴木"}],[{"j":"[ご飯|ごはん|47]は、[もう||12][作っ|つくっ|10]てありますよ。","e":"The rice has already been made (and is ready).","s":"鈴木"},{"j":"[お||48][皿|さら|48]を[出し|だし|49]ておいてくれますか。","e":"Will you take out the plates in advance for me?","s":"鈴木"},{"j":"[はい||17]。","e":"Yes.","s":"マリア"}],[{"j":"[カレー||9]が[でき||50]ました。","e":"The curry was done."},{"j":"[三|さん][人|にん]で[テーブル||51]に[座っ|すわっ|52]てから、[食べ|たべ|43]ました。","e":"After the three of us sat at the table, we ate."},{"j":"[おいしい||53]！","e":"Delicious!","s":"アヤ"},{"j":"ブラジルの[カレー||9]とは、[全然|ぜんぜん|54][違い|ちがい|55]ますね。","e":"It's totally different from Brazilian curry, huh.","s":"マリア"},{"j":"[日本|にほん||#]の[カレー||9]は、[甘い|あまい|56]でしょう？","e":"Japanese curry is sweet, right?","s":"鈴木"}],[{"j":"アヤ[さん||0]は、[カレー||9]に[何|なに]も[かけ||29]ないで、[食べ|たべ|43]ていました。","e":"Aya was eating her curry without putting anything on it."},{"j":"[わたし||7]は、[しょうゆ||57]を[かけ||29]て、[食べ|たべ|43]ました。","e":"I ate it with soy sauce poured on."},{"j":"え、[カレー||9]に[しょうゆ||57]？","e":"Huh, soy sauce on curry?","s":"鈴木"},{"j":"ブラジルでは、[いろいろ||58]な[物|もの]に[しょうゆ||57]を[かける||29]んです。","e":"It's that in Brazil, we pour soy sauce on all kinds of things.","s":"マリア"},{"j":"……[はい||17]、いいです。[好き|すき|59]なとおりに、[食べ|たべ|43]てください。","e":"…Yes, it's fine. Please eat it exactly how you like.","s":"鈴木"}],[{"j":"[食べ|たべ|43]た[あと||33]で、[三|さん][人|にん]で[ {"id":"R35a","l":35,"f":[33,35],"t":"[夏|なつ|0]は[どこ||1]へ？","te":"Where to this summer?","a":"Two friends weigh a summer trip — if you want the sea, if it's cheap, if it rains.","p":[[{"j":"マリア、[夏|なつ|0]の[休み|やすみ|2]は[どこ||1]かへ[行く|いく|3]？","e":"Maria, are you going anywhere for summer vacation?","s":"アヤ"},{"j":"[まだ||4][決め|きめ|5]ていないんだ。[どこ||1]かいい[所|ところ|6]、[知ら|しら|7]ない？","e":"I haven't decided yet. Know anywhere good?","s":"マリア"},{"j":"[海|うみ|8]が[見|み|9]たければ、[沖縄|おきなわ||#]がいいよ。","e":"If you want to see the sea, Okinawa's great.","s":"アヤ"},{"j":"[海|うみ|8]が[とても||10][きれい||11]だし、[魚|さかな|12]も[たくさん||13][見|み|9]られるよ。","e":"The sea is beautiful, and you can see lots of fish.","s":"アヤ"},{"j":"[沖縄|おきなわ||#]か。[飛行機|ひこうき|14]は[高い|たかい|15]？","e":"Okinawa, huh. Is the flight expensive?","s":"マリア"},{"j":"[早く|はやく|16][予約|よやく|17]すれば、[安い|やすい|18]よ。","e":"If you book early, it's cheap.","s":"アヤ"},{"j":"[安く|やすく|18][行く|いく|3]なら、[平日|へいじつ|19]がいいね。","e":"If you're going cheap, weekdays are best.","s":"アヤ"},{"j":"でも、[夏|なつ|0]の[沖縄|おきなわ||#]は[とても||10][暑い|あつい|20]よね……。","e":"But Okinawa in summer is really hot, right…","s":"マリア"},{"j":"[うん||21]。[それ||22]に、[天気|てんき|23]が[悪けれ|わるけれ|24]ば、[飛行機|ひこうき|14]は[飛ば|とば|25]ないし。","e":"Yeah. And if the weather's bad, the planes don't fly.","s":"アヤ"}],[{"j":"[涼しい|すずしい|26][所|ところ|6]なら、[どこ||1]がいい？","e":"If I want somewhere cool, where's good?","s":"マリア"},{"j":"[涼しい|すずしい|26][所|ところ|6]なら、[北海道|ほっかいどう||#]だね。","e":"If you want cool, Hokkaido.","s":"アヤ"},{"j":"[夏|なつ|0]の[北海道|ほっかいどう||#]は、[花|はな|27]が[たくさん||13][咲い|さい|28]ていて、[とても||10][きれい||11]だよ。","e":"Hokkaido in summer is full of flowers — really pretty.","s":"アヤ"},{"j":"[北海道|ほっかいどう||#]は[前|まえ|29]から[行き|いき|3]たかったんだ。","e":"I've wanted to go to Hokkaido for a long time.","s":"マリア"},{"j":"[じゃ||30]、[北海道|ほっかいどう||#]にすれば？","e":"Then why not go with Hokkaido?","s":"アヤ"},{"j":"[うーん||31]……。[歴史|れきし|32]が[好き|すき|33]なら、[どこ||1]がいい？","e":"Hmm… And if I like history, where's good?","s":"マリア"},{"j":"[歴史|れきし|32]なら、[京都|きょうと||#]か[奈良|なら||#]だね。","e":"For history, Kyoto or Nara.","s":"アヤ"},{"j":"[京都|きょうと||#]は、[もう||34][行っ|いっ|3]たことがあるんだ。","e":"I've already been to Kyoto.","s":"マリア"},{"j":"[じゃ||30]、[奈良|なら||#]！","e":"Then Nara!","s":"アヤ"}],[{"j":"[困っ|こまっ|35]たなあ。[海|うみ|8]も[見|み|9]たいし、[涼しい|すずしい|26][所|ところ|6]にも[行き|いき|3]たいし、[歴史|れきし|32]も[おもしろい||36]し……。","e":"What a dilemma. I want to see the sea, and go somewhere cool, and history is interesting too…","s":"マリア"},{"j":"[お金|おかね|37]と[時間|じかん|38]があれば、[全部|ぜんぶ|39][行ける|いける]よ。","e":"If you have the money and the time, you can go to all of them.","s":"アヤ"},{"j":"[お金|おかね|37]と[時間|じかん|38]があれば、ね。","e":"If I have the money and the time, right.","s":"マリア"},{"j":"[じゃ||30]、[いっしょ||40]に[考えよう|かんがえよう|41]。","e":"Then let's think it through together.","s":"アヤ"},{"j":"[休み|やすみ|2]は[何日|なんにち|42]あるの？","e":"How many days off do you have?","s":"アヤ"},{"j":"[五|いつ][日|か|43]。","e":"Five.","s":"マリア"},{"j":"[五|いつ][日|か|43]あれば、[北海道|ほっかいどう||#]に[行ける|いける]よ。","e":"With five days, you can do Hokkaido.","s":"アヤ"}],[{"j":"1[週間|しゅうかん|44][後|ご|45]、[わたし||46]は[北海道|ほっかいどう||#]の[チケット||47]を[予約|よやく|17]しました。","e":"A week later, I booked tickets to Hokkaido."},{"j":"アヤ[さん||48]の[言っ|いっ|49]たとおり、[早く|はやく|16][予約|よやく|17]すれば、[安かっ|やすかっ|18]たです。","e":"Just like Aya said — book early and it's cheap."},{"j":"[沖縄|おきなわ||#]と[奈良|なら||#]は、[来年|らいねん|50]、[機会|きかい|51]があれば、[行こう|いこう|3]と[思っ|おもっ|52]ています。","e":"Okinawa and Nara — I'm thinking I'll go next year, if I get the chance."}]],"g":[["夏","なつ","summer",12],["どこ","どこ","where, what place",3],["休み","やすみ","rest, a holiday, a day off",4],["行く","いく","go",5],["まだ","まだ","not yet",7],["決める","きめる","decide",30],["所","ところ","place",8],["知る","しる","get to know",15],["海","うみ","sea, ocean",12],["見る","みる","see, look at, watch",6],["とても","とても","very",8],["きれい","きれい","beautiful, clean",8],["魚","さかな","fish",6],["たくさん","たくさん","many, much",9],["飛行機","ひこうき","aeroplane, airplane",5],["高い","たかい","expensive, tall, high",8],["早い","はやい","early, quickly, fast",9],["予約","よやく","reserve, book",18],["安い","やすい","inexpensive",8],["平日","へいじつ","weekday",26],["暑い","あつい","hot",8],["うん","うん","yes (an informal equivalent of はい)",20],["それ","それ","that (thing near the listener)",2],["天気","てんき","weather",12],["悪い","わるい","bad",8],["飛ぶ","とぶ","fly",27],["涼しい","すずしい","cool",12],["花","はな","flower, blossom",7],["咲く","さく","[flowers] bloom",35],["前","まえ","front, before",10],["じゃ","じゃ","well, then, in that case",3],["うーん","うーん","Let me see.",22],["歴史","れきし","history",35],["好き","すき","like",9],["もう","もう","already",7],["困る","こまる","be in trouble, have a problem",26],["おもしろい","おもしろい","interesting",8],["お金","おかね","money",7],["時間","じかん","time",9],["全部","ぜんぶ","all",11],["いっしょ","いっしょ","together",6],["考える","かんがえる","think, consider",25],["何日","なんにち","which day of the month, how many days",5],["日","か","day, date",5],["週間","しゅうかん","－ week(s)",11],["後","ご","after ～ (duration of time)",27],["わたし","わたし","I",1],["チケット","ちけっと","ticket",9],["さん","さん","Mr., Ms. (suffix added to a name for expressing politeness)",1],["言う","ゆう","entitled ～, named ～, called ～",21],["来年","らいねん","next year",5],["機会","きかい","chance, opportunity",35],["思う","おもう","think",21]],"sp":{"アヤ":["f","あや"],"マリア":["f","まりあ"]}},
{"id":"R35b","l":35,"f":[31,35],"t":"[四|よっ]つの「[もし||0]」","te":"Four kinds of \"if\"","a":"Long review, L23–35, built around the four conditionals: と (whenever — it always happens), ば (if — the condition is the point), たら (once / if — then do something), なら (if that's your plan / topic). Watch the English notes.","p":[[{"j":"[去年|きょねん|1]、[わたし||2]は[奈良|なら||#]へ[行け|いけ]ませんでした。","e":"Last year, I could not go to Nara."},{"j":"[今年|ことし|3]こそ、[行こう|いこう|4]と[思っ|おもっ|5]ています。","e":"This year for sure, I'm thinking, \"let's go.\""},{"j":"[となり||6]の[鈴木|すずき||#][さん||7]に、[相談|そうだん|8]しました。","e":"I consulted Mrs. Suzuki next door."}],[{"j":"[奈良|なら||#]は、[どう||9][やっ||9]て[行け|いけ|4]ばいいですか。","e":"Nara — if I go how, will it be good? (ば: asking what condition works)","s":"マリア"},{"j":"[新幹線|しんかんせん|10]で[京都|きょうと||#]まで[行っ|いっ|4]て、[それ||11]から[電車|でんしゃ|12]です。","e":"You go to Kyoto by shinkansen, and then it's a train.","s":"鈴木"},{"j":"[京都|きょうと||#]で[電車|でんしゃ|12]に[乗り換える|のりかえる|13]と、[四十五|よんじゅうご][分|ふん|14]ぐらいで[奈良|なら||#]に[着き|つき|15]ますよ。","e":"When you change trains at Kyoto, you arrive at Nara in about forty-five minutes. (と: it always works that way)","s":"鈴木"},{"j":"[新幹線|しんかんせん|10]は[高い|たかい|16]ですよね。","e":"The shinkansen is expensive, right?","s":"マリア"},{"j":"[早く|はやく|17][予約|よやく|18]すれば、[少し|すこし|19][安く|やすく|20]なりますよ。","e":"If you reserve early, it becomes a little cheaper. (ば: the condition is the point)","s":"鈴木"},{"j":"[それ||11]から、[平日|へいじつ|21]に[行け|いけ|4]ば、[人|ひと]も[少ない|すくない|22]です。","e":"And if you go on a weekday, the people too are few.","s":"鈴木"}],[{"j":"[奈良|なら||#]で、[何|なに]を[見れ|みれ|23]ばいいですか。","e":"In Nara, if I see what, will it be good?","s":"マリア"},{"j":"[奈良|なら||#]へ[行く|いく|4]なら、[東大寺|とうだいじ||#]を[見|み|23]たほうがいいですよ。[とても||24][古く|ふるく|25]て、[大きい|おおきい|26][お||27][寺|てら|27]です。","e":"If it's going to Nara you're planning, having seen Todaiji would be better. It's a very old, big temple. (なら: advice about your plan)","s":"鈴木"},{"j":"[それ||11]から、[公園|こうえん|28]へ[行く|いく|4]と、[鹿|しか|29|*]が[たくさん||30][い||31]ます。","e":"And when you go to the park, there {"id":"R37a","l":37,"f":[35,37],"t":"[父|ちち|0]と[鎌倉|かまくら||#]","te":"Kamakura with Dad","a":"A father visits, and things keep happening TO him — asked, praised, invited, rained on.","p":[[{"j":"[土曜日|どようび|1]、[父|ちち|0]と[鎌倉|かまくら||#]を[歩き|あるき|2]ました。","e":"On Saturday, Dad and I walked around Kamakura."},{"j":"[父|ちち|0]は、[きのう||3][買っ|かっ|4]た[新しい|あたらしい|5][コート||6]を[着|き|7]ていました。","e":"Dad was wearing the new coat we'd bought the day before."}],[{"j":"[まず||8]、[大仏|だいぶつ|9]を[見|み|10]に[行き|いき|11]ました。","e":"First, we went to see the Great Buddha."},{"j":"[鎌倉|かまくら||#]の[大仏|だいぶつ|9]は、770[年|ねん|12]ぐらい[前|まえ|13]に[作ら|つくら|14]れました。","e":"Kamakura's Great Buddha was made about 770 years ago."},{"j":"[今|いま|15]は、[世界中|せかいじゅう|16]の[人|ひと]に[知ら|しら|17]れています。","e":"Now it's known by people all over the world."},{"j":"[大きい|おおきい|18]ね！","e":"It's huge!","s":"父"},{"j":"[大仏|だいぶつ|9]の[前|まえ|13]で、[わたしたち||19]は[外国|がいこく|20]の[家族|かぞく|21]に[写真|しゃしん|22]を[頼ま|たのま|23]れました。","e":"In front of the Buddha, a family from abroad asked us to take their picture."},{"j":"[父|ちち|0]は、[ポルトガル語|ぽるとがるご|24]で[話しかけ|はなしかけ|25]られました。","e":"Dad was spoken to in Portuguese."},{"j":"[父|ちち|0]は、[とても||26][うれしい||27][顔|かお|28]をしていました。","e":"His face lit right up."},{"j":"ブラジルから[来|き|29]たんですか。[わたしたち||19]もブラジルからです！","e":"Did you come from Brazil? So did we!","s":"男の人"},{"j":"[父|ちち|0]と[男|おとこ|30]の[人|ひと|30]は、20[分|ぷん|31]ぐらい[サッカー||32]の[話|はなし|33]をしました。","e":"Dad and the man talked about soccer for about twenty minutes."}],[{"j":"[それ||34]から、[小町|こまち||#][通り|とおり]を[歩き|あるき|2]ました。","e":"After that, we walked down Komachi-dori."},{"j":"[父|ちち|0]は[背|せ|35]が[高い|たかい|35]ですから、[よく||36][見|み|10]られました。","e":"Dad is tall, so people kept looking at him."},{"j":"[小さい|ちいさい|37][女の子|おんなのこ|38]に「[大きい|おおきい|18][人|ひと]！」と[言わ|いわ|39]れて、[父|ちち|0]は「[ありがとう||40]！」と[言い|いい|39]ました。","e":"A little girl called him \"Big man!\" and Dad said \"Thank you!\""},{"j":"[店|みせ|41]の[人|ひと]に、[お||42][菓子|かし|42]を[一|ひと]つ[もらい||43]ました。","e":"A shopkeeper gave him a sweet."},{"j":"[日本|にほん||#]の[人|ひと]は、[親切|しんせつ|44]だね。","e":"Japanese {"id":"R37b","l":37,"f":[33,37],"t":"グエン[さん||0]の[日曜日|にちようび|1]","te":"Nguyen's Sunday","a":"Long review, L33–37, built around the passive: done to me by someone (先生に褒められた), done to me and I suffered (雨に降られた・足を踏まれた), and passive for things (〜で作られています・建てられました).","p":[[{"j":"[日曜日|にちようび|1]、グエン[さん||0]は[東京|とうきょう||#]の[浅草|あさくさ||#]へ[行き|いき|2]ました。","e":"On Sunday, Mr. Nguyen went to Asakusa in Tokyo."},{"j":"[次の日|つぎのひ|3]、[会社|かいしゃ|4]の[昼休み|ひるやすみ|5]に、グエン[さん||0]から[話|はなし|6]を[聞き|きき|7]ました。","e":"The next day, at the company lunch break, I heard the story from Mr. Nguyen."}],[{"j":"マリア[さん||0]、[きのう||8]は[本当|ほんとう|9]に[たいへん||10]でした。","e":"Ms. Maria, yesterday was really awful.","s":"グエン"},{"j":"[何|なに]があったんですか。","e":"What was it that happened?","s":"マリア"},{"j":"[朝|あさ|11]、[駅|えき|12]で[電車|でんしゃ|13]を[待っ|まっ|14]ていた[とき||15]、[雨|あめ|16]に[降ら|ふら|17]れたんです。","e":"It's that in the morning, when I was waiting for the train at the station, I got rained on. (suffering passive: the rain did it to me)","s":"グエン"},{"j":"[傘|かさ|18]を[持っ|もっ|19]ていなかったから、[困り|こまり|20]ました。","e":"Because I wasn't carrying an umbrella, I was troubled.","s":"グエン"},{"j":"[それ||21]から、[電車|でんしゃ|13]の[中|なか|22]で、[足|あし|23]を[踏ま|ふま|24]れました。","e":"And then, on the train, I had my foot stepped on. (suffering passive)","s":"グエン"},{"j":"[とても||25][込ん|こん|26]でいましたから。","e":"Because it was very crowded.","s":"グエン"},{"j":"[たいへん||10]でしたね。","e":"That was awful, huh.","s":"マリア"}],[{"j":"でも、[浅草|あさくさ||#]は[とても||25]よかったです。","e":"But Asakusa was very good.","s":"グエン"},{"j":"[浅草|あさくさ||#][寺|てら|27]は、[とても||25][古い|ふるい|28][お||29][寺|てら|29]です。[千四百|せんよんひゃく][年|ねん|30]ぐらい[前|まえ|31]に[建て|たて|32]られました。","e":"Sensoji is a very old temple. It was built about fourteen hundred years ago. (passive for things)","s":"グエン"},{"j":"[今|いま|33]の[お||29][寺|てら|29]は、[七十|ななじゅう][年|ねん|30]ぐらい[前|まえ|31]に、[もう||34][一度|いちど|35][建て|たて|32]られたんです。","e":"It's that the present temple was built once again about seventy years ago.","s":"グエン"},{"j":"[毎年|まいとし|36]、[世界中|せかいじゅう|37]から、[たくさん||38]の[人|ひと]に[見|み|39]られています。","e":"Ev {"id":"R41b","l":41,"f":[37,41],"t":"グエン[さん||0]の[お祝い|おいわい|1]","te":"Nguyen's celebration","a":"Long review, L37–41, built around giving and receiving with politeness: いただく (receive from someone above me), くださる (someone above gives me), やる (I give to someone below, or to animals), 〜ていただく / 〜てくださる / 〜てやる, 〜ていただけませんか.","p":[[{"j":"[三|さん][月|がつ|2]、グエン[さん||0]から[電話|でんわ|3]がありました。","e":"In March, there was a phone call from Mr. Nguyen."},{"j":"マリア[さん||0]！[大学院|だいがくいん|4]に[合格|ごうかく|5]しました！","e":"Ms. Maria! I passed for graduate school!","s":"グエン"},{"j":"[本当|ほんとう|6]？[おめでとう||7]！","e":"Really? Congratulations!","s":"マリア"},{"j":"[土曜日|どようび|8]に、[鈴木|すずき||#][さん||0]の[うち||9]で、[みんな||10]で[お祝い|おいわい|1]をしました。","e":"On Saturday, at Mrs. Suzuki's home, we all held a celebration."}],[{"j":"[鈴木|すずき||#][さん||0]が、[大きい|おおきい|11][ケーキ||12]を[作っ|つくっ|13]てくださいました。","e":"Mrs. Suzuki kindly made a big cake for us. (てくださる: someone above does it for us)"},{"j":"アヤ[さん||0]は、[花|はな|14]を[持っ|もっ|15]て[来|き|16]てくれました。","e":"Aya brought flowers for us. (てくれる: a friend does it for us)"},{"j":"[林|はやし||#][さん||0]は、ベトナムの[お||17][酒|さけ|17]を[買っ|かっ|18]て[来|き|16]てくれました。","e":"Ms. Hayashi bought Vietnamese liquor and brought it for us."},{"j":"[わたし||19]は、グエン[さん||0]に[新しい|あたらしい|20][かばん||21]を[あげ||22]ました。","e":"I gave Mr. Nguyen a new bag. (あげる: to an equal)"},{"j":"[ありがとう||23][ござい||23]ます！[大学院|だいがくいん|4]で[使い|つかい|24]ます。","e":"Thank you very much! I'll use it at graduate school.","s":"グエン"}],[{"j":"グエン[さん||0]、[試験|しけん|25]は[どう||26]でしたか。","e":"Mr. Nguyen, how was the exam?","s":"マリア"},{"j":"[難しかっ|むずかしかっ|27]たです。でも、[大学|だいがく|28]の[先生|せんせい|29]に[いろいろ||30][教え|おしえ|31]ていただきました。","e":"It was difficult. But I humbly received the favor of being taught many things by a university teacher. (ていただく: I receive from someone above)","s":"グエン"},{"j":"[先生|せんせい|29]は、[ぼく||32]の[作文|さくぶん|33]を[三|さん][回|かい|34][直し|なおし|35]てくださいました。","e":"The teacher kindly corrected my composition three times, for me. (てくださる)","s":"グエン"},{"j":"[それ||36]から、[コンビニ||37]の[会社|かいしゃ|38]の[部長|ぶちょう|39]が、 {"id":"R48a","l":48,"f":[46,48],"t":"[京都|きょうと||#]へ","te":"To Kyoto","a":"A day off negotiated politely, a delayed shinkansen, a lunch box, and autumn leaves.","p":[[{"j":"[来週|らいしゅう|0]、アヤ[さん||1]と[京都|きょうと||#]へ[旅行|りょこう|2]に[行き|いき|3]ます。","e":"Next week, Aya and I are taking a trip to Kyoto."},{"j":"でも、[旅行|りょこう|2]は[金曜日|きんようび|4]からです。","e":"But the trip starts on Friday."},{"j":"[わたし||5]は[課長|かちょう|6]に[話し|はなし|7]に[行き|いき|3]ました。","e":"I went to talk to the section chief."}],[{"j":"[課長|かちょう|6]、[すみ||8]ません。[ちょっと||9][お願い|おねがい|9]が[ある||9]んですが。","e":"Excuse me, chief. I have a small favor to ask.","s":"マリア"},{"j":"[はい||10]、[何|なん|11]ですか。","e":"Yes, what is it?","s":"課長"},{"j":"[金曜日|きんようび|4]に[休ま|やすま|12]せていただけませんか。[友達|ともだち|13]と[京都|きょうと||#]へ[行き|いき|3]たいんです。","e":"Could you let me take Friday off? I'd like to go to Kyoto with a friend.","s":"マリア"},{"j":"[京都|きょうと||#]ですか。いいですね。","e":"Kyoto? How nice.","s":"課長"},{"j":"でも、[月曜日|げつようび|14]に[頼ん|たのん|15]だ[仕事|しごと|16]は、[どう||17]なっていますか。","e":"But how's the work I asked you to do on Monday coming along?","s":"課長"},{"j":"[今|いま|18]、[やっ||19]ている[ところ||20]です。[木曜日|もくようび|21]までに[終わる|おわる|22]はずです。","e":"I'm in the middle of it now. It should be done by Thursday.","s":"マリア"},{"j":"[じゃ||23]、[木曜日|もくようび|21]までに[終わら|おわら|22]せてくださいね。","e":"Then please get it finished by Thursday.","s":"課長"},{"j":"[はい||10]！[ありがとう||24][ござい||24]ます。","e":"Yes! Thank you very much.","s":"マリア"}],[{"j":"[金曜日|きんようび|4]の[朝|あさ|25]、[新横浜駅|しんよこはまえき||#]に[着い|つい|26]た[とき||27]、[駅|えき|28]の[放送|ほうそう|29]が[聞こえ|きこえ|30]ました。","e":"Friday morning, when I arrived at Shin-Yokohama Station, I heard an announcement."},{"j":"[静岡|しずおか||#]で[事故|じこ|31]があったそうです。","e":"Apparently there had been an accident in Shizuoka."},{"j":"[新幹線|しんかんせん|32]は30[分|ぷん|33]ぐらい[遅れる|おくれる|34]ようです。","e":"It seems the shinkansen will be about 30 minutes late."},{"j":"[じゃ||23]、[お||35][弁当|べんとう|35]を[買おう|かおう|36]か。","e":"Well then, shall we buy lunch boxes?","s":"アヤ"},{"j":"いいね。","e":"Good idea.","s":"マリア"}],[{"j":"[新幹線|しんかんせん|32]の[中|なか|37]で、[わたしたち||38]は[買っ|かっ|36]たばかりの[お||35][弁当|べんとう|35]を[食べ|たべ|39]ました。","e":"On the shinkansen, we ate the lunch boxes we'd just bought."},{"j":"いい[におい||40]がしました。","e":"It smelled great."},{"j":"[前|まえ|41]の[席|せき|42]の[小さい|ちいさい|43][子ども|こども|44]が、[わたしたち||38]の[お||35][弁当|べんとう|35]を[見|み|45]ていました。","e":"A small child in the seat in front was watching our lunch boxes."},{"j":"[子ども|こども|44]が[立っ|たっ|46]て、[走り|はしり|47]ました。でも、[お母さん|おかあさん|48]は[すぐ||49][子ども|こども|44]を[席|せき|42]に[座ら|すわら|50]せました。","e":"The child stood up and ran. But the mother made the child sit down right away."},{"j":"[すみ||8]ません。[うるさく||51]て。","e":"I'm sorry. It's being noisy.","s":"お母さん"},{"j":"[いいえ||52]、[大丈夫|だいじょうぶ|53]ですよ。","e":"Not at all, it's fine.","s":"アヤ"}],[{"j":"10[時|じ|54]に[京都|きょうと||#]に[着く|つく|26]はずでしたが、10[時|じ|54]40[分|ぷん|33]に[着き|つき|26]ました。","e":"We were supposed to arrive in Kyoto at 10, but we arrived at 10:40."},{"j":"[京都|きょうと||#]は[秋|あき|55]で、[お||56][寺|てら|56]の[紅葉|もみじ|57]が[とても||58][きれい||59]でした。","e":"It was autumn in Kyoto, and the maple leaves at the temples were beautiful."},{"j":"[赤|あか|60]や[黄色|きいろ|61]の[木|き|62]の[下|した|63]で、[写真|しゃしん|64]を[たくさん||65][撮り|とり|66]ました。","e":"We took lots of photos under the red and yellow trees."}],[{"j":"[お||56][寺|てら|56]で[写真|しゃしん|64]を[撮っ|とっ|66]ている[とき||27]、[男|おとこ|67]の[人|ひと|67]が[来|き|68]ました。","e":"While we were taking photos at a temple, a man came up."},{"j":"[すみ||8]ません、[写真|しゃしん|64]を[撮っ|とっ|66]ていただけませんか。","e":"Excuse me, would you mind taking our picture?","s":"男の人"},{"j":"[はい||10]、いいですよ。","e":"Sure.","s":"マリア"},{"j":"[日本語|にほんご|69]が[上手|じょうず|70]ですね。[日本|にほん||#]に[住ん|すん|71]でいるんですか。","e":"Your Japanese is good. Do you live in Japan?","s":"男の人"},{"j":"[はい||10]、[もう||72]3[年|ねん|73]ぐらいになります。","e":"Yes, it's been about three years now.","s":"マリア"},{"j":"そうですか。[わたし||5]は[きのう||74]アメリカから[来|き|68]たばかりなんです。","e":"I see. I only just got here from America yesterday.","s":"男の人"},{"j":"[京都|きょうと||#]の[おいしい||75][店|みせ|76]を[知り|しり|77]ませんか。","e":"Do you know any good places to eat in Kyoto?","s":"男の人"},{"j":"アヤ[さん||1]は、[その||78][人|ひと]に[有名|ゆうめい|79]な[店|みせ|76]を[教え|おしえ|80]てあげました。","e":"Aya told him about a famous restaurant."}],[{"j":"[夜|よる|81]、[ホテル||82]でアヤ[さん||1]が[言い|いい|83]ました。","e":"That night at the hotel, Aya said something."},{"j":"[あした||84]は[朝|あさ|25]6[時|じ|54]に[起き|おき|85]て、[有名|ゆうめい|79]な[お||56][寺|てら|56]へ[行こう|いこう|3]。","e":"Tomorrow let's get up at 6 and go to a famous temple.","s":"アヤ"},{"j":"9[時|じ|54]を[過ぎる|すぎる|86]と、[人|ひと]が[とても||58][多く|おおく|87]なるそうだよ。","e":"Apparently after 9 it gets really crowded.","s":"アヤ"},{"j":"6[時|じ|54]……。","e":"Six…","s":"マリア"},{"j":"[休み|やすみ|88]の[日|ひ|89]なのに、[会社|かいしゃ|90]の[日|ひ|89]より[早く|はやく|91][起き|おき|85]なければなりません。","e":"Even though it's a day off, I have to get up earlier than on a workday."}]],"g":[["来週","らいしゅう","next week",5],["さん","さん","Mr., Ms. (suffix added to a name for expressing politeness)",1],["旅行","りょこう","trip, tour (～を します : travel, make a trip)",7],["行く","いく","go",5],["金曜日","きんようび","Friday",4],["わたし","わたし","I",1],["課長","かちょう","section head",18],["話す","はなす","speak, talk",14],["すみません","すむ","Excuse me.",3],["ちょっとお願いがあるんですが","","I have a [small] favor to ask.",28],["はい","はい","yes",1],["何","なん","what",2],["休む","やすむ","take a rest, take a holiday",4],["友達","ともだち","friend",5],["月曜日","げつようび","Monday",4],["頼む","たのむ","ask, request",37],["仕事","しごと","work, business (～を します : do one's job, work)",8],["どう","どう","how",2],["今","いま","now",4],["やる","やる","do",26],["ところ","ところ","place",8],["木曜日","もくようび","Thursday",4],["終わる","おわる","finish",4],["じゃ","じゃ","well, then, in that case",3],["ありがとうございます","","ありがとうございます",2],["朝","あさ","morning",4],["着く","つく","arrive",25],["とき","とき","－ o'clock",4],["駅","えき","station",5],["放送","ほうそう","[commodity] prices",21],["聞こえる","きこえる","[a sound] can be heard",27],["事故","じこ","accident",39],["新幹線","しんかんせん","the Shinkansen, the bullet train",5],["分","ぷん","－ minute",4],["遅れる","おくれる","be late [for an appointment, etc.]",26],["お弁当","","box lunch",22],["買う","かう","buy",6],["中","なか","in, inside",10],["わたしたち","わたしたち","we",1],["食べる","たべる","eat",6],["におい","におい","smell",47],["前","まえ"," {"id":"R48b","l":48,"f":[44,48],"t":"[健太|けんた||#][君|くん|0]の[八|はち][月|がつ|1]","te":"Kenta's August","a":"Long review, L44–48, built around the causative: make someone do it (勉強させる), let someone do it (好きなことをさせる・泳がせる), make someone feel (笑わせる・心配させる), and asking permission politely with 〜させていただけませんか (could I humbly receive your letting me ~?) — with hearsay そう, ところ and すぎる mixed in.","p":[[{"j":"[八|はち][月|がつ|1]、[鈴木|すずき||#][さん||2]の[孫|まご|3]の[健太|けんた||#][君|くん|0]が、[東京|とうきょう||#]から[遊び|あそび|4]に[来|き|5]ました。","e":"In August, Mrs. Suzuki's grandson Kenta came from Tokyo to visit."},{"j":"[健太|けんた||#][君|くん|0]は、[小学校|しょうがっこう|6]の[六|ろく][年生|ねんせい]です。","e":"Kenta is a sixth-grader at elementary school."},{"j":"[健太|けんた||#][君|くん|0]の[お母さん|おかあさん|7]は、[毎日|まいにち|8][健太|けんた||#][君|くん|0]に[勉強|べんきょう|9]させます。","e":"Kenta's mother makes Kenta study every day. (causative: make)"},{"j":"[毎朝|まいあさ|10]、[漢字|かんじ|11]を[二十|にじゅう][書か|かか|12]せます。","e":"Every morning, she makes him write twenty kanji."},{"j":"[それ||13]から、[ピアノ||14]を[一|いち][時間|じかん|15][練習|れんしゅう|16]させます。","e":"After that, she makes him practice piano for one hour."},{"j":"でも、[鈴木|すずき||#][さん||2]は[違い|ちがい|17]ます。","e":"But Mrs. Suzuki is different."},{"j":"[鈴木|すずき||#][さん||2]は、[健太|けんた||#][君|くん|0]に[好き|すき|18]なことをさせます。","e":"Mrs. Suzuki lets Kenta do things he likes. (causative: let)"}],[{"j":"[ある||19][日|ひ|20]、[健太|けんた||#][君|くん|0]が「[海|うみ|21]で[泳ぎ|およぎ|22]たい」と[言い|いい|23]ました。","e":"One day, Kenta said \"I want to swim in the sea.\""},{"j":"[わたし||24]は、[もう||25][泳げ|およげ|26]ないし……。","e":"Me, I can't swim anymore, and…","s":"鈴木"},{"j":"マリア[さん||2]、[健太|けんた||#]と[いっしょ||27]に[海|うみ|21]へ[行っ|いっ|28]てくれませんか。","e":"Ms. Maria, would you go to the sea together with Kenta for me?","s":"鈴木"},{"j":"いいですよ。でも、[金曜日|きんようび|29]は[仕事|しごと|30]があるので、[部長|ぶちょう|31]に[聞い|きい|32]てみます。","e":"Sure. But because I have work on Friday, I'll try asking the department head.","s":"マリア"}],[{"j":"[次の日|つぎのひ|33]、[会社|かいしゃ|34]で[部長|ぶちょう|31]に[話し|はなし|35]ました。","e":"The next day, I spoke to the department head at the company."},{"j":"[部長|ぶちょう|31]、[今度|こんど|36]の[金曜日|きんようび|29]、[休ま|やすま|37]せていただけませんか。","e":"Department head, this coming Friday — could I humbly receive your letting me take off? (させていただけませんか)","s":"マリア"},{"j":"[どう||38]したの？","e":"What's the matter?","s":"部長"},{"j":"[となり||39]の[鈴木|すずき||#][さん||2]の[お||40][孫|まご|40][さん||40]を、[海|うみ|21]で[泳が|およが|22]せてあげたいんです。","e":"It's that I want to let the grandson of Mrs. Suzuki next door swim in the sea, for him. (causative + てあげる)","s":"マリア"},{"j":"いいよ。でも、[木曜日|もくようび|41]までに、[この||42][仕事|しごと|30]を[終わら|おわら|43]せてね。","e":"Sure. But by Thursday, make this work finish, okay? (終わる → 終わらせる: get it done)","s":"部長"},{"j":"[はい||44]、[必ず|かならず|45][終わら|おわら|43]せます。","e":"Yes, I'll get it done without fail.","s":"マリア"}],[{"j":"[金曜日|きんようび|29]、[健太|けんた||#][君|くん|0]と[海|うみ|21]へ[行き|いき|28]ました。","e":"On Friday, I went to the sea with Kenta."},{"j":"[健太|けんた||#][君|くん|0]は、[とても||46][上手|じょうず|47]に[泳ぎ|およぎ|22]ました。[わたし||24]より[速かっ|はやかっ|48]たです。","e":"Kenta swam very skillfully. He was faster than me."},{"j":"マリア[さん||2]、[遅|おそ|49][すぎる||50]よ！","e":"Maria, you're too slow! (すぎる)","s":"健太"},{"j":"[健太|けんた||#][君|くん|0]は、[おもしろい||51][話|はなし|52]を[たくさん||53]して、[わたし||24]を[笑わ|わらわ|54]せました。","e":"Kenta told lots of funny stories and made me laugh. (causative of a feeling: を)"},{"j":"[お母さん|おかあさん|7]は、[いつも||55][ぼく||56]に[勉強|べんきょう|9]させるんだ。","e":"It's that Mom always makes me study.","s":"健太"},{"j":"でも、[きょう||57]はマリア[さん||2]が[泳が|およが|22]せてくれて、[うれしかっ||58]た。","e":"But today, you let me swim for me, and I was happy. (causative + てくれる)","s":"健太"}],[{"j":"[帰り|かえり|59]の[電車|でんしゃ|60]が[一|いち][時間|じかん|15]も[遅れ|おくれ|61]て、[鈴木|すずき||#][さん||2]を[心配|しんぱい|62]させてしまいました。","e":"The train home was late by a whole hour, and I ended up making Mrs. Suzuki worry. (causative of a feeling + てしまう)"},{"j":"[鈴木|すずき||#][さん||2]は、[駅|えき|63]で[待っ|まっ|64]ている[ところ||65]でした。","e":"Mrs. Suzuki was in the middle of waiting at the station. (ているところ)"},{"j":"よかった！[電話|でんわ|66]もないから、[心配|しんぱい|62]しましたよ。","e":"Thank goodness! Because there wasn't even a phone call, I worried.","s":"鈴木"},{"j":"[すみ||67]ません。[携帯|けいたい|68]の[電池|でんち|69]が[なくなっ||70]てしまって……。","e":"I'm sorry. My phone's battery ended up running out, and…","s":"マリア"}],[{"j":"[その||71][夜|よる|72]、[健太|けんた||#][君|くん|0]の[お母さん|おかあさん|7]から[電話|でんわ|66]がありました。","e":"That night, there was a phone call from Kenta's mother."},{"j":"[健太|けんた||#]と[遊ん|あそん|4]でくださって、[ありがとう||73][ござい||73]ました。","e":"Thank you very much for kindly playing with Kenta. (てくださる)","s":"健太君のお母さん"},{"j":"[健太|けんた||#]は、[海|うみ|21]の[話|はなし|52]ばかりしているんですよ。","e":"It's that Kenta is talking about nothing but the sea.","s":"健太君のお母さん"},{"j":"[鈴木|すずき||#][さん||2]の[話|はなし|52]では、[次の日|つぎのひ|33]から、[健太|けんた||#][君|くん|0]の[お母さん|おかあさん|7]は、[健太|けんた||#][君|くん|0]に[一|いち][時間|じかん|15]だけ[勉強|べんきょう|9]させて、[あと||74]は[遊ば|あそば|4]せたそうです。","e":"According to Mrs. Suzuki, I hear that from the next day, Kenta's mother made Kenta study for just one hour, and let him play the rest. (hearsay そう + make + let)"}]],"g":[["君","くん","(suffix often added to a boy's name)",1],["月","がつ","-th month of the year",5],["さん","さん","Mr., Ms. (suffix added to a name for expressing politeness)",1],["孫","まご","(my) grandchild",41],["遊ぶ","あそぶ","enjoy oneself, play",13],["来る","くる","come",5],["小学校","しょうがっこう","elementary school",38],["お母さん","おかあさん","(someone else's) mother (also used to address one's own mother)",7],["毎日","まいにち","every day",4],["勉強","べんきょう","study",4],["毎朝","まいあさ","every morning",4],["漢字","かんじ","Chinese characters",9],["書く","かく","write (かきます can also mean to draw or paint, but in this case it is written with hiragana in this book)",6],["それ","それ","that (thing near the listener)",2],["ピアノ","ぴあの","piano",18],["時間","じかん","time",9],["練習","れんしゅう","practice (～［を］します : practise)",19],["違う","ちがう","No, it isn't./You are wrong.",2],["好き","すき","like",9],["ある","ある","one ～, a certain ～",30],["日","ひ","day, date",19],["海","うみ","sea, ocean",12],["泳ぐ","およぐ","swim",13],["言う","ゆう","entitled ～, named ～, called ～",21],["わたし","わたし","I",1],["もう","もう","already",7],["泳げる","およげる","swim",13],["いっしょ","いっしょ","together",6],["行く","いく" {"id":"R49a","l":49,"f":[47,49],"t":"[社長|しゃちょう|0]が[いらっしゃる||1]","te":"The president is coming","a":"A visit from head office — honorific verbs for everything the president does, and a surprise in Portuguese.","p":[[{"j":"[来週|らいしゅう|2]、[東京|とうきょう||#]の[本社|ほんしゃ|3]から[社長|しゃちょう|0]が[いらっしゃい||1]ます。","e":"Next week, the company president is coming from the Tokyo head office."},{"j":"[社長|しゃちょう|0]は10[時|じ|4]に[横浜駅|よこはまえき||#]にお[着き|つき|5]になります。","e":"The president arrives at Yokohama Station at 10.","s":"課長"},{"j":"マリア[さん||6]、[駅|えき|7]まで[迎え|むかえ|8]に[行っ|いっ|9]てくれますか。","e":"Maria, would you go meet him at the station?","s":"課長"},{"j":"え、[わたし||10]がですか。","e":"What, me?","s":"マリア"},{"j":"[社長|しゃちょう|0]は、マリア[さん||6]に[会い|あい|11]たいと[おっしゃっ||12]ていたんですよ。","e":"The president said he wanted to meet you.","s":"課長"}],[{"j":"[わたし||10]は、[とても||13][心配|しんぱい|14]になりました。","e":"I got really nervous."},{"j":"[林|はやし||#][さん||6]が、[社長|しゃちょう|0]と[話す|はなす|15][とき||16]の[言葉|ことば|17]を[教え|おしえ|18]てくれました。","e":"Ms. Hayashi taught me the words to use when talking with the president."},{"j":"「[食べ|たべ|19]ますか」は「[召し上がり|めしあがり|20]ますか」ですよ。","e":"\"Will you eat?\" becomes 召し上がりますか.","s":"林"},{"j":"「[行き|いき|9]ますか」は「[いらっしゃい||1]ますか」。","e":"\"Will you go?\" is いらっしゃいますか.","s":"林"},{"j":"「[言い|いい|21]ました」は「[おっしゃい||12]ました」。","e":"\"Said\" is おっしゃいました.","s":"林"},{"j":"[それ||22]から、「お〜になります」も、[たくさん||23][使い|つかい|24]ますね。","e":"And you use お〜になります a lot too.","s":"林"},{"j":"お[読み|よみ|25]になります、お[書き|かき|26]になります……。","e":"お読みになります, お書きになります…","s":"マリア"},{"j":"[上手|じょうず|27]、[上手|じょうず|27]！","e":"Good, good!","s":"林"}],[{"j":"[その||28][日|ひ|29]、[わたし||10]は9[時半|じはん|30]に[駅|えき|7]に[着き|つき|5]ました。","e":"That day, I arrived at the station at 9:30."},{"j":"10[時|じ|4]に、[社長|しゃちょう|0]が[いらっしゃい||1]ました。","e":"At 10, the president arrived."},{"j":"[おはようございます||31]。マリアです。","e":"Good morning. I'm Maria.","s":"マリア"},{"j":"おはよう。[迎え|むかえ|8]に[来|き|32]てくれて、[ありがとう||33]。","e":"Morning. Thanks for coming to meet me.","s":"社長"},{"j":"[社長|しゃちょう|0]、お[荷物|にもつ|34]、[持ち|もち|35]ましょうか。","e":"Sir, shall I carry your bag?","s":"マリア"},{"j":"[いいえ||36]、[大丈夫|だいじょうぶ|37]ですよ。","e":"No, I'm fine.","s":"社長"}],[{"j":"[会社|かいしゃ|38]に[着く|つく|5]と、[社長|しゃちょう|0]は[会議室|かいぎしつ|39]にお[入り|はいり|40]になりました。","e":"When we reached the office, the president went into the meeting room."},{"j":"[どうぞ||41]、お[座り|すわり|42][ください||43]。","e":"Please, have a seat.","s":"マリア"},{"j":"[コーヒー||44]と[日本茶|にほんちゃ|45]と、[どちら||46]を[召し上がり|めしあがり|20]ますか。","e":"Would you prefer coffee or Japanese tea?","s":"マリア"},{"j":"[じゃ||47]、[コーヒー||44]をお[願い|ねがい]します。ブラジルの[コーヒー||44]がいいな。","e":"Then coffee, please. Brazilian coffee would be nice.","s":"社長"},{"j":"えっ、[社長|しゃちょう|0]はブラジルの[コーヒー||44]を[ご存じ|ごぞんじ|48]なんですか。","e":"Oh — you know Brazilian coffee, sir?","s":"マリア"},{"j":"[わたし||10]は[若い|わかい|49][とき||16]、サンパウロに[住ん|すん|50]でいたんですよ。","e":"I lived in São Paulo when I was young.","s":"社長"},{"j":"[社長|しゃちょう|0]は[ポルトガル語|ぽるとがるご|51]で「[はじめ||52]まして」と[言い|いい|21]ました。","e":"The president said \"pleased to meet you\" in Portuguese."},{"j":"[わたし||10]は、[本当|ほんとう|53]に[びっくり||54]しました。","e":"I was truly astonished."}],[{"j":"[会議|かいぎ|55]の[あと||56]で、[社長|しゃちょう|0]は[わたし||10]の[説明|せつめい|57]を[熱心|ねっしん|58]に[聞い|きい|59]てくださいました。","e":"After the meeting, the president listened carefully to my presentation."},{"j":"マリア[さん||6]、[日本語|にほんご|60]も、[仕事|しごと|61]も、[すばらしい||62]ですね。","e":"Maria, your Japanese and your work are both excellent.","s":"社長"},{"j":"[夕方|ゆうがた|63]、[社長|しゃちょう|0]は[東京|とうきょう||#]へお[帰り|かえり|64]になりました。","e":"In the evening, the president went back to Tokyo."},{"j":"[社長|しゃちょう|0]は、[来年|らいねん|65][もう||66][一度|いちど|67][いらっしゃる||1]そうですよ。","e":"The president says he'll come again next year.","s":"課長"},{"j":"[次|つぎ|68]は、[ポルトガル語|ぽるとがるご|51]で[話し|はなし|15]たいと[思い|おもい|69]ます。","e":"Next time, I'd like to talk with him in Portuguese."}]],"g":[["社長","しゃちょう","company president",18],["いらっしゃる","いらっしゃる","How nice of you to come. (lit. Welcome.)",3],["来週","らいしゅう","next week",5],["本社","ほんしゃ","head office",31],["時","じ","－ o'clock",4],["着く","つく","arrive",25],["さん","さん","Mr., Ms. (suffix added to a name for expressing politeness {"id":"R49b","l":49,"f":[45,49],"t":"ブラジルからの[お客様|おきゃくさま|0]","te":"A guest from Brazil","a":"Long review, L45–49, built around honorific language (尊敬語) — raising the other person: いらっしゃる (come/go/be), おっしゃる (say), 召し上がる (eat/drink), ご覧になる (look), なさる (do), お〜になる, 〜れる／〜られる (行かれる), お〜ください — with hearsay そう and the causative mixed in.","p":[[{"j":"[来週|らいしゅう|1]、ブラジルの[会社|かいしゃ|2]の[社長|しゃちょう|3]が、[わたし||4]の[会社|かいしゃ|2]に[いらっしゃい||5]ます。","e":"Next week, the president of a Brazilian company will come (honorific) to my company. (いらっしゃる = 来る, honorific)"},{"j":"マリア[さん||6]、[社長|しゃちょう|3]の[ポルトガル語|ぽるとがるご|7]を、[日本語|にほんご|8]にしてくれないか。","e":"Ms. Maria, won't you turn the president's Portuguese into Japanese for me?","s":"部長"},{"j":"[はい||9]、[わかり||10]ました。","e":"Yes, understood.","s":"マリア"},{"j":"[部長|ぶちょう|11]は、[その||12][日|ひ|13]から、[毎日|まいにち|14][敬語|けいご|15|*]の[練習|れんしゅう|16]をしていました。","e":"From that day, the department head was practicing honorific language every day."}],[{"j":"[月曜日|げつようび|17]の[朝|あさ|18]、[社長|しゃちょう|3]が[いらっしゃい||5]ました。","e":"Monday morning, the president came (honorific)."},{"j":"[よく||19][いらっしゃい||5]ました。[どうぞ||20]、[こちら||21]へ。","e":"You have come (honorific) well — welcome. This way, please.","s":"部長"},{"j":"[どうぞ||20]、お[掛け|かけ|22][ください||23]。","e":"Please, sit down (honorific: お〜ください).","s":"部長"},{"j":"[社長|しゃちょう|3]は、[前|まえ|24]に[日本|にほん||#]へ[いらっしゃっ||5]たことがありますか。","e":"President, have you come (honorific) to Japan before?","s":"部長"},{"j":"[二十|にじゅう][年|ねん|25][前|まえ|24]に、[一度|いちど|26][東京|とうきょう||#]へ[いらっしゃっ||5]たことがあると[おっしゃっ||27]ています。","e":"He is saying (honorific) that he came (honorific) to Tokyo once twenty years ago. (おっしゃる = 言う, honorific)","s":"マリア"}],[{"j":"[こちら||21]は、[わたしたち||28]の[新しい|あたらしい|29][工場|こうじょう|30]の[写真|しゃしん|31]です。[どうぞ||20]、[ご覧|ごらん|32|*][ください||23]。","e":"This is a photo of our new factory. Please, have a look (honorific). (ご覧ください)","s":"部長"},{"j":"[社長|しゃちょう|3]は、[写真|しゃしん|31]を[ご覧|ごらん|32|*]になって、「[すばらしい||33]」と[おっしゃい||27]ました。","e":"The president looked (honorific) at the photo and said (honorific), \"Wonderful.\" (ご覧になる = 見る, honorific)"},{"j":"[社長|しゃちょう|3]は、[いつ||34]まで[日本|にほん||#]に[いらっしゃい||5]ますか。","e":"President, until when will you be (honorific) in Japan? (いらっしゃる = いる, honorific)","s":"部長"},{"j":"[あした||35]の[朝|あさ|18]、[京都|きょうと||#]へ[行か|いか|36]れるそうです。","e":"I hear he will go (honorific) to Kyoto tomorrow morning. (〜れる: a lighter honorific — looks like the passive)","s":"マリア"},{"j":"[何時|なんじ|37]の[新幹線|しんかんせん|38]にお[乗り|のり|39]になりますか。","e":"Which o'clock's bullet train will you ride (honorific)? (お〜になる)","s":"部長"},{"j":"[九|きゅう][時|じ|40]の[新幹線|しんかんせん|38]にお[乗り|のり|39]になるそうです。","e":"I hear he will ride (honorific) the nine o'clock bullet train.","s":"マリア"}],[{"j":"[夜|よる|41]は、[駅|えき|42]の[近く|ちかく|43]の[店|みせ|44]で、[晩ご飯|ばんごはん|45]を[食べ|たべ|46]ました。","e":"At night, we ate dinner at a shop near the station."},{"j":"[社長|しゃちょう|3]、[何|なに]を[召し上がり|めしあがり|47]ますか。","e":"President, what will you eat (honorific)? (召し上がる = 食べる, honorific)","s":"部長"},{"j":"[社長|しゃちょう|3]は、[魚|さかな|48]がお[好き|すき|49]だそうです。","e":"I hear the president likes (honorific) fish. (hearsay そう + お好き)","s":"マリア"},{"j":"[社長|しゃちょう|3]は、[はし||50]を[上手|じょうず|51]にお[使い|つかい|52]になりました。","e":"The president used (honorific) chopsticks skillfully. (お〜になる)"},{"j":"[お||53][酒|さけ|53]も、[召し上がり|めしあがり|47]ますか。","e":"Will you drink (honorific) sake too? (召し上がる = 飲む, honorific)","s":"部長"},{"j":"[少し|すこし|54]だけ[召し上がる|めしあがる|47]そうです。","e":"I hear he'll drink (honorific) just a little.","s":"マリア"},{"j":"[社長|しゃちょう|3]は、[何|なに]か[スポーツ||55]を[なさい||56]ますか。","e":"President, do you do (honorific) any sports? (なさる = する, honorific)","s":"部長"},{"j":"[毎朝|まいあさ|57]、[テニス||58]を[なさる||56]そうです。[もう||59][四十|よんじゅう][年|ねん|25][続け|つづけ|60]て[いらっしゃる||5]そうです。","e":"I hear he plays (honorific) tennis every morning. I hear he has already been continuing it (honorific) for forty years. (〜ていらっしゃる = 〜ている, honorific)","s":"マリア"},{"j":"[すごい||61]ですね！[わたし||4]は、[運動|うんどう|62]は[全然|ぜんぜん|63]……。","e":"Amazing! Me, exercise, not at all…","s":"部長"},{"j":"[社長|しゃちょう|3]は、[それ||64]を[聞い|きい|65]て、[大きい|おおきい|66][声|こえ|67]でお[笑い|わらい /* =====================================================================
   読解の糸 — leveled reading.
   Storage key is "dokkai_v1". It never reads or writes bunkei_v2 or
   shiken_v1, so nothing here can touch anyone's SRS or ★ lists elsewhere.
   ★ / 🔖 / 続き are keyed to story id + the sentence TEXT (index is only a
   hint), so stories can be edited later without orphaning anything.
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RB = (b,r) => `<ruby>${b}<rt>${r}</rt></ruby>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= storage ================= */
let canStore = true;
function load(){ try{ const r = localStorage.getItem("dokkai_v1"); return r ? JSON.parse(r) : {}; }
                 catch(e){ canStore = false; return {}; } }

const S = Object.assign({ cfg:{}, star:{}, pos:{}, bm:{}, done:{} }, load());
S.cfg = Object.assign({ jvURI:"", evURI:"", lv:25, furi:"tap", en:false, rate:0.9, mode:"cont", fs:21, kana:false }, S.cfg||{});

/* ================= data prep ================= */
const BY = {};
STORIES.forEach(s => { BY[s.id] = s; });
const KATA = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const isKanji = c => /[一-鿿々〆ヶ]/.test(c);

function parseJ(j){
  const out = [], re = /\[([^|\]]+)(?:\|([^|\]]*))?(?:\|([^|\]]*))?(?:\|([^|\]]*))?\]/g;
  let i = 0, m;
  while((m = re.exec(j))){
    if(m.index > i) out.push({ t:j.slice(i, m.index), w:false });
    out.push({ t:m[1], r:m[2]||"", g:(m[3]!==undefined && m[3]!=="") ? +m[3] : -1, f:m[4]||"", w:true });
    i = re.lastIndex;
  }
  if(i < j.length) out.push({ t:j.slice(i), w:false });
  return out;
}
/* put the reading only over the kanji: 召し上がっ/めしあがっ → 召[め]し上[あ]がっ */
function rubyHTML(t, r){
  if(!r || !/[一-鿿々〆ヶ]/.test(t)) return esc(t);
  const runs = t.match(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g);
  const pat = "^" + runs.map(x => isKanji(x[0]) ? "(.+?)" : KATA(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("") + "$";
  const m = new RegExp(pat).exec(KATA(r));
  if(!m) return RB(esc(t), esc(r));
  let k = 1;
  return runs.map(x => isKanji(x[0]) ? RB(esc(x), esc(m[k++])) : esc(x)).join("");
}
function plainText(segs){ return segs.map(s => s.t).join(""); }
function kanaText(segs){ return segs.map(s => s.w && s.r ? s.r : KATA(s.t)).join(""); }
/* what the synthesiser gets: kanji for natural prosody, except tokens flagged ! */
function ttsText(segs){
  if(S.cfg.kana) return kanaText(segs);
  return segs.map(s => (s.w && s.f.includes("!") && s.r) ? s.r : s.t).join("");
}

/* ================= TTS ================= */
/* Reader additions to this engine: speak() takes opt {pitch, voice, estLen}.
   estLen = KANA length, so the length watchdog doesn't cut off a kanji-dense
   sentence. Sentences are spoken with kanji (natural prosody) except tokens
   flagged ! in the data, or everything in かなで mode.
   Lifted wholesale from 文型の糸 — every line here is load-bearing on
   iOS/Chrome. Isolated Japanese is always fed as KANA, never kanji, so the
   engine can't misread 行って as おこなって. */
let JV=null,EV=null,currentU=null,unlocked=false,speakToken=0,noJa=false,voicesSettled=false;
const SPOKEN=[];   /* rolling log of what was actually voiced — debug + tests */
/* ---- EDITABLE: TTS pronunciation overrides -------------------------------
   Apple's Kyoko applies sequential voicing (rendaku) across seams it thinks
   it sees inside a kana string, so an isolated word can come out as ...づき
   where ...つき was meant. Google's Japanese voice does not do this.
   Left side = the kana we store. Right side = what to FEED the synthesiser.
   A space or 、 at the seam is usually enough to stop the voicing; katakana
   sometimes helps too. Add entries freely — nothing else depends on this. */
const SAY_FIX = {
  "まいつき":   "まい つき",
  "ひとつき":   "ひと つき",
  "みつき":     "み つき",
  "だいすき":   "だい すき",
  "ものすごい": "もの すごい"
};
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
function pickVoices(){
  const vs = allVoices(), isJa = v => v.lang.replace("_","-").startsWith("ja");
  JV = (S.cfg.jvURI && vs.find(v=>v.voiceURI===S.cfg.jvURI))
     || vs.find(v=>/Google/i.test(v.name)&&isJa(v))
     || vs.find(v=>/Kyoko/i.test(v.name)&&isJa(v))
     || vs.find(isJa) || null;
  EV = (S.cfg.evURI && vs.find(v=>v.voiceURI===S.cfg.evURI))
     || vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>v.lang.startsWith("en")) || null;
  noJa = vs.length>0 && !JV;
}
async function ensureVoices(){
  for(let i=0;i<20;i++){ if(allVoices().length) break; await new Promise(r=>setTimeout(r,120)); }
  pickVoices(); voicesSettled = true;
}
if (typeof speechSynthesis !== "undefined"){
  speechSynthesis.onvoiceschanged = () => pickVoices();
  pickVoices(); ensureVoices();
}
function unlock(){ if(unlocked) return; unlocked = true;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("あ"); u.volume=0; u.rate=1;
       speechSynthesis.speak(u); }catch(e){} }
document.addEventListener("touchstart", unlock, {once:true});
document.addEventListener("click", unlock, {once:true});
function speak(text, jp=true, rate=0.92, _retry=false, opt={}){
  if(!_retry){ SPOKEN.push(text); if(SPOKEN.length>40) SPOKEN.shift(); }
  if(jp && SAY_FIX[text]) text = SAY_FIX[text];
  const myToken = ++speakToken;
  return new Promise(async res=>{
    try{
      if(!voicesSettled) await ensureVoices();
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      if(busy) speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken !== speakToken) return res();
        pickVoices();
        const u = new SpeechSynthesisUtterance(text);
        currentU = u;
        u.lang = jp ? "ja-JP" : "en-US";
        let v = (jp && opt.voice) || (jp ? JV : EV), r = jp ? rate : 1.0;
        if(_retry){ r = 1.0;
          if(jp){ const alt = allVoices().find(x=>x.lang.replace("_","-").startsWith("ja") && v && x.localService !== v.localService);
                  if(alt) v = alt; } }
        if(v) u.voice = v;
        u.rate = Math.max(0.7, r); u.pitch = opt.pitch || 1;
        let done=false, started=false;
        const finish = ()=>{ if(done) return; done=true; clearInterval(kick); res(); };
        u.onstart = ()=>{ started = true; };
        u.onend = finish; u.onerror = finish;
        const est = 600 + (opt.estLen || text.length)*(jp?185:75)/u.rate;
        setTimeout(finish, est+1500);
        setTimeout(()=>{ if(!started && !done && !_retry){ done=true; clearInterval(kick);
            try{ speechSynthesis.cancel(); }catch(e){}
            setTimeout(()=>speak(text,jp,1.0,true,opt).then(res),160); } }, 1400);
        const kick = setInterval(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 2500);
        speechSynthesis.speak(u);
        setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 120);
      }, busy?230:40);
    }catch(e){ res(); }
  });
}

function storyLen(s){ return s.p.reduce((a,p) => a + p.length, 0); }
function storyChars(s){ return s.p.reduce((a,p) => a + p.reduce((b,r) => b + plainText(parseJ(r.j)).length, 0), 0); }
function lineAt(s, i){ let k = 0; for(const p of s.p) for(const r of p){ if(k === i) return r; k++; } return null; }
/* find a saved sentence again even if the story was edited: text first, index as hint */
function locate(s, i, txt){
  const L = storyLen(s);
  if(txt){
    const at = lineAt(s, i);
    if(at && plainText(parseJ(at.j)).startsWith(txt)) return i;
    let k = 0; for(const p of s.p) for(const r of p){ if(plainText(parseJ(r.j)).startsWith(txt)) return k; k++; }
  }
  return Math.max(0, Math.min(i||0, L-1));
}

function renderLib(){
  const lv = S.cfg.lv, lo = Math.max(1, lv-3);
  const fit = [], easy = [], later = [];
  STORIES.forEach(s => {
    if(s.l > lv) later.push(s);
    else if(lv > 50 ? s.l === lv : s.f[1] >= lo) fit.push(s);
    else easy.push(s);
  });
  easy.sort((a,b) => b.l - a.l);
  const card = (s, cls) => {

      <div class="lvband">${lv > 50 ? `初級 + JLPT N${lv===51?3:2} vocabulary<br>中級${lv===51?"I":"II"} grammar` : `ちょうどいい：L${lo}–${lv}<br>${lv<=25?RB("初級","しょきゅう")+"I":RB("初級","しょきゅう")+"II"}`}</div>

  ${later.length ? `<div class="sec">まだ ・ LATER</div>` + later.map(s => card(s,"lock")).join("") : ""}`;

  r.oninput = () => { const v = +r.value; $(".lvnum").innerHTML = v > 50 ? `<span style="font-size:28px">中級${v===51?"I":"II"}</span>` : v + `<small>${RB("課","か")}</small>`; };

}
/* levels 51/52 are the 中級 tiers: all of 初級 + JLPT N3 (中級I) or N2 (中級II) vocabulary */
const CHU = { 51:"中級I", 52:"中級II" };
const lvName = l => CHU[l] || ("L" + l);
const bandName = s => s.l > 50 ? CHU[s.l] : ("L" + (s.f[0]===s.f[1] ? s.f[0] : s.f[0] + "–" + s.f[1]));
/* glossary lesson field: 1–50 Minna lesson; 50/51/52 in a 中級 story = JLPT N4–5 / N3 / N2 */
/* In 中級 stories, words outside Minna carry 50/51/52 = JLPT N4–5 / N3 / N2.
   (A Minna word tagged exactly L50 shows as N4–5 there too — close enough.) */
const glossTag = (gl, storyL) => (storyL > 50 && gl >= 50) ? ({50:"N4–5", 51:"N3", 52:"N2"}[gl] || "L" + gl) : "L" + gl;
function titleHTML(s, chrome){
  return parseJ(s.t).map(x => x.w && x.r ? (chrome || S.cfg.furi==="all" ? rubyHTML(x.t, x.r) : esc(x.t)) : esc(x.t)).join("");
}

let playing = false, playTok = 0;

function openStory(id, at){
  const s = BY[id]; if(!s) return;
  CUR = s; SENT = []; selMode = null; lastTap = null;
  s.p.forEach((p, pi) => p.forEach(r => SENT.push({ r, segs:parseJ(r.j), s:r.s||null, p:pi })));

    $("#r-resume button").onclick = () => { $("#r-resume").style.display = "none"; setCursor(i, true); };

function closeReader(){
  stopPlay();
  if(CUR){
    const i = topVisible();
    if(i > 0 || S.pos[CUR.id]) S.pos[CUR.id] = { i, t:plainText(SENT[i].segs).slice(0,14), at:Date.now() };
    save();
  }
  closeSheet(); $("#rd").classList.remove("on"); document.body.style.overflow = "";
  CUR = null;
  if(TAB==="lib") renderLib(); else if(TAB==="keep") renderKeep();
  paintPill();
}
function topVisible(){
  const top = $("#r-scroll").getBoundingClientRect().top + 30;
  const els = document.querySelectorAll("#r-body .sen");
  for(let k = 0; k < els.length; k++){ if(els[k].getBoundingClientRect().bottom > top) return k; }
  return 0;
}
function segHTML(seg, i, k){
  if(!seg.w) return `<span class="p" data-k="${k}">${esc(seg.t)}</span>`;
  const g = (seg.g >= 0 && CUR.g[seg.g]) ? CUR.g[seg.g] : null;
  const cls = ["w"];
  if(seg.f.includes("*")) cls.push("ex");
  if(seg.f.includes("#")) cls.push("nm");
  if(g && S.star[wordKey(g, seg)]) cls.push("st");
  return `<span class="${cls.join(" ")}" data-k="${k}">${rubyHTML(seg.t, seg.r)}</span>`;
}
function senHTML(i){
  const x = SENT[i];
  const bm = S.bm[bmKey(CUR.id, i)] ? " bmk" : "";
  return `<span class="sen${bm}" data-i="${i}"><span class="jp">${x.segs.map((g,k) => segHTML(g,i,k)).join("")}</span><span class="en">${esc(x.r.e||"")}</span></span>`;
}
function renderReader(){
  const s = CUR;
  $("#r-title").innerHTML = titleHTML(s, true);
  const rd = $("#r-body");
  rd.className = "rwrap" + (S.cfg.furi==="all" ? " furi-all" : "") + (S.cfg.en ? " en-on" : "");
  rd.style.setProperty("--fs", S.cfg.fs + "px");
  let html = `<div class="rhead"><div class="t">${titleHTML(s, false)}</div><div class="e">${esc(s.te)}</div>
    ${s.a ? `<div class="a">${esc(s.a)}</div>` : ""}
    <div class="m">${s.k==="review" ? `<span class="tag rv">総復習 — everything up to L${s.l}</span>` : ""}<span class="tag lv">${s.l > 50 ? CHU[s.l] + " ・ 初級 + JLPT N" + (s.l===51?3:2) + " vocabulary" : "L" + s.f[0] + "–" + s.f[1] + " ・ max L" + s.l}</span><span class="tag">${SENT.length}文</span></div></div>
    <div class="resume" id="r-resume" style="display:none"></div><div class="body">`;
  let pi = -1, open = false, i = 0;
  s.p.forEach((p, P) => {
    html += `<div class="para">`;
    let inline = false;
    p.forEach(r => {
      if(r.s){
        if(inline){ html += `</div>`; inline = false; }
        const sp = (s.sp && s.sp[r.s]) || ["", ""];
        html += `<div class="ln dlg"><span class="spk ${sp[0]}">${sp[1] && /[一-鿿]/.test(r.s) ? RB(esc(r.s), esc(sp[1])) : esc(r.s)}</span><div>${senHTML(i)}</div></div>`;
      } else {
        if(!inline){ html += `<div class="ln">`; inline = true; }
        html += senHTML(i);
      }
      i++;
    });
    if(inline) html += `</div>`;
    html += `</div>`;
  });
  html += `</div>`;
  /* the few words from beyond the story's level, listed so nothing is a surprise */
  const extra = s.g.map((g,k) => ({g,k})).filter(o => o.g[3] === 0 || o.g[3] > s.l);
  html += `<div class="endbox">
    <button class="done ${S.done[s.id]?"was":""}" id="r-done">${S.done[s.id] ? "✓ 読了（もう一度読む）" : "読み終わった ✓"}</button>
    ${extra.length ? `<div class="sec">この${RB("話","はなし")}の${RB("新","あたら")}しい${RB("言葉","ことば")} ・ BEYOND ${s.l > 50 ? CHU[s.l] : "L" + s.l}</div>
      <div class="glist">${extra.map(o => `<div class="gi"><span class="gw">${esc(o.g[0])}</span><span class="gr">${esc(o.g[1]||"")}</span><span class="gm">${esc(o.g[2])}</span></div>`).join("")}</div>` : ""}
  </div>`;
  rd.innerHTML = html;
  $("#r-done").onclick = () => {
    if(S.done[s.id]){ delete S.done[s.id]; delete S.pos[s.id]; save(); setCursor(0, true); $("#r-scroll").scrollTop = 0; }
    else { S.done[s.id] = Date.now(); delete S.pos[s.id]; save(); toast("おつかれさま！ ✓"); }
    $("#r-done").className = "done" + (S.done[s.id] ? " was" : "");
    $("#r-done").textContent = S.done[s.id] ? "✓ 読了（もう一度読む）" : "読み終わった ✓";
  };
  $("#r-furi").textContent = S.cfg.furi==="all" ? "あ 全部" : "あ タップ";
  $("#r-furi").classList.toggle("on", S.cfg.furi==="all");
  $("#r-en").classList.toggle("on", S.cfg.en);
  $("#r-scroll").scrollTop = 0;

}
function senEl(i){ return document.querySelector(`#r-body .sen[data-i="${i}"]`); }
function markCursor(){
  document.querySelectorAll("#r-body .sen.cur").forEach(e => e.classList.remove("cur"));
  if(!playing && cursor > 0){ const e = senEl(cursor); if(e) e.classList.add("cur"); }
}
function setCursor(i, scroll){
  cursor = Math.max(0, Math.min(i, SENT.length-1));
  markCursor();
  if(scroll){ const e = senEl(cursor); if(e) e.scrollIntoView({ block:"center", behavior:"smooth" }); }
  paintCtl();
}
function paintCtl(){
  $("#c-play").textContent = playing ? "⏸" : "▶";
  $("#c-rate").textContent = S.cfg.rate.toFixed(S.cfg.rate===1?1:2).replace(/0$/,"") + "×";
  $("#c-mode").textContent = S.cfg.mode==="one" ? "一文ずつ" : "連続";
  $("#c-prev").disabled = cursor <= 0;
  $("#c-next").disabled = cursor >= SENT.length-1;
}

/* ---- playback: one utterance per sentence, so ▶ can start anywhere ---- */
function voiceFor(sp){
  /* each speaker gets their own sound: men use a male Japanese voice if the
     device has one, and every speaker of the same gender gets a different
     pitch, so two women talking don't sound like one person */
  if(!CUR || !CUR.sp || !sp || !CUR.sp[sp]) return { pitch:1 };
  const g = CUR.sp[sp][0];
  const same = Object.keys(CUR.sp).filter(n => CUR.sp[n][0] === g);
  const nth = Math.max(0, same.indexOf(sp));
  const ja = allVoices().filter(v => v.lang.replace("_","-").startsWith("ja"));
  const male = ja.find(v => /Otoya|Hattori|Ichiro|Keita|Daichi|Naoki/i.test(v.name));
  if(g === "m" && male && (!JV || male.voiceURI !== JV.voiceURI)) return { voice:male, pitch:[1,0.9,1.1][nth % 3] };
  return { pitch: g === "m" ? [0.82,0.92,0.75][nth % 3] : [1.08,1.22,0.97][nth % 3] };
}
async function playFrom(i){
  stopPlay(true);
  playing = true; const tok = ++playTok;
  markCursor(); paintCtl();
  for(let k = i; k < SENT.length; k++){
    if(tok !== playTok) return;
    cursor = k;
    document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
    const el = senEl(k);
    if(el){ el.classList.add("now");
      const r = el.getBoundingClientRect(), box = $("#r-scroll").getBoundingClientRect();
      if(r.top < box.top + 40 || r.bottom > box.bottom - 40) el.scrollIntoView({ block:"center", behavior:"smooth" }); }
    paintCtl();
    const x = SENT[k], v = voiceFor(x.s);
    await speak(ttsText(x.segs), true, S.cfg.rate, false, { pitch:v.pitch, voice:v.voice, estLen:kanaText(x.segs).length });
    if(tok !== playTok) return;
    S.pos[CUR.id] = { i:k, t:plainText(x.segs).slice(0,14), at:Date.now() }; save();
    if(S.cfg.mode === "one"){
      playing = false;
      if(el) el.classList.remove("now");
      setCursor(Math.min(k+1, SENT.length-1), false);
      return;
    }
    await sleep(x.s ? 520 : 380);
  }
  if(tok !== playTok) return;
  playing = false;
  document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
  setCursor(0, false); paintCtl();
  toast("おわり ✓");
}
function stopPlay(quiet){
  playTok++; playing = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
  if(!quiet && CUR){ markCursor(); paintCtl(); }
}
$("#c-play").onclick = () => { unlock(); if(playing) stopPlay(); else playFrom(cursor); };
$("#c-prev").onclick = () => { const was = playing; stopPlay(true); setCursor(cursor-1, true); if(was) playFrom(cursor); };
$("#c-next").onclick = () => { const was = playing; stopPlay(true); setCursor(cursor+1, true); if(was) playFrom(cursor); };
$("#c-rate").onclick = () => { const R = [0.8,0.9,1.0]; S.cfg.rate = R[(R.indexOf(S.cfg.rate)+1) % R.length] || 0.9; save(); paintCtl(); };
$("#c-mode").onclick = () => { S.cfg.mode = S.cfg.mode==="one" ? "cont" : "one"; save(); paintCtl();
  toast(S.cfg.mode==="one" ? "一文ずつ — one sentence per ▶" : "連続 — reads straight through"); };
$("#r-close").onclick = closeReader;
$("#r-furi").onclick = () => { S.cfg.furi = S.cfg.furi==="all" ? "tap" : "all"; save();
  const rd = $("#r-body"); rd.classList.toggle("furi-all", S.cfg.furi==="all");
  $("#r-furi").textContent = S.cfg.furi==="all" ? "あ 全部" : "あ タップ"; $("#r-furi").classList.toggle("on", S.cfg.furi==="all"); };
$("#r-en").onclick = () => { S.cfg.en = !S.cfg.en; save(); $("#r-body").classList.toggle("en-on", S.cfg.en); $("#r-en").classList.toggle("on", S.cfg.en); };
$("#r-size").onclick = () => { const F = [19,21,24,27]; S.cfg.fs = F[(F.indexOf(S.cfg.fs)+1) % F.length] || 21; save();
  $("#r-body").style.setProperty("--fs", S.cfg.fs + "px"); };

/* ---- taps: once = reading, twice = tools ---- */
$("#r-body").addEventListener("click", e => {
  const t = e.target.closest(".w,.p"); if(!t) return;
  const se = t.closest(".sen"); if(!se) return;
  const i = +se.dataset.i, k = +t.dataset.k;

});
function bmKey(id, i){ return id + ":" + i; }
function wordKey(g, seg){ return "w:" + g[0] + "|" + (g[1] || seg.r || KATA(seg.t)); }

  $("#sh-bm").onclick = () => {
    const key = bmKey(CUR.id, i);

    else S.bm[key] = { id:CUR.id, i, t:sentTxt.slice(0,40), e:x.r.e || "", at:Date.now() };
    save(); paintPill();
    if(el) el.classList.toggle("bmk", !!S.bm[key]);
