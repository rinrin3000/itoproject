<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>読解の糸 — Reading Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161f; --card:#1b222e; --card2:#232c3a; --line:#2e3949;
  --thread:#e8e0ce; --ai:#7d9cc9; --akane:#d4685e; --moegi:#93b06b;
  --kuchiba:#c9b370; --dim:#8b95a5; --ad-gap:90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--thread);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:var(--ad-gap)}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
h1{font-family:'Shippori Mincho B1',serif;font-size:22px;font-weight:700;letter-spacing:.06em}
h1 span{color:var(--akane)}
.hpill{font-size:12px;color:var(--ink);background:var(--thread);border-radius:999px;padding:3px 10px;font-weight:700}
.hlink{text-decoration:none;font-family:'Shippori Mincho B1',serif;font-size:15px;color:var(--akane);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;font-weight:500;padding:12px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--thread);border-bottom-color:var(--akane)}
main{padding:16px;max-width:660px;margin:0 auto}
.hint{color:var(--dim);font-size:13px;line-height:1.7}
.sec{margin-top:20px;margin-bottom:8px;font-size:11px;color:var(--ai);letter-spacing:.18em}
.sec:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:999px;font-size:13px;padding:7px 13px;line-height:1.35}
.chip.on{border-color:var(--akane);color:var(--akane);background:#2a1f22}
select{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:15px;padding:10px 13px;border-radius:10px;width:100%;-webkit-appearance:none}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:var(--thread)}
.empty{text-align:center;color:var(--dim);font-size:14px;margin-top:34px;line-height:2}
ruby{ruby-position:over}
rt{font-size:.52em;color:var(--dim);font-weight:400;letter-spacing:0;line-height:1;-webkit-user-select:none;user-select:none}
nav button ruby rt{font-size:.55em}

/* ---------- 本棚 level picker ---------- */
.lvbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px}
.lvtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lvnum{font-family:'Shippori Mincho B1',serif;font-size:34px;line-height:1}
.lvnum small{font-size:14px;color:var(--dim);margin-left:4px}
.lvband{font-size:12px;color:var(--ai);text-align:right;line-height:1.5}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:8px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--akane);margin-top:-10px;border:3px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--akane);border:3px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px}
.stepr{display:flex;gap:6px;margin-top:8px}
.stepr button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:13px;padding:7px 0;border-radius:9px}

.scard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:8px;color:inherit;font-family:inherit}
.scard:active{border-color:var(--akane)}
.scard.fit{border-color:#4a3a3a}
.scard.lock{opacity:.5}
.scard .st{font-family:'Shippori Mincho B1',serif;font-size:20px;line-height:1.5}
.scard .se{font-size:12.5px;color:var(--ai);margin-top:1px}
.scard .sa{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
.scard .sm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--dim)}
.tag.lv{color:var(--akane);border-color:#5c3b38}
.tag.dn{color:var(--moegi);border-color:#3f5230}
.tag.bm{color:var(--kuchiba);border-color:#5c5130}

/* ---------- reader ---------- */
#rd{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;flex-direction:column}
#rd.on{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.rbar .x{background:none;border:none;color:var(--dim);font-size:20px;padding:0 6px;font-family:inherit}
.rbar .rt{flex:1;min-width:0;font-family:'Shippori Mincho B1',serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .tb{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12.5px;border-radius:999px;padding:5px 10px;white-space:nowrap}
.rbar .tb.on{color:var(--akane);border-color:var(--akane)}
#r-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rwrap{max-width:660px;margin:0 auto;padding:18px 18px 120px}
.rhead{margin-bottom:18px}
.rhead .t{font-family:'Shippori Mincho B1',serif;font-size:27px;line-height:1.8}
.rhead .e{font-size:13px;color:var(--ai)}
.rhead .a{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:8px}
.rhead .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2a2618;border:1px solid #5c5130;color:var(--kuchiba);border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:13px}
.resume button{background:var(--kuchiba);color:var(--ink);border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:13px}
.para{margin-bottom:1.3em}
.body{font-family:'Shippori Mincho B1',serif;font-size:var(--fs,21px);line-height:2.25;word-break:normal;line-break:strict}
.ln{margin-bottom:.35em}
.ln.dlg{display:flex;gap:.6em;align-items:baseline}
.spk{flex:0 0 auto;font-family:'Noto Sans JP',sans-serif;font-size:.56em;color:var(--ai);border:1px solid var(--line);border-radius:6px;padding:0 .5em;line-height:1.9;position:relative;top:-.15em;white-space:nowrap}
.spk rt{font-size:.6em}
.spk.f{color:#d9a7a0}.spk.m{color:#8fb0d6}
.sen{border-radius:6px;transition:background .25s;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sen.now{background:rgba(212,104,94,.17)}
.sen.cur{box-shadow:inset 0 -2px 0 rgba(212,104,94,.55)}
.sen.bmk::before{content:"🔖";font-size:.6em;margin-right:.15em;position:relative;top:-.4em}
.en{display:none;font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.6;color:var(--ai);margin:.1em 0 .6em}
.en-on .sen,.sen.en1{display:block}
.en-on .ln.dlg .sen{display:block}
.en-on .en,.sen.en1 .en{display:block}
.w,.p{cursor:pointer}
/* hidden readings take no width (font-size 0), so 先週 doesn't sprout a gap where
   せんしゅう would sit; revealing one word reflows only that word */
.w rt{visibility:hidden;font-size:0}
.furi-all .w rt,.w.show rt,.w.ex rt,.w.nm rt{visibility:visible;font-size:.5em}
@media (hover:hover){ .w:hover rt{visibility:visible;font-size:.5em} .w:hover{color:#fff} }
.w.ex{text-decoration:underline dotted var(--kuchiba);text-underline-offset:.32em;text-decoration-thickness:1px}
.w.ex rt{color:var(--kuchiba)}
.w.st{text-decoration:underline solid var(--kuchiba);text-underline-offset:.32em;text-decoration-thickness:2px}
.w.tap,.p.tap{background:rgba(125,156,201,.22);border-radius:4px}
.w.sel,.p.sel{background:rgba(201,179,112,.28)}
.selbar{position:sticky;top:0;z-index:3;background:#2a2618;color:var(--kuchiba);border-bottom:1px solid #5c5130;font-size:13px;padding:9px 14px;display:none;justify-content:space-between;align-items:center;gap:10px}
.selbar.on{display:flex}
.selbar button{background:none;border:1px solid #5c5130;color:var(--kuchiba);border-radius:8px;padding:4px 10px;font-family:inherit;font-size:12px}
.endbox{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
.endbox .done{width:100%;background:var(--moegi);color:var(--ink);border:none;border-radius:12px;padding:14px;font-family:inherit;font-weight:700;font-size:15px}
.endbox .done.was{background:var(--card2);color:var(--moegi);border:1px solid #3f5230}
.glist{margin-top:16px}
.glist .gi{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.glist .gw{font-family:'Shippori Mincho B1',serif;font-size:17px;flex:0 0 auto}
.glist .gr{color:var(--dim);font-size:12px}
.glist .gm{color:var(--ai);flex:1}
.rctl{display:flex;align-items:center;gap:7px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ink)}
.rctl button{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:12px;font-size:18px;padding:11px 0;flex:1}
.rctl button.play{flex:1.6;background:var(--akane);color:var(--ink);border:none;font-weight:700}
.rctl button.sm{flex:0 0 auto;font-size:12.5px;padding:12px 10px;color:var(--dim)}
.rctl button:disabled{opacity:.4}

/* ---------- bottom sheet ---------- */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.35);display:none}
#scrim.on{display:block}
#sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:72vh;overflow-y:auto}
#sheet.on{transform:none;visibility:visible}
.sh-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sh-word{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sh-w{font-family:'Shippori Mincho B1',serif;font-size:30px;line-height:1.5}
.sh-w rt{visibility:visible}
.sh-d{font-size:13px;color:var(--thread);margin-top:2px;line-height:1.6}
.sh-d .k{color:var(--dim)}
.sh-d .l{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;color:var(--dim)}
.sh-d .l.x{color:var(--kuchiba);border-color:#5c5130}
.sh-sen{font-family:'Shippori Mincho B1',serif;font-size:16px;line-height:1.9;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sh-en{font-size:13px;color:var(--ai);margin-top:4px;line-height:1.6}
.sh-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.sh-btns button{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:10px;font-size:13px;padding:9px 12px}
.sh-btns button.on{color:var(--kuchiba);border-color:#5c5130}
.sh-btns button.pri{background:var(--akane);color:var(--ink);border:none;font-weight:700}
.sh-x{background:none;border:none;color:var(--dim);font-size:18px;padding:2px 4px}

/* ---------- キープ ---------- */
.krow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:7px}
.krow .kl{flex:1;min-width:0}
.krow .kj{font-family:'Shippori Mincho B1',serif;font-size:18px;line-height:1.6}
.krow .kj rt{visibility:visible}
.krow .kk{font-size:11.5px;color:var(--dim);margin-top:2px}
.krow .km{font-size:12.5px;color:var(--ai);margin-top:3px;line-height:1.55}
.krow .kr{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.mini{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;font-family:inherit;font-size:12px;padding:5px 9px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--thread);color:var(--ink);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>読解<span>の</span>糸</h1>
  <span style="display:flex;gap:10px;align-items:center">
    <span class="hpill" id="hpill">…</span>
    <a href="index.html" class="hlink" title="Back to the Ito hub">糸。</a>
  </span>
</header>
<nav>
  <button id="tab-lib" class="on"><ruby>本棚<rt>ほんだな</rt></ruby></button>
  <button id="tab-keep">★ キープ</button>
  <button id="tab-set"><ruby>設定<rt>せってい</rt></ruby></button>
</nav>
<main id="main"></main>

<div id="rd">
  <div class="rbar">
    <button class="x" id="r-close" aria-label="close">✕</button>
    <div class="rt" id="r-title"></div>
    <button class="tb" id="r-furi">あ</button>
    <button class="tb" id="r-en">英</button>
    <button class="tb" id="r-size">Aa</button>
  </div>
  <div id="r-scroll">
    <div class="selbar" id="selbar"><span>✂ フレーズの<b>終わり</b>をタップ（同じ文の中）</span><button id="sel-cancel">やめる</button></div>
    <div class="rwrap" id="r-body"></div>
  </div>
  <div class="rctl">
    <button id="c-prev" aria-label="previous sentence">⏮</button>
    <button id="c-play" class="play">▶</button>
    <button id="c-next" aria-label="next sentence">⏭</button>
    <button id="c-rate" class="sm">0.9×</button>
    <button id="c-mode" class="sm">連続</button>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){

/* =====================================================================
   ==================  DATA — EDITABLE CONTENT SECTION  =================

   STORIES is GENERATED by build/build.py from build/stories/*.txt and
   pasted here. Hand edits are fine, but the next build will overwrite
   them — edit the .txt sources instead when you can.

   Each story:
     id   PERMANENT — ★, 🔖 and 続き are keyed to it. Never change or reuse.
     l    ceiling: no vocabulary from a Minna lesson after this one
     f    [lo,hi] focus band — the lessons the story deliberately works
     t    title (markup)    te English title    a  one-line blurb
     p    paragraphs → lines {j: markup, e: English, s?: speaker}
     g    glossary [dictionary form, reading, gloss, lesson (0 = not Minna)]
     sp   speakers {name: [f|m, reading]}
   Markup inside j / t:
     [表記|よみ|g|flags]   g = index into the story's glossary
       flags  *  beyond the story's level → furigana always on, dotted line
              #  proper noun → furigana always on
              !  TTS reads the kana instead of the kanji (known misreads)
     anything outside brackets is plain kana / punctuation
   ===================================================================== */
const STORIES=[

/* =====================================================================
   読解の糸 — leveled reading.
   Storage key is "dokkai_v1". It never reads or writes bunkei_v2 or
   shiken_v1, so nothing here can touch anyone's SRS or ★ lists elsewhere.
   ★ / 🔖 / 続き are keyed to story id + the sentence TEXT (index is only a
   hint), so stories can be edited later without orphaning anything.
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RB = (b,r) => `<ruby>${b}<rt>${r}</rt></ruby>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= storage ================= */
let canStore = true;
function load(){ try{ const r = localStorage.getItem("dokkai_v1"); return r ? JSON.parse(r) : {}; }
                 catch(e){ canStore = false; return {}; } }
function save(){ try{ localStorage.setItem("dokkai_v1", JSON.stringify(S)); }catch(e){ canStore = false; } }
const S = Object.assign({ cfg:{}, star:{}, pos:{}, bm:{}, done:{} }, load());
S.cfg = Object.assign({ jvURI:"", evURI:"", lv:25, furi:"tap", en:false, rate:0.9, mode:"cont", fs:21, kana:false }, S.cfg||{});
["star","pos","bm","done"].forEach(k => { S[k] = S[k] || {}; });

/* ================= data prep ================= */
const BY = {};
STORIES.forEach(s => { BY[s.id] = s; });
const KATA = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const isKanji = c => /[一-鿿々〆ヶ]/.test(c);

function parseJ(j){
  const out = [], re = /\[([^|\]]+)(?:\|([^|\]]*))?(?:\|([^|\]]*))?(?:\|([^|\]]*))?\]/g;
  let i = 0, m;
  while((m = re.exec(j))){
    if(m.index > i) out.push({ t:j.slice(i, m.index), w:false });
    out.push({ t:m[1], r:m[2]||"", g:(m[3]!==undefined && m[3]!=="") ? +m[3] : -1, f:m[4]||"", w:true });
    i = re.lastIndex;
  }
  if(i < j.length) out.push({ t:j.slice(i), w:false });
  return out;
}
/* put the reading only over the kanji: 召し上がっ/めしあがっ → 召[め]し上[あ]がっ */
function rubyHTML(t, r){
  if(!r || !/[一-鿿々〆ヶ]/.test(t)) return esc(t);
  const runs = t.match(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g);
  const pat = "^" + runs.map(x => isKanji(x[0]) ? "(.+?)" : KATA(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("") + "$";
  const m = new RegExp(pat).exec(KATA(r));
  if(!m) return RB(esc(t), esc(r));
  let k = 1;
  return runs.map(x => isKanji(x[0]) ? RB(esc(x), esc(m[k++])) : esc(x)).join("");
}
function plainText(segs){ return segs.map(s => s.t).join(""); }
function kanaText(segs){ return segs.map(s => s.w && s.r ? s.r : KATA(s.t)).join(""); }
/* what the synthesiser gets: kanji for natural prosody, except tokens flagged ! */
function ttsText(segs){
  if(S.cfg.kana) return kanaText(segs);
  return segs.map(s => (s.w && s.f.includes("!") && s.r) ? s.r : s.t).join("");
}

/* ================= TTS ================= */
/* Reader additions to this engine: speak() takes opt {pitch, voice, estLen}.
   estLen = KANA length, so the length watchdog doesn't cut off a kanji-dense
   sentence. Sentences are spoken with kanji (natural prosody) except tokens
   flagged ! in the data, or everything in かなで mode.
   Lifted wholesale from 文型の糸 — every line here is load-bearing on
   iOS/Chrome. Isolated Japanese is always fed as KANA, never kanji, so the
   engine can't misread 行って as おこなって. */
let JV=null,EV=null,currentU=null,unlocked=false,speakToken=0,noJa=false,voicesSettled=false;
const SPOKEN=[];   /* rolling log of what was actually voiced — debug + tests */
/* ---- EDITABLE: TTS pronunciation overrides -------------------------------
   Apple's Kyoko applies sequential voicing (rendaku) across seams it thinks
   it sees inside a kana string, so an isolated word can come out as ...づき
   where ...つき was meant. Google's Japanese voice does not do this.
   Left side = the kana we store. Right side = what to FEED the synthesiser.
   A space or 、 at the seam is usually enough to stop the voicing; katakana
   sometimes helps too. Add entries freely — nothing else depends on this. */
const SAY_FIX = {
  "まいつき":   "まい つき",
  "ひとつき":   "ひと つき",
  "みつき":     "み つき",
  "だいすき":   "だい すき",
  "ものすごい": "もの すごい"
};
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
function pickVoices(){
  const vs = allVoices(), isJa = v => v.lang.replace("_","-").startsWith("ja");
  JV = (S.cfg.jvURI && vs.find(v=>v.voiceURI===S.cfg.jvURI))
     || vs.find(v=>/Google/i.test(v.name)&&isJa(v))
     || vs.find(v=>/Kyoko/i.test(v.name)&&isJa(v))
     || vs.find(isJa) || null;
  EV = (S.cfg.evURI && vs.find(v=>v.voiceURI===S.cfg.evURI))
     || vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
     || vs.find(v=>v.lang.startsWith("en")) || null;
  noJa = vs.length>0 && !JV;
}
async function ensureVoices(){
  for(let i=0;i<20;i++){ if(allVoices().length) break; await new Promise(r=>setTimeout(r,120)); }
  pickVoices(); voicesSettled = true;
}
if (typeof speechSynthesis !== "undefined"){
  speechSynthesis.onvoiceschanged = () => pickVoices();
  pickVoices(); ensureVoices();
}
function unlock(){ if(unlocked) return; unlocked = true;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("あ"); u.volume=0; u.rate=1;
       speechSynthesis.speak(u); }catch(e){} }
document.addEventListener("touchstart", unlock, {once:true});
document.addEventListener("click", unlock, {once:true});
function speak(text, jp=true, rate=0.92, _retry=false, opt={}){
  if(!_retry){ SPOKEN.push(text); if(SPOKEN.length>40) SPOKEN.shift(); }
  if(jp && SAY_FIX[text]) text = SAY_FIX[text];
  const myToken = ++speakToken;
  return new Promise(async res=>{
    try{
      if(!voicesSettled) await ensureVoices();
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      if(busy) speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken !== speakToken) return res();
        pickVoices();
        const u = new SpeechSynthesisUtterance(text);
        currentU = u;
        u.lang = jp ? "ja-JP" : "en-US";
        let v = (jp && opt.voice) || (jp ? JV : EV), r = jp ? rate : 1.0;
        if(_retry){ r = 1.0;
          if(jp){ const alt = allVoices().find(x=>x.lang.replace("_","-").startsWith("ja") && v && x.localService !== v.localService);
                  if(alt) v = alt; } }
        if(v) u.voice = v;
        u.rate = Math.max(0.7, r); u.pitch = opt.pitch || 1;
        let done=false, started=false;
        const finish = ()=>{ if(done) return; done=true; clearInterval(kick); res(); };
        u.onstart = ()=>{ started = true; };
        u.onend = finish; u.onerror = finish;
        const est = 600 + (opt.estLen || text.length)*(jp?185:75)/u.rate;
        setTimeout(finish, est+1500);
        setTimeout(()=>{ if(!started && !done && !_retry){ done=true; clearInterval(kick);
            try{ speechSynthesis.cancel(); }catch(e){}
            setTimeout(()=>speak(text,jp,1.0,true,opt).then(res),160); } }, 1400);
        const kick = setInterval(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 2500);
        speechSynthesis.speak(u);
        setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 120);
      }, busy?230:40);
    }catch(e){ res(); }
  });
}

  ・<b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Japanese → download <b>Kyoko</b><br>
  ・<b>Windows:</b> Settings → Time &amp; Language → Language → add 日本語 (with Speech), or use Edge/Chrome<br>

function storyLen(s){ return s.p.reduce((a,p) => a + p.length, 0); }
function storyChars(s){ return s.p.reduce((a,p) => a + p.reduce((b,r) => b + plainText(parseJ(r.j)).length, 0), 0); }
function lineAt(s, i){ let k = 0; for(const p of s.p) for(const r of p){ if(k === i) return r; k++; } return null; }
/* find a saved sentence again even if the story was edited: text first, index as hint */
function locate(s, i, txt){
  const L = storyLen(s);
  if(txt){
    const at = lineAt(s, i);
    if(at && plainText(parseJ(at.j)).startsWith(txt)) return i;
    let k = 0; for(const p of s.p) for(const r of p){ if(plainText(parseJ(r.j)).startsWith(txt)) return k; k++; }
  }
  return Math.max(0, Math.min(i||0, L-1));
}

let CUR = null;        /* the open story */

function openStory(id, at){

  s.p.forEach((p, pi) => p.forEach(r => SENT.push({ r, segs:parseJ(r.j), s:r.s||null, p:pi })));

    const i = locate(s, saved.i, saved.t);

    $("#r-resume").style.display = "flex";

  paintCtl();
}
function closeReader(){
  stopPlay();

    const i = topVisible();
    if(i > 0 || S.pos[CUR.id]) S.pos[CUR.id] = { i, t:plainText(SENT[i].segs).slice(0,14), at:Date.now() };

  }
  closeSheet(); $("#rd").classList.remove("on"); document.body.style.overflow = "";

}
function topVisible(){

function segHTML(seg, i, k){
  if(!seg.w) return `<span class="p" data-k="${k}">${esc(seg.t)}</span>`;
  const g = (seg.g >= 0 && CUR.g[seg.g]) ? CUR.g[seg.g] : null;
  const cls = ["w"];
  if(seg.f.includes("*")) cls.push("ex");
  if(seg.f.includes("#")) cls.push("nm");
  if(g && S.star[wordKey(g, seg)]) cls.push("st");
  return `<span class="${cls.join(" ")}" data-k="${k}">${rubyHTML(seg.t, seg.r)}</span>`;
}
function senHTML(i){

function renderReader(){

    html += `</div>`;
  });
  html += `</div>`;
  /* the few words from beyond the story's level, listed so nothing is a surprise */
  const extra = s.g.map((g,k) => ({g,k})).filter(o => o.g[3] === 0 || o.g[3] > s.l);
  html += `<div class="endbox">

function senEl(i){ return document.querySelector(`#r-body .sen[data-i="${i}"]`); }
function markCursor(){
  document.querySelectorAll("#r-body .sen.cur").forEach(e => e.classList.remove("cur"));
  if(!playing && cursor > 0){ const e = senEl(cursor); if(e) e.classList.add("cur"); }
}
function setCursor(i, scroll){
  cursor = Math.max(0, Math.min(i, SENT.length-1));

function paintCtl(){
  $("#c-play").textContent = playing ? "⏸" : "▶";

/* ---- playback: one utterance per sentence, so ▶ can start anywhere ---- */
function voiceFor(sp){
  /* each speaker gets their own sound: men use a male Japanese voice if the
     device has one, and every speaker of the same gender gets a different
     pitch, so two women talking don't sound like one person */
  if(!CUR || !CUR.sp || !sp || !CUR.sp[sp]) return { pitch:1 };
  const g = CUR.sp[sp][0];
  const same = Object.keys(CUR.sp).filter(n => CUR.sp[n][0] === g);
  const nth = Math.max(0, same.indexOf(sp));
  const ja = allVoices().filter(v => v.lang.replace("_","-").startsWith("ja"));
  const male = ja.find(v => /Otoya|Hattori|Ichiro|Keita|Daichi|Naoki/i.test(v.name));
  if(g === "m" && male && (!JV || male.voiceURI !== JV.voiceURI)) return { voice:male, pitch:[1,0.9,1.1][nth % 3] };
  return { pitch: g === "m" ? [0.82,0.92,0.75][nth % 3] : [1.08,1.22,0.97][nth % 3] };
}
async function playFrom(i){
  stopPlay(true);
  playing = true; const tok = ++playTok;
  markCursor(); paintCtl();
  for(let k = i; k < SENT.length; k++){
    if(tok !== playTok) return;
    cursor = k;
    document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
    const el = senEl(k);
    if(el){ el.classList.add("now");
      const r = el.getBoundingClientRect(), box = $("#r-scroll").getBoundingClientRect();
      if(r.top < box.top + 40 || r.bottom > box.bottom - 40) el.scrollIntoView({ block:"center", behavior:"smooth" }); }
    paintCtl();
    const x = SENT[k], v = voiceFor(x.s);
    await speak(ttsText(x.segs), true, S.cfg.rate, false, { pitch:v.pitch, voice:v.voice, estLen:kanaText(x.segs).length });
    if(tok !== playTok) return;
    S.pos[CUR.id] = { i:k, t:plainText(x.segs).slice(0,14), at:Date.now() }; save();
    if(S.cfg.mode === "one"){
      playing = false;
      if(el) el.classList.remove("now");
      setCursor(Math.min(k+1, SENT.length-1), false);
      return;
    }
    await sleep(x.s ? 520 : 380);
  }
  if(tok !== playTok) return;
  playing = false;
  document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
  setCursor(0, false); paintCtl();
  toast("おわり ✓");
}
function stopPlay(quiet){
  playTok++; playing = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll("#r-body .sen.now").forEach(e => e.classList.remove("now"));
  if(!quiet && CUR){ markCursor(); paintCtl(); }
}
$("#c-play").onclick = () => { unlock(); if(playing) stopPlay(); else playFrom(cursor); };
$("#c-prev").onclick = () => { const was = playing; stopPlay(true); setCursor(cursor-1, true); if(was) playFrom(cursor); };
$("#c-next").onclick = () => { const was = playing; stopPlay(true); setCursor(cursor+1, true); if(was) playFrom(cursor); };
$("#c-rate").onclick = () => { const R = [0.8,0.9,1.0]; S.cfg.rate = R[(R.indexOf(S.cfg.rate)+1) % R.length] || 0.9; save(); paintCtl(); };
$("#c-mode").onclick = () => { S.cfg.mode = S.cfg.mode==="one" ? "cont" : "one"; save(); paintCtl();

/* =====================================================================
   キープ — ★ words, phrases, sentences, and 🔖 bookmarks

let KF = "all";
function renderKeep(){
  const items = Object.entries(S.star).map(([key, v]) => Object.assign({ key }, v));
  const bms = Object.entries(S.bm).map(([key, v]) => Object.assign({ key, k:"b" }, v));
  const all = items.concat(bms).filter(x => BY[x.id]).sort((a,b) => (b.at||0) - (a.at||0));
  const n = { w:0, p:0, s:0, b:0 }; all.forEach(x => n[x.k]++);
  const show = KF==="all" ? all : all.filter(x => x.k === KF);
  const F = [["all","ぜんぶ",all.length],["w","単語",n.w],["p","フレーズ",n.p],["s","文",n.s],["b","🔖 しおり",n.b]];
  const row = x => {
    const s = BY[x.id];
    let main, sub;
    if(x.k === "w"){
      main = esc(x.t) + (x.r && x.r !== x.t ? `<span style="font-size:13px;color:var(--dim)">（${esc(x.r)}）</span>` : "");
      sub = `${esc(x.m||"")}${x.l ? ` ・ L${x.l}` : ` ・ みんな外`}`;
    } else if(x.k === "b"){
      main = esc(x.t) + (x.t.length >= 40 ? "…" : ""); sub = esc(x.e||"");
    } else { main = esc(x.t); sub = esc(x.e||""); }
    const lab = { w:"単語", p:"フレーズ", s:"文", b:"🔖" }[x.k];
    return `<div class="krow"><div class="kl"><div class="kj">${main}</div>
      <div class="kk">${lab} ・ ${esc(s.te)}</div>${sub ? `<div class="km">${sub}</div>` : ""}
      ${x.k==="w" && x.ctx ? `<div class="kk" style="margin-top:4px">「${esc(x.ctx)}」</div>` : ""}</div>
      <div class="kr"><button class="mini" data-go="${esc(x.key)}">読む →</button><button class="mini" data-del="${esc(x.key)}">✕</button></div></div>`;
  };
  $("#main").innerHTML = `
  <div class="chips" id="kf">${F.map(f => `<button class="chip ${KF===f[0]?"on":""}" data-f="${f[0]}">${f[1]} ${f[2]}</button>`).join("")}</div>
  ${KF!=="b" && (KF==="all"||KF==="w") && n.w ? `<div class="chips" style="margin-top:10px"><button class="chip" id="k-say">🔊 ★単語を聞く</button><button class="chip" id="k-copy">📋 コピー</button></div>` : (show.length ? `<div class="chips" style="margin-top:10px"><button class="chip" id="k-copy">📋 コピー</button></div>` : "")}
  ${show.length ? show.map(row).join("") : `<div class="empty">まだありません。<br><span style="font-size:12px">Tap a word twice in any story → ☆ / 🔖 / ✂</span></div>`}`;
  document.querySelectorAll("#kf .chip").forEach(b => b.onclick = () => { KF = b.dataset.f; renderKeep(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const k = b.dataset.del; if(S.star[k]) delete S.star[k]; else delete S.bm[k]; save(); paintPill(); renderKeep(); });
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const k = b.dataset.go, x = S.star[k] || S.bm[k]; if(!x) return;
    const s = BY[x.id]; openStory(x.id, locate(s, x.i, (x.ctx || x.t || "").slice(0,14)));
  });
  const ks = $("#k-say");
  if(ks) ks.onclick = async () => {
    unlock();
    const ws = all.filter(x => x.k === "w");
    for(const w of ws){ await speak(w.r || w.t, true, 0.85); await sleep(500); if(TAB !== "keep") break; }
  };
  const kc = $("#k-copy");
  if(kc) kc.onclick = async () => {
    const t = show.map(x => x.k==="w" ? `${x.t}\t${x.r||""}\t${x.m||""}` : `${x.t}\t${x.e||""}`).join("\n");
    try{ await navigator.clipboard.writeText(t); toast("コピーしました"); }catch(e){ prompt("Copy this:", t); }
  };
}

/* =====================================================================
   設定
   ===================================================================== */
function renderSettings(){
  const vs = allVoices();
  const ja = vs.filter(v => v.lang.replace("_","-").startsWith("ja"));
  const opts = (list, sel) => `<option value="">自動で選ぶ</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI===sel?"selected":""}>${esc(v.name)}${v.localService?"（端末内）":"（ネット）"}</option>`).join("");
  const nst = Object.keys(S.star).length, nbm = Object.keys(S.bm).length;
  $("#main").innerHTML = (noJa ? jaWarnHTML() : "") + `
  <div class="sec">${RB("音声設定","おんせいせってい")}</div>
  <select id="s-jv">${opts(ja, S.cfg.jvURI)}</select>
  <div class="chips" style="margin-top:10px">
    <button class="chip" id="s-test">▶ テスト</button>
    <button class="chip" id="s-reset">${RB("音声","おんせい")}リセット</button>
  </div>
  <div class="sec">${RB("読","よ")}み${RB("上","あ")}げ</div>
  <div class="chips">
    <button class="chip ${!S.cfg.kana?"on":""}" id="s-kanji">${RB("漢字","かんじ")}のまま</button>
    <button class="chip ${S.cfg.kana?"on":""}" id="s-kana">かなで</button>
  </div>
  <div class="hint" style="margin-top:8px">漢字のまま gives the synthesiser whole sentences with kanji, which sounds most natural; the handful of words it is known to misread are already fed as kana. かなで sends everything as kana — safest readings, slightly flatter intonation. Dialogue lines use a second Japanese voice if your device has one, otherwise the same voice at a different pitch.</div>
  <div class="sec">キープ ・ しおり</div>
  <div class="chips">
    <button class="chip" id="s-exp">📋 ${RB("進捗","しんちょく")}をコピー</button>
    <button class="chip" id="s-imp">${RB("貼","は")}り${RB("付","つ")}け</button>
    <button class="chip" id="s-clear">★🔖 ${RB("全部消","ぜんぶけ")}す（${nst + nbm}）</button>
  </div>
  <div class="note"><b>Moving devices:</b> 進捗をコピー copies your ★, 🔖, 続き positions and 読了 marks as text — send it to yourself, then 貼り付け on the new device. Pasting <b>merges</b>; an old copy can't erase newer progress. The 糸。 home page backs this app up together with the others.</div>
  <div class="sec">このアプリについて</div>
  <div class="note">
    <b>How the level is kept honest.</b> Every word in every story was checked by machine against the full Minna no Nihongo 初級 I &amp; II vocabulary list (MinnaNoDS), lesson by lesson: a story marked "max L27" contains no vocabulary word that Minna introduces after lesson 27. The rare exceptions (梅雨, ラーメン, アプリ…) are marked with a gold dotted line, always show furigana, and are listed at the end of the story.<br><br>
    <b>What the machine can't check:</b> grammar. Grammar ceilings were kept by hand, against Minna's lesson order — if you spot a pattern that arrives too early, that's a real bug worth reporting with the story and sentence.<br><br>
    Furigana come from a dictionary-based reader and were reviewed line by line; numbers keep their counter readings (20分 = ぷん). Stories are original — everyday life in Japan now, not textbook text.
  </div>
  ${canStore ? "" : `<div class="note" style="border-color:var(--akane)">⚠ This browser is blocking local storage, so ★ marks and bookmarks won't survive a reload. Private/Incognito mode is the usual cause.</div>`}`;
  $("#s-jv").onchange = e => { S.cfg.jvURI = e.target.value; save(); pickVoices(); };
  $("#s-test").onclick = () => { unlock(); speak("駅の前にコンビニがあります。", true, S.cfg.rate); };
  $("#s-reset").onclick = () => { try{ speechSynthesis.cancel(); }catch(e){}
    voicesSettled = false; unlocked = false; ensureVoices().then(() => speak("リセットしました。")); };
  $("#s-kanji").onclick = () => { S.cfg.kana = false; save(); renderSettings(); };
  $("#s-kana").onclick = () => { S.cfg.kana = true; save(); renderSettings(); };
  $("#s-clear").onclick = () => { if(confirm("★ and 🔖 will be cleared (読了 marks stay). Continue?")){ S.star = {}; S.bm = {}; save(); renderSettings(); paintPill(); } };
  $("#s-exp").onclick = async () => {
    const t = JSON.stringify({ app:"dokkai", star:S.star, bm:S.bm, pos:S.pos, done:S.done });
    S.lastBackup = Date.now(); save();
    try{ await navigator.clipboard.writeText(t); alert("コピーしました！ Progress copied."); }
    catch(e){ prompt("Copy this:", t); }
  };
  $("#s-imp").onclick = () => {
    const t = prompt("Paste your saved progress:");
    if(!t) return;
    let p; try{ p = JSON.parse(t); }catch(e){ return alert("読み込めませんでした。Couldn't read that."); }
    if(p && p.ito && p.data && p.data.dokkai_v1) p = p.data.dokkai_v1;   /* a whole-site backup */
    if(!p || (!p.star && !p.bm && !p.pos && !p.done)) return alert("形式が違うみたいです。That doesn't look like a 読解の糸 backup.");
    mergeInto(S, p); save(); paintPill(); renderSettings();
    alert("復元しました！ Merged.");
  };
}
/* merge never deletes, and the newer copy of anything wins */
function mergeInto(cur, inc){
  ["star","bm"].forEach(k => { cur[k] = cur[k] || {};
    for(const x in (inc[k]||{})) if(!cur[k][x] || (inc[k][x].at||0) > (cur[k][x].at||0)) cur[k][x] = inc[k][x]; });
  cur.pos = cur.pos || {};
  for(const x in (inc.pos||{})) if(!cur.pos[x] || (inc.pos[x].at||0) > (cur.pos[x].at||0)) cur.pos[x] = inc.pos[x];
  cur.done = cur.done || {};
  for(const x in (inc.done||{})) if(!cur.done[x]) cur.done[x] = inc.done[x];
}

/* ================= boot ================= */
paintPill();
renderLib();
window.__dokkai = { S, STORIES, SPOKEN, locate, parseJ, rubyHTML, ttsText, kanaText };

})();
</script>

<script>
/* auto-updater: iOS home-screen apps cache HTML hard. On launch, fetch a fresh
   copy (cache-bypassed); if the server's APPV differs, load the fresh copy.
   We navigate rather than document.write(): document.open() keeps the SAME
   window, so top-level declarations from the outgoing copy survive and the
   incoming copy dies on "already been declared" — a blank page.
   Bump APPV each release. */
(function(){var APPV="2026.10.14-1";
try{if(sessionStorage.getItem("itoUpdDokkai")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("itoUpdDokkai",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
