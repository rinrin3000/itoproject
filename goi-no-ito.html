<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>語彙の糸 — Word Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161f; --card:#1b222e; --card2:#232c3a; --line:#2e3949;
  --thread:#e8e0ce; --ai:#7d9cc9; --akane:#d4685e; --moegi:#93b06b; --kuchiba:#c9b370;
  --dim:#8b95a5; --ad-gap:90px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--thread);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:var(--ad-gap)}
header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
h1{font-family:'Shippori Mincho B1',serif;font-size:22px;font-weight:700;letter-spacing:.06em}
h1 span{color:var(--akane)}
#due-pill{font-size:12px;color:var(--ink);background:var(--thread);border-radius:999px;padding:3px 10px;font-weight:700}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;font-weight:500;padding:12px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--thread);border-bottom-color:var(--akane)}
main{padding:18px 16px;max-width:560px;margin:0 auto}
.hint{color:var(--dim);font-size:13px;line-height:1.7}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 18px 20px;margin-top:14px;position:relative}
.pcard .tag{position:absolute;top:-9px;left:14px;background:var(--ink);border:1px solid var(--line);color:var(--ai);font-size:11px;padding:2px 9px;border-radius:999px;letter-spacing:.08em}
.know-btn{position:absolute;top:-9px;right:12px;background:var(--ink);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11px;padding:2px 9px;border-radius:999px}
.head{font-family:'Shippori Mincho B1',serif;font-size:34px;line-height:1.5;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.head .frame{font-size:18px;color:var(--dim)}
.cue{font-size:19px;line-height:1.6;text-align:center}
.cue small{display:block;font-size:12px;color:var(--dim);margin-top:6px}
.yomi{text-align:center;color:var(--kuchiba);font-size:17px;margin-top:4px;letter-spacing:.05em}
.gloss{font-size:16px;line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.gloss .also{display:block;font-size:13px;color:var(--dim);margin-top:4px}
.badges{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim)}
.badge.v{color:var(--akane);border-color:var(--akane)}
.ex{margin-top:12px;padding:10px 12px;background:var(--card2);border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.ex .jx{font-family:'Shippori Mincho B1',serif;font-size:18px;line-height:1.95}
.ex .ex-en{font-size:13px;color:var(--dim);line-height:1.6;margin-top:2px}
.ex .ex-body{flex:1}
.ex button{flex:none;background:var(--ink);border:1px solid var(--line);color:var(--thread);border-radius:999px;font-size:13px;width:36px;height:36px}
ruby rt{font-size:.5em;color:var(--kuchiba);font-family:'Noto Sans JP',sans-serif}
.nofuri ruby rt{visibility:hidden}
.veil .back{display:none}
.reveal-btn{width:100%;margin-top:18px;background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:15px;padding:14px;border-radius:10px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.row button,.chip{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;border-radius:999px;font-size:13px;padding:8px 14px}
.chip.on{border-color:var(--akane);color:var(--akane)}
.grades{display:flex;gap:8px;margin-top:18px}
.grades button{flex:1;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;padding:14px 0;color:var(--ink)}
.g-again{background:#b0655d}.g-hard{background:#c9b370}.g-good{background:var(--moegi)}.g-easy{background:var(--ai)}
.gsub{display:block;font-size:10px;font-weight:400;opacity:.75}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.controls button,select,input[type=number]{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:14px;padding:9px 12px;border-radius:10px}
input[type=number]{width:70px}
.controls .go{background:var(--akane);color:var(--ink);font-weight:700;border:none}
.controls label{font-size:13px;color:var(--dim)}
.sec{margin-top:24px;font-size:12px;color:var(--ai);letter-spacing:.18em}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--dim);line-height:1.75}
.note b{color:var(--thread)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips .chip{padding:5px 10px;font-size:12px}
.brow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;gap:10px}
.brow .w{font-family:'Shippori Mincho B1',serif;font-size:17px;min-width:0}
.brow .w small{display:block;font-family:'Noto Sans JP';font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.brow .meta{font-size:11px;color:var(--dim);white-space:nowrap}
.st0{color:var(--dim)}.st1{color:var(--kuchiba)}.st2{color:var(--moegi)}.st3{color:var(--ai)}
.done{font-family:'Shippori Mincho B1',serif;font-size:22px;text-align:center;margin-top:50px;line-height:2}
.done small{display:block;font-family:'Noto Sans JP';font-size:13px;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:2px;height:80px;margin-top:10px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--ai);border-radius:2px 2px 0 0;min-height:1px}
.bars div.today{background:var(--akane)}
.barlab{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px}
.drill-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:14px;min-height:200px;text-align:center}
.drill-cue{font-size:18px;line-height:1.6;min-height:54px}
.drill-ja{font-family:'Shippori Mincho B1',serif;font-size:28px;line-height:1.6;margin-top:12px;min-height:46px}
.drill-ex{font-family:'Shippori Mincho B1',serif;font-size:17px;line-height:1.9;margin-top:10px;color:var(--dim);min-height:30px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--akane);margin-right:8px;animation:pu 1.2s infinite}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:1}}
#sheet{position:fixed;inset:0;background:rgba(8,10,15,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
#sheet .inner{background:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:16px 16px 40px}
#sheet .x{float:right;background:none;border:none;color:var(--dim);font-size:22px}
.yomi.top{margin:0 0 -4px;font-size:15px}
.frow{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 4px}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12px;padding:4px 10px;border-radius:999px}
.starb{background:none;border:none;color:var(--kuchiba);font-size:20px;padding:0 4px}
.lrow{align-items:center}
.lrow .w{flex:1;cursor:pointer}
.lrow .w small{max-width:100%}
.lrow .w small.meta{color:var(--dim);font-size:10.5px}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:var(--card2);border:none;border-left:1px solid var(--line);color:var(--dim);font-size:13px;width:31px;height:32px;padding:0;font-family:inherit}
.seg button:first-child{border-left:none}
.seg button.on.s-w{background:var(--ai);color:var(--ink)}
.seg button.on.s-m{background:var(--moegi);color:var(--ink)}
.seg button.on.s-s{background:var(--kuchiba);color:var(--ink)}
.seg button.on.s-n{background:var(--thread);color:var(--ink)}
.seg button.on.s-x{background:var(--akane);color:var(--ink)}
.chip.full{border-color:var(--moegi)}.chip.part{border-style:dashed;border-color:var(--moegi)}.chip.pend{border-color:var(--kuchiba);color:var(--kuchiba)}
.bars .stk{flex:1;display:flex;flex-direction:column-reverse;height:100%;background:none}
.bars .stk i{display:block;background:var(--ai);border-radius:2px 2px 0 0}
.bars .stk u{display:block;background:var(--line)}
#pend{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--kuchiba);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:center;gap:8px;z-index:15;font-size:13px}
#pend.open{display:flex}
#pend button{background:var(--card2);border:1px solid var(--line);color:var(--thread);font-family:inherit;font-size:13px;padding:8px 12px;border-radius:999px}
#pend .go,.controls .go{background:var(--akane);color:var(--ink);font-weight:700;border:none}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--thread);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
details summary{cursor:pointer}
</style>
</head>

<header><h1>語彙<span>の</span>糸</h1><span style="display:flex;gap:10px;align-items:center"><span id="due-pill">…</span><a href="index.html" title="Back to the Ito hub" style="text-decoration:none;font-family:'Shippori Mincho B1',serif;font-size:15px;color:var(--akane);border:1px solid var(--line);border-radius:999px;padding:4px 12px">糸。</a></span></header>
<nav>
  <button id="tab-rev" class="on">今日の復習</button>

</nav>
<main id="main"></main>
<div id="pend"></div>

/* ================= STORAGE (keyed by card id — update-safe) =========
   goi_v1 = { cards:{id:{iv,e,r,due,at,imp?}}, sort:{id:"w"|"m"|"s"|"n"|"x"} (pending, not yet added),
              star:{id:at}, miss:{id:{n,at}}, cfg, lastBackup }                                  */
const KEY="goi_v1";
let canStore=true;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):{}}catch(e){canStore=false;return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false}}
let S=load();
S.cards=S.cards||{}; S.cfg=S.cfg||{}; S.sort=S.sort||{}; S.star=S.star||{}; S.miss=S.miss||{};
const DEF={dir:"je",furi:1,ff:0,proper:0,kana:0,auto:1,pace:3,cap:25,fdir:"je",flo:1,fhi:50};
for(const k in DEF) if(S.cfg[k]===undefined) S.cfg[k]=DEF[k];

const W=WORDS.map(a=>({id:a[0],l:a[1],k:a[2],r:a[3],g:a[4],grp:a[5],t:a[6],s:a[7],x:a[8]}));
const BY={}; W.forEach(w=>BY[w.id]=w);
const ORD={}; W.forEach((w,i)=>ORD[w.id]=i);
const DAY=864e5, now=()=>Date.now();
const st=id=>S.cards[id]||null;
const shown=w=>S.cfg.proper||w.t!=="名";

/* ================= SRS (same SM-2-lite as 文型の糸) =================
   Nothing enters on its own: a word is in the SRS only once YOU add it (一覧). */
function eod(){const d=new Date();d.setHours(23,59,59,999);return d.getTime()}
function dueIds(){const e=eod();
  const ids=W.filter(w=>{const c=st(w.id);return c&&c.due<=e}).map(w=>w.id);
  const rev=ids.filter(id=>st(id).r>0).sort((a,b)=>st(a).due-st(b).due);
  const fresh=ids.filter(id=>st(id).r===0).sort((a,b)=>ORD[a]-ORD[b]);
  return rev.concat(fresh);}
function addMiss(id){const m=S.miss[id]||{n:0};m.n=Math.min(9,(m.n||0)+1);m.at=now();S.miss[id]=m;}
function easeMiss(id){const m=S.miss[id];if(!m)return;m.n=Math.max(0,m.n-1);m.at=now();if(!m.n)delete S.miss[id];}
function grade(id,g){
  let c=st(id)||{iv:0,e:2.4,r:0};
  c.r++; c.at=now(); delete c.imp;
  if(g==4){c.iv=45+Math.random()*45;c.e=Math.max(c.e,2.8);c.due=now()+c.iv*DAY;easeMiss(id);}
  else if(g==0){c.iv=0;c.e=Math.max(1.6,c.e-0.2);c.due=now()+60*1000;addMiss(id);}
  else if(g==1){c.iv=Math.max(1,c.iv*1.2);c.due=now()+c.iv*DAY;}
  else if(g==2){c.iv=c.iv==0?1:c.iv*c.e;c.due=now()+c.iv*DAY;easeMiss(id);}
  else{c.iv=c.iv==0?3:c.iv*c.e*1.4;c.e+=0.1;c.due=now()+c.iv*DAY;easeMiss(id);}
  S.cards[id]=c;save();
}
function stage(c){if(!c)return 0;if(c.r===0)return 4;if(c.iv>=45)return 3;if(c.iv>=14)return 2;return 1}
const STAGE=["未追加","学習中","定着","🌳","新"];
const nigate=id=>(S.miss[id]&&S.miss[id].n>0);

/* ============ ADDING WORDS — per-word familiarity, staggered ============
   You sort each word: 🌳 しっかり ・ ○ だいたい ・ △ うろ覚え ・ ＋ learn as new ・ ✕ remove/clear.
   Nothing is scheduled until 追加. Then, for every sorted word:
     N   = the highest lesson you have anything from (already added or being added)
     age = (N − lesson)·P + U(0,P)          as if you met one lesson every P days (設定 → ペース)
     a   = age / (N·P)                        0 = your newest lesson … 1 = lesson 1
     due = lo + (hi − lo)·(0.1 + 0.9·a)·U(0.8,1)   inside the word's band:
           🌳 40–120 days ・ ○ 4–40 days ・ △ 1–8 days
   so known words land far out, shaky ones soon, and within each band older lessons sit further
   out than recent ones. Then a leveling pass caps total reviews per day (設定 → 1日の上限,
   counting reviews you already have) and pushes the overflow to the next free day.
   ＋ = a brand-new card, due now. ✕ on an added word removes it from the SRS. */
const FAM={w:{lo:40,hi:120,e:2.7,ic:"🌳",lab:"しっかり"},m:{lo:4,hi:40,e:2.4,ic:"○",lab:"だいたい"},s:{lo:1,hi:8,e:2.1,ic:"△",lab:"うろ覚え"}};
const SORTS=[["w","🌳"],["m","○"],["s","△"],["n","＋"],["x","✕"]];
function planAdds(){
  const pend=Object.entries(S.sort).filter(([id])=>BY[id]);
  if(!pend.length)return{plan:{},rm:[],fresh:[],n:0};
  const keep=pend.filter(([,f])=>f!=="x").map(([id])=>id);
  const ls=keep.map(id=>BY[id].l).concat(Object.keys(S.cards).filter(id=>BY[id]&&S.sort[id]!=="x").map(id=>BY[id].l));
  const N=Math.max(1,...ls), P=+S.cfg.pace||3, maxAge=N*P;
  const plan={}, fresh=[], rm=pend.filter(([,f])=>f==="x").map(([id])=>id);
  pend.forEach(([id,f])=>{
    if(f==="n"){fresh.push(id);return;}
    if(!FAM[f])return;
    const F=FAM[f], age=(N-BY[id].l)*P+Math.random()*P, a=Math.min(1,age/maxAge);
    plan[id]={due:F.lo+(F.hi-F.lo)*(0.1+0.9*a)*(0.8+0.2*Math.random()),e:F.e};});
  /* leveling against reviews you already have */
  const loadMap={}, t0=eod()-DAY;
  for(const id in S.cards){if(plan[id]||rm.includes(id)||fresh.includes(id))continue;
    const d=Math.max(0,Math.floor((S.cards[id].due-t0)/DAY));loadMap[d]=(loadMap[d]||0)+1;}
  const base=Object.assign({},loadMap), cap=+S.cfg.cap||25;
  Object.keys(plan).sort((a,b)=>plan[a].due-plan[b].due).forEach(id=>{
    let d=Math.floor(plan[id].due);while((loadMap[d]||0)>=cap)d++;loadMap[d]=(loadMap[d]||0)+1;
    if(d>plan[id].due)plan[id].due=d+Math.random()*0.9;plan[id].iv=plan[id].due;});
  return{plan,rm,fresh,n:pend.length,base,N};
}
function applyAdds(p){const t=now(),t0=eod()-DAY;
  for(const id in p.plan){const c=p.plan[id];S.cards[id]={iv:c.iv,e:c.e,r:1,due:t0+c.due*DAY,at:t,imp:1};}
  p.fresh.forEach(id=>{S.cards[id]={iv:0,e:2.4,r:0,due:t,at:t};});
  p.rm.forEach(id=>{delete S.cards[id];});
  S.sort={};save();}
function histo(p,days){const h=new Array(days).fill(0).map(()=>[0,0]);
  for(const d in (p.base||{}))if(+d<days)h[+d][0]+=p.base[d];
  for(const id in p.plan){const d=Math.floor(p.plan[id].due);if(d<days)h[d][1]++;}
  if(p.fresh.length)h[0][1]+=p.fresh.length;return h}

let JV=null,EV=null,currentU=null,unlocked=false,speakToken=0,noJa=false,voicesSettled=false;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
function pickVoices(){const vs=allVoices();
  const isJa=v=>v.lang.replace("_","-").startsWith("ja");
  JV=(S.cfg.jvURI&&vs.find(v=>v.voiceURI===S.cfg.jvURI))
     ||vs.find(v=>/Google/i.test(v.name)&&isJa(v))
     ||vs.find(v=>/Kyoko/i.test(v.name)&&isJa(v))
     ||vs.find(isJa)||null;
  EV=(S.cfg.evURI&&vs.find(v=>v.voiceURI===S.cfg.evURI))
     ||vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
     ||vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
     ||vs.find(v=>v.lang.startsWith("en"))||null;
  noJa=vs.length>0&&!JV;}
async function ensureVoices(){
  for(let i=0;i<20;i++){if(allVoices().length)break;await new Promise(r=>setTimeout(r,120));}
  pickVoices();voicesSettled=true;}
if(typeof speechSynthesis!=="undefined"){speechSynthesis.onvoiceschanged=()=>{pickVoices();};pickVoices();
  ensureVoices().then(()=>{if(noJa&&$("#main")&&!$("#ja-warn"))$("#main").insertAdjacentHTML("afterbegin",jaWarnHTML());});}

  ・<b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Japanese → download <b>Kyoko</b><br>
  ・<b>Windows:</b> Settings → Time &amp; Language → Language → add 日本語 (with Speech) — or use <b>Edge/Chrome</b><br>
  ・<b>Android:</b> Settings → Google Text-to-speech → install Japanese<br>
  ・<b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage voices → Japanese<br>
  Then reload, and check 設定 → 音声設定.</div>`}
function unlock(){if(unlocked)return;unlocked=true;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("あ");u.volume=0;u.rate=1;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener("touchstart",unlock,{once:true});

function speak(text,jp=true,rate=0.92,_retry=false,estLen=0){
  const myToken=++speakToken;
  return new Promise(async res=>{
    try{
      if(!voicesSettled)await ensureVoices();
      const busy=speechSynthesis.speaking||speechSynthesis.pending;
      if(busy)speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken!==speakToken)return res();
        pickVoices();
        const u=new SpeechSynthesisUtterance(text);
        currentU=u;
        u.lang=jp?"ja-JP":"en-US";
        let v=jp?JV:EV, r=jp?rate:1.0;
        if(_retry){r=1.0;
          if(jp){const alt=allVoices().find(x=>x.lang.replace("_","-").startsWith("ja")&&v&&x.localService!==v.localService);
                 if(alt)v=alt;}}
        if(v)u.voice=v;
        u.rate=Math.max(0.7,r); u.pitch=1;
        let done=false,started=false;
        const finish=()=>{if(done)return;done=true;clearInterval(kick);res();};
        u.onstart=()=>{started=true};
        u.onend=finish; u.onerror=finish;
        const est=600+Math.max(text.length,estLen||0)*(jp?185:75)/u.rate;
        setTimeout(finish,est+1500);
        setTimeout(()=>{
          if(!started&&!done&&!_retry){done=true;clearInterval(kick);
            try{speechSynthesis.cancel()}catch(e){}
            setTimeout(()=>speak(text,jp,1.0,true,estLen).then(res),160);}
        },1400);
        const kick=setInterval(()=>{try{speechSynthesis.resume()}catch(e){}},2500);
        speechSynthesis.speak(u);
        setTimeout(()=>{try{speechSynthesis.resume()}catch(e){}},120);
      },busy?230:40);
    }catch(e){res();}
  });
}

const kanaOf=m=>m.replace(/\{([^|}]+)\|([^|}]+)(\|!)?\}/g,"$2");
const stripSpk=s=>s.replace(/(^|[。？！」])\s*[AB]：/g,"$1、").replace(/^、/,"");
function sayEx(m,rate){const spoken=S.cfg.kana?kanaOf(m):m.replace(/\{([^|}]+)\|([^|}]+)\|!\}/g,"$2").replace(/\{([^|}]+)\|([^|}]+)\}/g,"$1");
  return speak(stripSpk(spoken),true,rate||0.92,false,stripSpk(kanaOf(m)).length);}

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}

/* ================= FLASH (cram — never touches the SRS schedule) =================
   Mini-SRS inside one session: a miss comes back ~3 cards later; after a miss you need it
   right TWICE in a row (the second check ~8 cards later) before it's cleared. A word you get
   right first time is cleared at once. Misses also feed 苦手 (and a clean pass eases it). */
const FSET={src:"all",kind:"all",n:0};
let F=null;
function flashPool(){const lo=Math.min(S.cfg.flo,S.cfg.fhi),hi=Math.max(S.cfg.flo,S.cfg.fhi);

    &&(FSET.src==="all"||(FSET.src==="added"&&st(w.id))||(FSET.src==="star"&&S.star[w.id])||(FSET.src==="nigate"&&(nigate(w.id)||S.star[w.id]))));}
function renderFlash(){pill();const m=$("#main");
  if(F&&F.q.length){flashCard();return;}

  m.innerHTML=`
  <p class="hint">Cram mode: pick a slice, shuffle, flip fast. Misses come back a few cards later until you get them twice in a row. Your 今日の復習 schedule isn't touched.</p>

    <div class="controls"><label>課</label><input type="number" id="f-lo" min="1" max="50" value="${S.cfg.flo}"> – <input type="number" id="f-hi" min="1" max="50" value="${S.cfg.fhi}"></div>

    <div class="chips" id="f-kind">${[["all","全種類"],["動","動詞"],["adj","形容詞"],["表","表現"],["other","名詞など"]].map(([k,v])=>`<button class="chip ${FSET.kind===k?"on":""}" data-v="${k}">${v}</button>`).join("")}</div>
    <div class="controls"><label>向き</label><select id="f-dir"><option value="je" ${S.cfg.fdir==="je"?"selected":""}>日→英</option><option value="ej" ${S.cfg.fdir==="ej"?"selected":""}>英→日</option><option value="mix" ${S.cfg.fdir==="mix"?"selected":""}>まぜる</option></select>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function startFlash(shuf,ids){
  let list=ids||flashPool().map(w=>w.id);

function flashCard(){const m=$("#main");

  $("#f-quit").onclick=()=>flashEnd(true);

  gr.children[1].onclick=()=>{F.q.shift();

function flashEnd(quit){const m=$("#main"),miss=Object.keys(F.missed);

    ws.forEach(w=>{if(st(w.id))return;if(k==="x")delete S.sort[w.id];else S.sort[w.id]=k;});save();paintList();pendBar();});
  paintListWire();}
function paintListWire(){document.querySelectorAll(".seg button").forEach(b=>{b.onclick=()=>{const id=b.dataset.id,k=b.dataset.s;
    if(S.sort[id]===k||(k==="x"&&!st(id)))delete S.sort[id];else S.sort[id]=k;save();
    b.parentNode.outerHTML=sortBtns(id);paintListWire();pendBar();};});}
function pendBar(){const bar=$("#pend"),ent=Object.values(S.sort);
  if(!ent.length){bar.classList.remove("open");return;}
  const c={};ent.forEach(k=>c[k]=(c[k]||0)+1);
  bar.innerHTML=`<span>保留 <b>${ent.length}</b>　${SORTS.filter(([k])=>c[k]).map(([k,ic])=>ic+c[k]).join(" ")}</span><span><button id="p-prev">プレビュー</button> <button class="go" id="p-add">追加</button></span>`;
  bar.classList.add("open");
  $("#p-prev").onclick=()=>previewAdds(false);$("#p-add").onclick=()=>previewAdds(true);}
function previewAdds(direct){const p=planAdds();if(!p.n)return;
  const h=histo(p,60),mx=Math.max(1,...h.map(x=>x[0]+x[1]));
  const nAdd=Object.keys(p.plan).length;
  $("#sheet-in").innerHTML=`<button class="x" id="sh-x">×</button><div style="font-family:'Shippori Mincho B1',serif;font-size:20px">追加プレビュー</div>
    <div class="hint" style="margin-top:6px">${nAdd?`${nAdd} words scheduled by familiarity`:""}${p.fresh.length?`${nAdd?" ・ ":""}${p.fresh.length} new (due now)`:""}${p.rm.length?` ・ ${p.rm.length} removed`:""} ・ spacing measured back from 第${p.N}課, one lesson per ${S.cfg.pace} days, ${S.cfg.cap>=9999?"no daily cap":"max "+S.cfg.cap+" reviews/day"}.</div>
    <div class="bars">${h.map((x,i)=>`<div class="stk" title="day ${i}: ${x[0]} + ${x[1]}"><i style="height:${Math.round(x[1]/mx*100)}%"></i><u style="height:${Math.round(x[0]/mx*100)}%"></u></div>`).join("")}</div>
    <div class="barlab"><span>今日</span><span>30日</span><span>60日</span></div>
    <div class="hint" style="margin-top:4px"><span style="color:var(--ai)">■</span> new adds ・ <span style="color:var(--line)">■</span> reviews you already have${Object.values(p.plan).filter(c=>c.due>=60).length?` ・ ${Object.values(p.plan).filter(c=>c.due>=60).length} land after 60 days`:""}</div>
    <div class="controls" style="justify-content:center;margin-top:14px"><button class="go" id="sh-ok">追加する</button><button id="sh-clear">保留をぜんぶ消す</button></div>`;
  $("#sheet").classList.add("open");
  $("#sh-x").onclick=closeSheet;$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
  $("#sh-ok").onclick=()=>{applyAdds(p);closeSheet();pendBar();pill();if(curTab==="list")paintList();toast("追加しました！");};
  $("#sh-clear").onclick=()=>{if(!confirm("保留を消しますか？ (added words are not affected)"))return;S.sort={};save();closeSheet();pendBar();if(curTab==="list")renderList();};}
function openSheet(id){const w=BY[id],c=st(id);
  $("#sheet-in").innerHTML=`<button class="x" id="sh-x">×</button><div class="${furiClass()}" id="sh-c">${headHTML(w,true)}
    <div class="row"><button id="sh-w">🔊 ことば</button><button id="sh-ws">🐢</button>${starBtn(id)}</div>${badges(w)}${glossHTML(w)}${exHTML(w,8)}
    <div class="row"><span class="hint">${c?`${STAGE[stage(c)]} ・ interval ${Math.round(c.iv)}d ・ next ${c.due<=eod()?"今日":new Date(c.due).toLocaleDateString()}`:"未追加 — sort it with the buttons in the list"}${nigate(id)?` ・ 苦手 ×${S.miss[id].n}`:""}</span></div></div>`;
  $("#sheet").classList.add("open");
  $("#sh-x").onclick=closeSheet;$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
  $("#sh-w").onclick=()=>sayWord(w);$("#sh-ws").onclick=()=>sayWord(w,0.72);wireEx($("#sh-c"),w);wireStars($("#sh-c"));}
function closeSheet(){$("#sheet").classList.remove("open");try{speechSynthesis.cancel()}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600);}

/* ================= SETTINGS ================= */
function renderSettings(){pill();const m=$("#main");
  const added=Object.keys(S.cards).length;
  m.innerHTML=`
    <div class="sec">カード CARDS</div>
    <div class="controls"><label>向き (今日の復習)</label><select id="s-dir"><option value="je" ${S.cfg.dir==="je"?"selected":""}>日→英 (read)</option><option value="ej" ${S.cfg.dir==="ej"?"selected":""}>英→日 (say)</option><option value="mix" ${S.cfg.dir==="mix"?"selected":""}>まぜる</option></select></div>
    <div class="controls"><label><input type="checkbox" id="s-ff" ${S.cfg.ff?"checked":""}> 表面にもよみ (reading on the front)</label></div>
    <div class="controls"><label><input type="checkbox" id="s-furi" ${S.cfg.furi?"checked":""}> 例文にふりがな</label><label><input type="checkbox" id="s-kana" ${S.cfg.kana?"checked":""}> 例文をかなで読む</label></div>
    <div class="controls"><label><input type="checkbox" id="s-auto" ${S.cfg.auto?"checked":""}> 自動再生</label><label><input type="checkbox" id="s-prop" ${S.cfg.proper?"checked":""}> 名前・地名も表示</label></div>
    <div class="sec">追加のしかた ADDING</div>
    <div class="controls"><label>ペース 1課 =</label><select id="s-pace">${[2,3,4,5,7].map(p=>`<option value="${p}" ${S.cfg.pace==p?"selected":""}>${p}日</option>`).join("")}</select>
      <label>1日の上限</label><select id="s-cap">${[15,25,40,60,100,200,9999].map(c=>`<option value="${c}" ${S.cfg.cap==c?"selected":""}>${c==9999?"なし":c}</option>`).join("")}</select></div>
    <div class="note">Words only enter your reviews when you add them in <b>一覧</b>. Sorted words are spaced by how well you know them (🌳 40–120 days, ○ 4–40, △ 1–8), older lessons further out — measured back from the highest lesson you've added, as if you met one lesson every <b>ペース</b> days — and no day gets more than the <b>上限</b>. ＋ words come in as new cards right away. ${added} / ${W.length} words added.</div>
    <div class="sec">音声設定 VOICE</div>
    ${noJa?jaWarnHTML():""}
    <div class="controls"><select id="v-ja">${allVoices().filter(v=>v.lang.replace("_","-").startsWith("ja")).map(v=>`<option value="${v.voiceURI}" ${JV&&v.voiceURI===JV.voiceURI?"selected":""}>🇯🇵 ${v.name}</option>`).join("")||'<option value="">— no Japanese voices —</option>'}</select><button id="v-jtest">テスト</button></div>
    <div class="controls"><select id="v-en">${allVoices().filter(v=>v.lang.startsWith("en")).map(v=>`<option value="${v.voiceURI}" ${EV&&v.voiceURI===EV.voiceURI?"selected":""}>🎙 ${v.name}</option>`).join("")||'<option value="">— no English voices —</option>'}</select><button id="v-etest">test</button><button id="v-reset">音声リセット</button></div>
    <div class="sec">バックアップ BACKUP</div>
    <div class="controls"><button id="b-exp">進捗をコピー</button><button id="b-imp">進捗を貼り付け</button></div>
    <div class="note">Progress saves in this browser only. Copy it somewhere safe now and then — or use ぜんぶコピー on the <a href="index.html" style="color:var(--akane)">糸。hub</a>, which backs up every app at once. Pasting merges: newer progress always wins.</div>
    <div class="sec">リセット</div>
    <div class="controls"><button id="b-nig">苦手リストを空にする</button><button id="b-wipe">語彙の糸の進捗をすべて消す</button></div>${storeNote()}`;
  $("#s-dir").onchange=e=>{S.cfg.dir=e.target.value;save();};
  $("#s-ff").onchange=e=>{S.cfg.ff=e.target.checked?1:0;save();};
  $("#s-furi").onchange=e=>{S.cfg.furi=e.target.checked?1:0;save();};
  $("#s-kana").onchange=e=>{S.cfg.kana=e.target.checked?1:0;save();};
  $("#s-auto").onchange=e=>{S.cfg.auto=e.target.checked?1:0;save();};
  $("#s-prop").onchange=e=>{S.cfg.proper=e.target.checked?1:0;save();};
  $("#s-pace").onchange=e=>{S.cfg.pace=+e.target.value;save();};
  $("#s-cap").onchange=e=>{S.cfg.cap=+e.target.value;save();};
  $("#v-ja").onchange=e=>{S.cfg.jvURI=e.target.value;save();pickVoices();};
  $("#v-en").onchange=e=>{S.cfg.evURI=e.target.value;save();pickVoices();};
  $("#v-jtest").onclick=()=>speak("こんにちは。語彙の糸へようこそ。",true);
  $("#v-etest").onclick=()=>speak("Hello! English voice check.",false);
  $("#v-reset").onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}setTimeout(()=>speak("リセットしました。",true,1.0),250);};
  $("#b-exp").onclick=async()=>{const t=JSON.stringify(S);S.lastBackup=now();save();try{await navigator.clipboard.writeText(t);alert("コピーしました！ Saved to clipboard.")}catch(e){prompt("Copy this:",t)}};
  $("#b-imp").onclick=()=>{const t=prompt("Paste your saved 語彙の糸 progress:");if(!t)return;
    try{const p=JSON.parse(t);if(p&&p.cards){mergeIn(p);save();alert("復元しました！ Merged — newer progress kept.");renderSettings();}
      else alert("形式が違うみたいです。")}catch(e){alert("読み込めませんでした。")}};
  $("#b-nig").onclick=()=>{if(confirm("苦手リストを空にしますか？ (★ stay)")){S.miss={};save();}};
  $("#b-wipe").onclick=()=>{if(confirm("語彙の糸の進捗をすべて消しますか？ (other apps are untouched)")&&confirm("本当に？ This can't be undone.")){S.cards={};S.sort={};S.miss={};save();renderSettings();pendBar();}};}
function mergeIn(p){
  const newer=(a,b)=>!a||((b&&b.at)||0)>((a&&a.at)||0);
  for(const id in (p.cards||{}))if(newer(S.cards[id],p.cards[id]))S.cards[id]=p.cards[id];
  for(const id in (p.miss||{}))if(newer(S.miss[id],p.miss[id]))S.miss[id]=p.miss[id];
  for(const id in (p.star||{}))S.star[id]=S.star[id]||p.star[id];
  S.cfg=Object.assign({},p.cfg||{},S.cfg);}

function storeNote(){return canStore?"":`<div class="note">⚠ This preview can't save progress. Open the hosted site so your schedule persists.</div>`}
function backupNote(){
  if(Object.keys(S.cards).length<30)return"";
  let hub=0;try{hub=+localStorage.getItem("ito_lastBackup")||0}catch(e){}
  const last=Math.max(S.lastBackup||0,hub), d=last?Math.floor((now()-last)/DAY):null;
  if(d!==null&&d<10)return"";
  return `<div class="note" style="border-color:var(--akane)">🧵 <b>バックアップのすすめ</b> — progress lives only in this browser. 設定 → 進捗をコピー, or ぜんぶコピー on the 糸。 hub. ${d===null?"(Never backed up.)":`(Last backup: ${d} days ago.)`}</div>`}

window.__goi={WORDS:W,get S(){return S},planAdds,applyAdds,histo,dueIds,grade,flashPool,get F(){return F}};
setTab("rev");
})();
</script>
<script>
/* auto-updater: fetch a fresh copy (cache-bypassed); if the server's APPV differs,
   navigate to it. Own sessionStorage key (itoUpdGoi). Same origin → progress untouched. */
(function(){var APPV="2026.11.14-3";
try{if(sessionStorage.getItem("itoUpdGoi")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("itoUpdGoi",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
