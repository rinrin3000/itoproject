<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>速習の糸 — Cram Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ad-gap:84px;
  --paper:#EFF1EE; --card:#FAFBF8;
  --ink:#1C2B4A; --ink-soft:#3A4A6B; --muted:#67748F;
  --thread:#B9C4D6; --thread-soft:#D6DDE8;
  --seal:#C43D38; --seal-deep:#A32F2B;
  --kon:#2E4A7D; --kon-soft:#E3E8F3;      /* this app's accent — 紺 */
  --moss:#4F7A46; --moss-soft:#E4EEE2;    /* got it */
  --lav:#7B6BAF; --lav-bg:#EDEAF6;        /* JLPT, matching 漢字の糸 */
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif; min-height:100dvh;
  background-image:linear-gradient(var(--thread-soft) 1px, transparent 1px);
  background-size:100% 44px; background-attachment:fixed;
}
.jp{font-family:"Shippori Mincho B1","Zen Kaku Gothic New",serif}

header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:760px;margin:0 auto}
.masthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.masthead h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.masthead .sub{font-size:.72rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.hublink{margin-left:auto;text-decoration:none;font-family:"Shippori Mincho B1",serif;font-size:.95rem;
  color:var(--seal);border:1.5px solid var(--thread);border-radius:999px;padding:4px 13px;background:var(--card)}
.stats{font-size:.72rem;color:var(--muted);margin-top:2px}

main{max-width:760px;margin:0 auto;padding:6px 16px calc(var(--ad-gap) + 60px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

.deckrow{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.deckrow::-webkit-scrollbar{display:none}
.deck{flex:1;min-width:74px;border:1.5px solid var(--thread);background:var(--card);color:var(--muted);
  border-radius:var(--radius);padding:9px 4px;font-size:.82rem;font-weight:700;font-family:inherit;cursor:pointer;
  font-family:"Shippori Mincho B1",serif}
.deck.on{background:var(--kon);border-color:var(--kon);color:var(--paper)}

.searchrow{margin-top:10px;display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;border:1.5px solid var(--thread);background:var(--card);
  border-radius:var(--radius);padding:10px 14px;font-size:1rem;color:var(--ink);font-family:inherit;outline:none}
.searchrow input:focus{border-color:var(--kon)}
.searchrow input::placeholder{color:#9AA6BC}
.btn{border:1.5px solid var(--thread);background:var(--card);color:var(--ink-soft);border-radius:var(--radius);
  padding:0 13px;font-size:.85rem;font-family:inherit;font-weight:700;cursor:pointer;min-height:42px}
.btn:active{background:var(--kon-soft)}

.rowlab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--thread);background:var(--card);color:var(--muted);border-radius:999px;
  padding:7px 13px;font-size:.78rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.nchip.on{background:var(--lav);border-color:var(--lav)}
.chip.fchip.on{background:var(--kon);border-color:var(--kon)}
#lrange{flex:none;width:96px;border:1.5px solid var(--thread);background:var(--card);border-radius:999px;
  padding:7px 12px;font-size:.78rem;font-weight:700;color:var(--ink);font-family:inherit;outline:none;text-align:center}
#lrange:focus{border-color:var(--kon)}
#lrange::placeholder{color:#9AA6BC;font-weight:400}
select{border:1.5px solid var(--thread);background:var(--card);color:var(--ink);border-radius:var(--radius);
  padding:8px 10px;font-size:.8rem;font-family:inherit;font-weight:700;outline:none}
.selrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sortrow{display:flex;gap:6px;margin-top:10px}
.seg{flex:1;border:1.5px solid var(--thread);background:var(--card);color:var(--muted);border-radius:var(--radius);
  padding:8px 0;font-size:.78rem;font-weight:700;font-family:inherit;cursor:pointer}
.seg.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.gobar{position:sticky;bottom:calc(var(--ad-gap) - 34px);z-index:20;padding-top:12px}
.go{width:100%;border:none;background:var(--kon);color:var(--paper);border-radius:var(--radius);
  padding:15px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 3px 0 #22355c}
.go:disabled{background:var(--thread);color:var(--card);box-shadow:none}
.go:active{transform:translateY(1px)}

.hit{border:1.5px solid var(--thread);background:var(--card);border-radius:var(--radius);padding:10px 12px;
  margin-bottom:8px;cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hit .w{font-family:"Shippori Mincho B1",serif;font-size:1.15rem;font-weight:700}
.hit .r{color:var(--seal);font-size:.85rem}
.hit .m{color:var(--muted);font-size:.85rem;flex:1;min-width:120px}
.tag{font-size:.65rem;border-radius:6px;padding:1px 5px;align-self:center;white-space:nowrap}
.ltag{color:var(--muted);border:1px solid var(--thread-soft)}
.ntag{color:var(--lav);background:var(--lav-bg);font-weight:700}
.gtag{color:var(--kon);background:var(--kon-soft);font-weight:700}
.startag{color:#B8860B;background:#F7F0DA;font-weight:700}
.empty{color:var(--muted);font-size:.9rem;padding:24px 4px;text-align:center;line-height:1.7}
.note{border:1.5px dashed var(--thread);border-radius:var(--radius);padding:11px 13px;margin-top:12px;
  font-size:.75rem;color:var(--muted);line-height:1.75}
.morebtn{width:100%;margin-top:4px}

/* ---------- flashcards ---------- */
.flash{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(var(--ad-gap) + 12px + env(safe-area-inset-bottom))}
.flash-top{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto}
.flash-top .spacer{flex:1;text-align:center;font-size:.78rem;color:var(--muted);font-weight:700}
.bar{height:3px;background:var(--thread-soft);border-radius:2px;max-width:560px;width:100%;margin:8px auto 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kon);width:0;transition:width .25s}
.flash-stage{flex:1;display:grid;place-items:center;max-width:560px;width:100%;margin:0 auto;perspective:1400px;padding:10px 0}
.fc{width:100%;max-width:430px;aspect-ratio:5/6;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.4,1)}
.fc.flipped{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1.5px solid var(--thread);background:var(--card);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px;text-align:center;box-shadow:0 4px 0 var(--thread-soft);overflow:auto}
.fface.back{transform:rotateY(180deg)}
.cue{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.askform{font-family:"Shippori Mincho B1",serif;font-size:1rem;font-weight:700;color:var(--paper);
  background:var(--kon);border-radius:999px;padding:4px 15px}
.fc-main{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:2.5rem;line-height:1.3;word-break:keep-all}
.fc-main.long{font-size:1.75rem}
.fc-main.xlong{font-size:1.25rem;line-height:1.55}
.fc-read{color:var(--seal);font-size:1.25rem;font-weight:700}
.fc-mean{color:var(--ink-soft);font-size:1rem;line-height:1.55}
.fc-sub{color:var(--muted);font-size:.82rem;line-height:1.6}
.fc-ex{font-family:"Shippori Mincho B1",serif;font-size:1rem;color:var(--ink);line-height:1.7;
  border-top:1px solid var(--thread-soft);padding-top:10px;margin-top:2px;width:100%}
.fc-ex small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--muted);font-size:.76rem;margin-top:3px}
.fc-note{font-size:.78rem;color:var(--ink-soft);background:var(--kon-soft);border-radius:8px;padding:8px 11px;
  line-height:1.65;text-align:left;width:100%}
.fc-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fc-hint{font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.flash-nav{display:flex;gap:8px;max-width:560px;width:100%;margin:8px auto 0}
.flash-nav .btn{flex:1;min-height:50px;font-size:1rem}
.judge{display:flex;gap:8px;max-width:560px;width:100%;margin:8px auto 0}
.judge button{flex:1;min-height:52px;border:none;border-radius:var(--radius);font-family:inherit;
  font-size:.95rem;font-weight:700;color:var(--paper);cursor:pointer}
.j-no{background:var(--seal);box-shadow:0 3px 0 var(--seal-deep)}
.j-ok{background:var(--moss);box-shadow:0 3px 0 #3B5D34}
.judge button:active{transform:translateY(1px)}
.starbtn.on{background:#F7F0DA;border-color:#D9C48A;color:#8A6D1F}
.done{text-align:center;padding:30px 6px}
.done h2{font-family:"Shippori Mincho B1",serif;font-size:1.6rem;margin-bottom:8px}
.score{font-size:2.4rem;font-family:"Shippori Mincho B1",serif;font-weight:700;color:var(--kon);margin:10px 0}
.done .btn{width:100%;margin-top:8px;min-height:48px}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
@media (max-width:400px){.fc-main{font-size:2.1rem}.deck{font-size:.76rem;min-width:64px}}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <h1 class="jp">速習の糸</h1>
    <div>
      <div class="sub">Cram Threads · flip &amp; drill</div>
      <div class="stats" id="stats"></div>
    </div>
    <a class="hublink jp" href="index.html" title="Back to the Ito hub">糸。</a>
  </div>
</header>

<main>
  <div class="deckrow" id="deckRow">
    <button class="deck on" data-d="word">単語</button>
    <button class="deck" data-d="gram">文法</button>
    <button class="deck" data-d="verb">動詞</button>
    <button class="deck" data-d="adj">形容詞</button>
    <button class="deck" data-d="star">★ 印</button>
  </div>

  <div class="searchrow">
    <input id="search" type="search" placeholder="Search — kanji, kana, English, L11-12, N3…" autocomplete="off">
    <button class="btn" id="clearBtn">全</button>
  </div>

  <div id="filtWrap">
    <div class="rowlab">範囲 · RANGE</div>
    <div class="chips" id="filterRow"></div>
  </div>

  <div id="optWrap"></div>

  <div class="rowlab">並び順 · ORDER</div>
  <div class="sortrow" id="sortRow">
    <button class="seg on" data-sort="course">出題順</button>
    <button class="seg" data-sort="kana">五十音</button>
    <button class="seg" data-sort="rand">ランダム</button>
  </div>

  <div class="rowlab">音声 · AUDIO</div>
  <div class="chips"><button class="chip fchip" id="autoChip">答えを自動で読む</button></div>

  <div class="gobar"><button class="go" id="goBtn">▶ フラッシュカード</button></div>

  <div id="hits"></div>
  <div class="empty hidden" id="noHits"></div>
</main>

<div class="flash hidden" id="flashView">
  <div class="flash-top">
    <button class="btn" id="fExit">✕</button>
    <span class="spacer" id="fCount"></span>
    <button class="btn starbtn" id="fStar" title="Star this card">★</button>
    <button class="btn" id="fShuf" title="Shuffle">⇄</button>
  </div>
  <div class="bar"><i id="fBar"></i></div>
  <div class="flash-stage" id="fStage">
    <div class="fc" id="fCard">
      <div class="fface front" id="fFront"></div>
      <div class="fface back" id="fBack"></div>
    </div>
  </div>
  <div class="flash-nav" id="fNav">
    <button class="btn" id="fPrev">←</button>
    <button class="btn" id="fSpeak">🔊</button>
    <button class="btn" id="fNext">→</button>
  </div>
  <div class="judge hidden" id="fJudge">
    <button class="j-no" id="fNo">× あやふや</button>
    <button class="j-ok" id="fOk">○ できた</button>
  </div>
</div>

"G160|s1|17|4|ない形 (nai-form)|the plain negative form|G1: い-row→あ-row+ない (う→わ) ・ G2: －る+ない ・ G3: しない/来ない|書かない・食べない・しない|not writing, not eating|買います → 買わない (わ, not あ). あります → ない (irregular).",
"G161|s1|17|4|Vないでください|please don't do V|Vない + でください|ここに車を止めないでください。|Please don't park here.|Softer than てはいけません.",
"G162|s1|17|4|Vなければなりません|must do V|Vない (drop い) + ければなりません|薬を飲まなければなりません。|I have to take medicine.|Literally \"if not doing it, it won't do\". No choice implied. Casual: 〜なきゃ.",
"G163|s1|17|4|Vなくてもいいです|don't have to do V|Vない (drop い) + くてもいいです|あした来なくてもいいです。|You don't have to come tomorrow.|The exact opposite of なければなりません. Don't confuse with てはいけません (must not).",
"G164|s1|17|4|N までに|by (deadline)|N/V辞書 + までに|5時までに帰ります。|I'll be back by 5.|までに = deadline (by). まで = continuation (until). One kana, opposite meanings.",
"G165|s1|18|4|辞書形 (dictionary form)|the plain non-past form|G1: い-row→う-row ・ G2: －ます+る ・ G3: する/来る|書く・食べる・する|to write, to eat, to do|置きます→置く (G1) but 起きます→起きる (G2). Same sound, different group.",
"G166|s1|18|4|Vることができます|can do V|V辞書 + ことができます|日本語を話すことができます。|I can speak Japanese.|More formal than the potential form. Object takes を before こと.",
"G167|s1|18|4|趣味はVることです|my hobby is doing V|趣味は V辞書 + ことです|趣味は音楽を聞くことです。|My hobby is listening to music.|こと turns the whole verb phrase into a noun.",
"G168|s1|18|4|Vるまえに|before doing V|V辞書 + まえに ・ N の + まえに ・ 期間 + まえに|寝るまえに、本を読みます。|I read a book before going to bed.|ALWAYS dictionary form before まえに — even when the sentence is past tense.",
"G169|s1|19|4|た形 (ta-form)|the plain past form|Same shape as て形, with た/だ|書いた・食べた・した|wrote, ate, did|If you can build て形 you already know た形 — just swap て→た, で→だ.",
"G170|s1|19|4|Vたことがあります|have done V before (experience)|Vた + ことがあります|富士山に登ったことがあります。|I have climbed Mt Fuji.|Experience, not simple past. Never for something you did yesterday.",
"G171|s1|19|4|Vたり、Vたりします|do things like V and V|Vた + り、Vた + り します|日曜日は掃除したり、洗濯したりします。|On Sundays I do things like clean and do laundry.|A SAMPLE list, not a full sequence. Tense sits on the final します.",
"G172|s1|19|4|い-adj く なります|become ～|いA(－い) + く なります|寒くなりました。|It has got cold.|な-adj/N take に: 元気になりました / 医者になりました.",
"G173|s1|20|4|普通形 (plain form)|plain / casual style|行く・行かない・行った・行かなかった ・ N だ ・ なA だ ・ いA い|あした京都へ行く。|I'm going to Kyoto tomorrow.|な-adj and N need だ in plain style: 元気だ / 学生だ. い-adj takes NO だ.",
"G174|s1|20|4|〜けど|but (casual)|普通形 + けど|行きたいけど、時間がない。|I want to go, but I have no time.|Casual が. Also softens a request: すみませんけど…",
"G175|s1|21|4|普通形と思います|I think that ～|普通形 + と思います|田中さんはもう帰ったと思います。|I think Mr Tanaka has already gone home.|Always plain form before と, even in polite speech. な-adj/N need だ: 便利だと思います.",
"G176|s1|21|4|普通形と言いました|said that ～|普通形 + と言いました|「あした来る」と言いました。|He said he would come tomorrow.|Quoted content stays plain. と言っていました for reporting someone else's words.",
"G177|s1|21|4|〜でしょう?|right? / don't you think?|普通形 + でしょう (rising)|あしたは雨でしょう?|It'll rain tomorrow, won't it?|Rising = seeking agreement. Falling = a guess/prediction.",
"G178|s1|21|4|Nについて|about / concerning N|N について|日本の経済について研究しています。|I'm researching the Japanese economy.|Formal topic marker. Everyday speech often just uses の話.",
"G179|s1|22|4|名詞修飾 (noun modification)|a clause describing a noun|普通形 (clause) + N|これは京都で撮った写真です。|This is a photo I took in Kyoto.|The clause goes BEFORE the noun — the reverse of English relative clauses. Subject inside the clause takes が, not は.",
"G180|s1|23|4|Vるとき／Vたとき|when ～|V辞書/Vた/いA/なAな/Nの + とき|日本へ行くとき、カメラを買いました。|I bought a camera when I went to Japan.|辞書形 = before the main action; た形 = after it. 行くとき買った = bought on the way there.",
"G181|s1|23|4|Vると、〜|whenever/if V, then (automatic result)|V辞書 + と|このボタンを押すと、お釣りが出ます。|If you press this button, change comes out.|Inevitable, automatic results only. The second clause can NEVER be a request, invitation or intention.",
"G182|s1|24|4|くれます|(someone) gives me|person が わたしに N を くれます|山田さんがお土産をくれました。|Mr Yamada gave me a souvenir.|Direction is fixed: くれる always points TOWARD the speaker. Never わたしがくれます.",
"G183|s1|24|4|Vてくれます／もらいます／あげます|do V for someone / have V done for me|Vて + くれます・もらいます・あげます|友達が手伝ってくれました。|A friend helped me out.|てあげます can sound patronising to a superior — use ましょうか instead.",
"G184|s1|25|4|Vたら、〜|if/when ～ (conditional)|Vた + ら|雨が降ったら、行きません。|If it rains, I won't go.|The most flexible conditional. Unlike と, the second clause CAN be a request or intention.",
"G185|s1|25|4|Vても、〜|even if ～|Vて + も ・ いA(－い)くても ・ なA/N でも|雨が降っても、行きます。|Even if it rains, I'll go.|The result is the opposite of what you'd expect. Pairs with たとえ.",
"G201|s2|26|4|〜んです|explaining / asking for an explanation|普通形 + んです (なA/N は 〜な + んです)|どうして遅れたんですか。|Why were you late?|Adds an explanatory colour: \"the reason is...\". な-adj and N insert な: 元気なんです / 病気なんです.",
"G202|s2|26|4|Vていただけませんか|Could you please ～? (very polite)|Vて + いただけませんか|ちょっと教えていただけませんか。|Could you please show me?|Politer than てください. Ladder: てください < てくださいませんか < ていただけませんか.",
"G203|s2|26|4|Vたらいいですか|What should I do? / How should I ～?|Vた + らいいですか|どこで買ったらいいですか。|Where should I buy it?|Asking for advice or instructions, not permission.",
"G204|s2|27|4|可能形 (potential form)|can do V|G1: う-row→え-row + る ・ G2: －る + られる ・ G3: できる/来られる|日本語が話せます。|I can speak Japanese.|The object switches from を to が: パンを食べます → パンが食べられます.",
"G205|s2|27|4|見えます／聞こえます|be visible / be audible (spontaneous)|N が 見えます・聞こえます|窓から海が見えます。|You can see the sea from the window.|Not a choice — it just enters your senses. 見られます = you can arrange to see it.",
"G206|s2|27|4|しか〜ません|only ～ (nothing but)|N しか + NEGATIVE|100円しかありません。|I only have 100 yen.|しか ALWAYS takes a negative verb, and carries a \"that's not much\" feeling. だけ is neutral.",
"G207|s2|28|4|Vながら、〜|while doing V (two actions, one person)|Vます stem + ながら|音楽を聞きながら、勉強します。|I study while listening to music.|The MAIN action is the second verb. Both actions must have the same subject.",
"G208|s2|28|4|〜し、〜し、〜|and what's more ～ (piling up reasons)|普通形 + し|安いし、おいしいし、あの店へよく行きます。|It's cheap and tasty, so I often go to that shop.|Lists reasons, implying there are more. Stronger than て for justification.",
"G209|s2|28|4|Vています (habit)|do V regularly (habitual)|Vて + います|毎朝ジョギングをしています。|I jog every morning.|Repeated habit over a period, not right now.",
"G210|s2|29|4|Vています (resultant state)|is in the state of having V-ed|自動詞 て + います|窓が閉まっています。|The window is closed.|Uses the INTRANSITIVE verb. Describes how things are, with no agent in view.",
"G211|s2|29|4|Vてしまいました|did V completely / did V by mistake|Vて + しまいました|財布を落としてしまいました。|I've gone and dropped my wallet.|Two flavours: finishing something off, or regret. Casual: 〜ちゃった.",
"G212|s2|29|4|自動詞・他動詞|intransitive vs transitive pairs|閉まる/閉める, 開く/開ける, つく/つける, 入る/入れる, 出る/出す|ドアが開きます ↔ ドアを開けます。|The door opens ↔ I open the door.|Intransitive takes が (it happens); transitive takes を (someone does it).",
"G213|s2|30|4|Vてあります|has been done (deliberately, and left that way)|他動詞 て + あります|壁に地図がはってあります。|A map has been put up on the wall.|Someone did it ON PURPOSE and left it. Uses the TRANSITIVE verb but the object takes が.",
"G214|s2|30|4|Vておきます|do V in advance / leave it as it is|Vて + おきます|旅行のまえに、切符を買っておきます。|I'll buy the tickets before the trip.|Preparation for something coming later. Casual: 〜とく.",
"G215|s2|31|4|意向形 (volitional form)|let's ～ (plain)|G1: う-row→お-row + う ・ G2: －る + よう ・ G3: しよう/来よう|行こう・食べよう・しよう|let's go, let's eat|The plain-style ましょう. Also the base for ようと思います.",
"G216|s2|31|4|Vようと思っています|I'm thinking of doing V|意向形 + と思っています|来年、留学しようと思っています。|I'm thinking of studying abroad next year.|ています = a decision you've been holding for a while. と思います = decided just now.",
"G217|s2|31|4|Vるつもりです|I intend to do V|V辞書/Vない + つもりです|来月、車を買うつもりです。|I intend to buy a car next month.|A firm personal intention. 予定です = a fixed, scheduled plan.",
"G218|s2|31|4|まだVていません|haven't done V yet|まだ + Vて + いません|昼ご飯はまだ食べていません。|I haven't eaten lunch yet.|Never まだ食べませんでした — \"not yet\" is an ongoing state.",
"G219|s2|32|4|Vたほうがいいです|had better do V|Vた + ほうがいいです ・ Vない + ほうがいいです|薬を飲んだほうがいいです。|You'd better take medicine.|Positive uses た形; negative uses ない形. Mixing them up is the classic slip.",
"G220|s2|32|4|〜でしょう (probability)|probably ～|普通形 + でしょう (なA/N drop だ)|あしたは雪が降るでしょう。|It will probably snow tomorrow.|Falling intonation = a prediction. たぶん often accompanies it.",
"G221|s2|32|4|〜かもしれません|might ～|普通形 + かもしれません (なA/N drop だ)|事故があったかもしれません。|There might have been an accident.|Lower certainty than でしょう. Roughly 50/50.",
"G222|s2|33|4|命令形・禁止形|do it! / don't do it!|G1: う-row→え-row ・ G2: －る+ろ ・ G3: しろ/来い ・ 禁止: V辞書 + な|急げ! ・ 入るな!|Hurry! / Don't enter!|Very rough — signs, sports, angry orders, and reporting what a sign says.",
"G223|s2|33|4|〜と書いてあります／という意味です|it says ～ / it means ～|「～」と 書いてあります・読みます・いう意味です|あれは「危険」という意味です。|That means \"danger\".|と quotes the exact content; いう introduces a name or meaning.",
"G224|s2|33|4|Vなさい|do V (instructional command)|Vます stem + なさい|よく考えなさい。|Think it over carefully.|Parent-to-child, teacher-to-student, and exam instructions. Softer than 命令形.",
"G225|s2|34|4|Vとおりに|just as / exactly the way V|V辞書/Vた + とおりに ・ N の + とおりに|わたしがやるとおりに、やってください。|Do it exactly the way I do.|辞書形 = as I'm about to show you; た形 = as I showed you.",
"G226|s2|34|4|Vたあとで|after doing V|Vた + あとで ・ N の + あとで|仕事のあとで、飲みに行きます。|I'll go for a drink after work.|Always た形 before あとで. てから stresses order more strongly.",
"G227|s2|34|4|Vないで、〜|without doing V / instead of V-ing|Vない + で|朝ご飯を食べないで、学校へ行きました。|I went to school without eating breakfast.|Describes HOW the main action happened. Not a reason — that's なくて.",
"G228|s2|35|3|条件形 (ば形)|if ～ (conditional)|G1: う-row→え-row + ば ・ G2: －る + れば ・ G3: すれば/来れば ・ いA: －い + ければ|安ければ、買います。|If it's cheap, I'll buy it.|Focuses on the CONDITION itself. If the second clause is a request, the first clause can't be an action verb.",
"G229|s2|35|3|Nなら、〜|if it's N (you're talking about) ～|N + なら ・ 普通形 + なら|温泉なら、箱根がいいですよ。|If it's hot springs you want, Hakone is good.|Picks up the topic the OTHER person just raised, then advises on it.",
"G230|s2|36|3|Vるように、〜|so that ～ (aim)|V辞書/Vない (potential or intransitive) + ように|よく見えるように、前に座ります。|I sit at the front so I can see well.|The ように clause states a goal you can't fully control; the second clause is the effort.",
"G231|s2|36|3|Vるようになりました|have come to be able to V|V辞書/可能形 + ようになりました|日本語が話せるようになりました。|I've become able to speak Japanese.|A CHANGE over time. Negative: 〜なくなりました.",
"G232|s2|36|3|Vようにしています|make an effort to V regularly|V辞書/Vない + ようにしています|毎日運動するようにしています。|I try to exercise every day.|An ongoing habit you impose on yourself. ようにします = decide to start now.",
"G233|s2|37|3|受身形 (passive form)|be V-ed|G1: あ-row + れる ・ G2: －る + られる ・ G3: される/来られる|わたしは先生にほめられました。|I was praised by the teacher.|Agent takes に. G2 potential and passive look IDENTICAL — context decides.",
"G234|s2|37|3|Nによって〜られました|was V-ed by N (creator)|N によって + 受身|この絵はピカソによって描かれました。|This picture was painted by Picasso.|によって for creators/discoverers. で for materials: 紙で作られています.",
"G235|s2|37|3|迷惑の受身|adversative passive (suffering)|わたしは person に thing を 受身|雨に降られました。|I got rained on.|Japanese passive can express being INCONVENIENCED — no English equivalent. どろぼうに財布を取られました.",
"G236|s2|38|3|Vるのが好きです|like doing V|V辞書 + の が 好き・上手・下手|絵をかくのが好きです。|I like drawing.|の nominalises the verb. こと also works here, but の is preferred with feelings and senses.",
"G237|s2|38|3|Vるのを忘れました|forgot to do V|V辞書 + の を 忘れました・知っています|かぎをかけるのを忘れました。|I forgot to lock the door.|Verbs of perception and memory take の, not こと.",
"G238|s2|38|3|Vるのは〜です|doing V is ～|V辞書 + の は adj です|漢字を覚えるのは大変です。|Memorising kanji is tough.|The whole action becomes the topic.",
"G239|s2|39|3|〜て、〜 (cause)|because of ～ (unintentional result)|Vて ・ いA(－い)くて ・ なA/N で|ニュースを聞いて、びっくりしました。|I was surprised to hear the news.|The second clause CANNOT be a will, request or invitation — only feelings and involuntary outcomes.",
"G240|s2|39|3|Vなくて、〜|because ～ not (cause)|Vない (drop い) + くて|バスが来なくて、遅れました。|The bus didn't come, so I was late.|なくて = reason. ないで = manner (\"without doing\"). One kana apart, different jobs.",
"G241|s2|39|3|〜ので、〜|because ～ (soft, objective)|普通形 + ので (なA/N + な + ので)|用事があるので、お先に失礼します。|I have an errand, so I'll be going.|Softer and more objective than から — good for excuses and requests.",
"G242|s2|40|3|〜かどうか|whether or not ～|普通形 (drop だ) + かどうか|会議に間に合うかどうか、わかりません。|I don't know whether I'll make the meeting.|Yes/no uncertainty. With a question word, drop どうか: どこにあるか知っていますか.",
"G243|s2|40|3|Vてみます|try doing V (and see)|Vて + みます|着てみてもいいですか。|May I try it on?|Trying it out to see what happens. Not \"attempt\" — that's ようとします.",
"G244|s2|41|3|くださいます／いただきます|honorific/humble giving and receiving|先生が くださいます ・ わたしが いただきます|部長がお土産をくださいました。|The department head gave me a souvenir.|くださる = superior gives to me. いただく = I humbly receive. Both raise the other person.",
"G245|s2|41|3|Vていただきます|humbly have someone do V for me|Vて + いただきます|先生に教えていただきました。|My teacher was kind enough to teach me.|The humble version of てもらいます. Doer takes に.",
"G246|s2|41|3|Vてやります|do V for an inferior/animal/plant|Vて + やります|犬を散歩に連れて行ってやりました。|I took the dog for a walk.|Only downward: children, pets, plants. Using it on a person can sound arrogant.",
"G247|s2|42|3|Vるために、〜|in order to V|V辞書 + ために ・ N の + ために|家を買うために、貯金しています。|I'm saving money in order to buy a house.|The goal must be within your CONTROL. If it isn't, use ように.",
"G248|s2|42|3|Vるのに使います|use for doing V|V辞書 + のに 使います・便利です・かかります|これは紙を切るのに使います。|This is used for cutting paper.|のに here = \"for the purpose of\" — a different のに from the \"although\" one.",
"G249|s2|43|3|〜そうです (appearance)|looks like ～ / seems about to ～|Vます stem ・ いA(－い) ・ なA + そうです|雨が降りそうです。|It looks like it's going to rain.|Based on what you SEE. いい → よさそう, ない → なさそう. Not for what you heard.",
"G250|s2|43|3|Vてきます／Vていきます|do V and come back / go on doing V|Vて + きます・いきます|ちょっとたばこを買ってきます。|I'll just go and buy cigarettes.|きます = returning here, or a change up to now. いきます = moving away, or a change from now on.",
"G251|s2|44|3|〜すぎます|too much ～|Vます stem ・ いA(－い) ・ なA + すぎます|飲みすぎました。|I drank too much.|Always negative in feel. いい → よすぎる, ない → なさすぎる.",
"G252|s2|44|3|Vやすい／Vにくい|easy / hard to do|Vます stem + やすいです・にくいです|この本は読みやすいです。|This book is easy to read.|Both conjugate as い-adjectives: 読みやすかった / 読みにくくない.",
"G253|s2|44|3|〜くします／〜にします|make it ～|いA(－い) + く します ・ なA/N + に します|音を大きくしてください。|Please turn the volume up.|します = you change it. なります = it changes by itself.",
"G254|s2|45|3|〜のに、〜|although ～ (and I'm surprised/annoyed)|普通形 + のに (なA/N + な + のに)|薬を飲んだのに、まだ熱があります。|Even though I took medicine, I still have a fever.|Carries dissatisfaction or surprise. が/けど are neutral; のに is not.",
"G255|s2|45|3|Vた場合は|in the case that ～|V辞書/Vた/N の + 場合は|地震が起きた場合は、火を消してください。|In the event of an earthquake, put out the fire.|Formal — manuals, notices, contracts.",
"G256|s2|46|3|Vるところです|be about to do V|V辞書 + ところです|今から出かけるところです。|I'm just about to go out.|辞書形 = about to; ている = in the middle of; た形 = just finished.",
"G257|s2|46|3|Vたばかりです|have just done V|Vた + ばかりです|日本へ来たばかりです。|I've only just come to Japan.|SUBJECTIVE freshness — can be weeks ago if it still feels new. たところ is objectively just now.",
"G258|s2|46|3|〜はずです|it should/ought to be ～|普通形 + はずです (なA + な, N + の)|田中さんは知っているはずです。|Mr Tanaka should know.|A logical expectation based on evidence. Not a duty — that's べきです.",
"G259|s2|47|3|〜そうです (hearsay)|I hear that ～|普通形 + そうです|田中さんは来月結婚するそうです。|I hear Mr Tanaka is getting married next month.|Attaches to the PLAIN FORM — that's what separates it from the \"looks like\" そうです (ます-stem).",
"G260|s2|47|3|〜ようです|it seems ～ (my own judgement)|普通形 + ようです (なA + な, N + の)|事故があったようです。|It seems there's been an accident.|Based on your own reasoning from evidence. みたいです is the casual equivalent.",
"G261|s2|47|3|〜らしいです|apparently ～ (from outside information)|普通形 + らしいです (なA/N drop だ)|あの店は安いらしいです。|That shop is apparently cheap.|Information from elsewhere, held at arm's length.",
"G262|s2|47|3|音／においがします|there's a sound / smell|N が します|変な音がします。|There's a strange noise.|Senses take が します: 音・声・におい・味・気.",
"G263|s2|48|3|使役形 (causative form)|make/let someone do V|G1: あ-row + せる ・ G2: －る + させる ・ G3: させる/来させる|部長は部下に残業させました。|The manager made his staff work overtime.|Intransitive: person takes を or に. Transitive: person takes に. Force or permission — context decides.",
"G264|s2|48|3|Vさせてください|please let me do V|使役形 て + ください|わたしにやらせてください。|Please let me do it.|Asking permission to do something yourself. Politer: 〜させていただけませんか.",
"G265|s2|49|2|尊敬語 (honorific)|elevating the other person's actions|お + Vます stem + になります ・ 受身形と同じ形|社長はもうお帰りになりました。|The president has already gone home.|Special verbs override: いらっしゃる, 召し上がる, ご覧になる, おっしゃる, なさる, くださる.",
"G266|s2|49|2|お〜ください|please do ～ (honorific request)|お + Vます stem + ください ・ ご + 漢語 + ください|少々お待ちください。|Please wait a moment.|Native verbs take お; Chinese-origin nouns take ご: ご利用ください.",
"G267|s2|50|2|謙譲語 (humble)|lowering your own actions|お + Vます stem + します ・ ご + 漢語 + します|お荷物をお持ちします。|Let me carry your luggage.|Special verbs: 参る, 申す, いたす, 拝見する, いただく, 存じる, 伺う, おる.",
"G268|s2|50|2|丁寧語|polite register|です・ます ・ ございます ・ よろしいでしょうか|こちらでございます。|It is here.|The third leg of keigo: not about status, just politeness of speech.",
"G301|chu||3|〜ば〜ほど|the more ～, the more ～|Vば + V辞書 + ほど ・ いA ければ + い + ほど|練習すればするほど、上手になります。|The more you practise, the better you get.|The verb is repeated: ば-form then dictionary form.",
"G302|chu||3|〜ことにします|decide to ～ (my own decision)|V辞書/Vない + ことにします|毎朝走ることにしました。|I've decided to run every morning.|ことにする = I decide. ことになる = it gets decided (by circumstances or others).",
"G303|chu||3|〜ことになります|it has been decided that ～|V辞書/Vない + ことになります|来月、大阪へ転勤することになりました。|It's been decided I'll transfer to Osaka.|Presents even your own decision as something that came about — modest and very Japanese.",
"G304|chu||3|〜わけです|that means / no wonder|普通形 + わけです (なA + な, N + という)|10年住んでいたんですか。日本語が上手なわけですね。|You lived there 10 years? No wonder your Japanese is good.|A conclusion that follows naturally from what was just said.",
"G305|chu||2|〜わけではない|it doesn't mean that ～|普通形 + わけではない|嫌いなわけではないが、あまり食べない。|It's not that I dislike it, I just don't eat much.|Partial denial — softening an over-strong conclusion.",
"G306|chu||2|〜わけがない|there's no way ～|普通形 + わけがない|彼がそんなことを言うわけがない。|There's no way he'd say such a thing.|Flat denial on logical grounds. Stronger than はずがない.",
"G307|chu||3|〜べきです|should ～ (moral obligation)|V辞書 + べきです|約束は守るべきだ。|One should keep one's promises.|Moral duty, not practical advice. する→すべき or するべき. Not used to your superiors.",
"G308|chu||2|〜ざるを得ない|have no choice but to ～|Vない (drop ない) + ざるを得ない|上司の命令だから、従わざるを得ない。|It's the boss's order, so I have no choice but to obey.|Formal and reluctant. する → せざるを得ない (irregular).",
"G309|chu||3|〜に違いない|must be ～ (I'm certain)|普通形 (なA/N drop だ) + に違いない|彼は知っていたに違いない。|He must have known.|Strong personal conviction. かもしれない is the weak end of the same scale.",
"G310|chu||3|〜としても|even supposing ～|普通形 + としても|雨が降ったとしても、試合は中止しない。|Even if it rains, the match won't be cancelled.|Hypothetical concession. ても is the plainer everyday version.",
"G311|chu||2|〜どころか|far from ～ / let alone|普通形/N + どころか|漢字どころか、ひらがなも読めない。|Far from kanji, he can't even read hiragana.|Flips the expectation hard, then adds something even more extreme.",
"G312|chu||3|〜おかげで／〜せいで|thanks to ～ / because of ～ (blame)|普通形 + おかげで・せいで (N の)|先生のおかげで合格できました。|Thanks to my teacher, I passed.|おかげで = good outcome (gratitude). せいで = bad outcome (blame). ために is neutral.",
"G313|chu||3|〜に対して|toward / in contrast to|N + に対して|お客様に対して、丁寧な言葉を使います。|We use polite language toward customers.|Direction of an attitude or action. Not the same as について (about a topic).",
"G314|chu||3|〜によって|by / depending on / due to|N + によって|人によって考え方が違います。|Ways of thinking differ from person to person.|Four jobs: agent, means, cause, and variation. Context decides.",
"G315|chu||3|〜に基づいて|based on ～|N + に基づいて|データに基づいて判断します。|We judge based on the data.|Formal. The basis is a rule, principle, plan or data.",
"G316|chu||2|〜をはじめ|starting with ～ (and others)|N + をはじめ(として)|東京をはじめ、日本各地に支店があります。|We have branches all over Japan, starting with Tokyo.|Names the most representative example of a set.",
"G317|chu||3|〜を通じて／を通して|through / throughout|N + を通じて・を通して|友達を通じて彼を知りました。|I got to know him through a friend.|Means or intermediary, or a span of time: 一年を通じて.",
"G318|chu||2|〜さえ〜ば|if only ～|N さえ ・ Vます stem さえすれば|お金さえあれば、何でもできる。|If only I had money, I could do anything.|Singles out the ONE sufficient condition.",
"G319|chu||2|〜こそ|it is precisely ～ (emphasis)|N + こそ|今年こそ合格したい。|This year for sure I want to pass.|Spotlight particle. こちらこそ = \"no, the pleasure is mine\".",
"G320|chu||2|〜ばかりか／のみならず|not only ～ but also|普通形 + ばかりか・のみならず|彼は英語ばかりか、中国語も話せる。|Not only English, he speaks Chinese too.|のみならず is the stiffer, written form.",
"G321|chu||2|〜上に|on top of ～ (piling up)|普通形 + 上に (なA + な, N + の)|この店は安い上に、味もいい。|This place is cheap, and the food's good too.|Both halves must point the SAME way — both good or both bad.",
"G322|chu||2|〜反面／〜一方で|on the other hand ～|普通形 + 反面・一方で|便利な反面、値段が高い。|It's convenient, but on the other hand expensive.|Two genuinely opposed sides of the same thing.",
"G323|chu||3|〜わりに|considering / for ～ (unexpectedly)|普通形 + わりに (なA + な, N + の)|値段のわりにおいしい。|It's tasty for the price.|The result doesn't match what the standard would lead you to expect.",
"G324|chu||2|〜くせに|even though ～ (contempt)|普通形 + くせに (なA + な, N + の)|知っているくせに、教えてくれない。|He knows perfectly well, yet won't tell me.|Like のに but openly critical. Never about yourself.",
"G325|chu||2|〜ながらも|although ～|Vます stem ・ いA ・ なA/N + ながら(も)|狭いながらも、楽しい我が家。|Small though it is, it's a happy home.|The concessive ながら — different from the \"while doing\" ながら.",
"G326|chu||2|〜において|in / at (formal setting)|N + において|会議は3階の会議室において行われます。|The meeting will be held in the 3rd-floor room.|The written-language で. Place, time, field or situation.",
"G327|chu||2|〜次第|as soon as ～ / depending on ～|Vます stem + 次第 ・ N + 次第だ|到着次第、ご連絡します。|I'll contact you as soon as I arrive.|With a ます-stem = \"the moment that\". After a noun = \"depends entirely on\".",
"G328|chu||2|〜あまり|so much that ～ (excess)|V辞書/Vた ・ N の + あまり|心配のあまり、眠れなかった。|I was so worried I couldn't sleep.|An extreme emotion causing an unintended result.",
"G329|chu||2|〜末に|after much ～, finally|Vた ・ N の + 末に|長い議論の末に、結論が出た。|After a long discussion, a conclusion was reached.|Long process → final outcome. Neutral or positive.",
"G330|chu||2|〜あげく|after all that, (bad outcome)|Vた ・ N の + あげく|さんざん迷ったあげく、買わなかった。|After agonising over it, I didn't buy it.|Always a disappointing or negative ending. That's what separates it from 末に.",
"G331|chu||3|〜まま|as it is / leaving it unchanged|Vた/Vない ・ N の ・ この + まま|靴をはいたまま、入らないでください。|Please don't come in with your shoes on.|A state left unchanged while something else happens.",
"G332|chu||2|〜っぱなし|leave ～ on / keep ～ing (neglect)|Vます stem + っぱなし|電気をつけっぱなしにした。|I left the light on.|Carries a whiff of carelessness.",
"G333|chu||2|〜がち|tend to ～ (often, usually bad)|Vます stem ・ N + がち|冬は風邪をひきがちだ。|One tends to catch colds in winter.|A tendency, usually undesirable. 病気がち, 曇りがち.",
"G334|chu||2|〜気味|a touch of ～ / slightly|Vます stem ・ N + 気味|ちょっと風邪気味です。|I feel a bit like I'm coming down with a cold.|A slight leaning, felt by the speaker.",
"G335|chu||2|〜だらけ|covered in ～ / full of ～|N + だらけ|服が泥だらけになった。|My clothes got covered in mud.|Always unpleasant: 間違いだらけ, ほこりだらけ.",
"G336|chu||2|〜向け／〜向き|aimed at ～ / suited to ～|N + 向け・向き|子ども向けの番組。|A programme aimed at children.|向け = deliberately targeted. 向き = happens to suit.",
"G337|chu||2|〜かねない／〜かねる|might well ～ (bad) / cannot ～|Vます stem + かねない・かねます|その発言は誤解を招きかねない。|That remark could well cause misunderstanding.|かねない = a bad possibility. かねます = a polite refusal: わかりかねます.",
"G338|chu||1|〜得る／〜得ない|be possible / impossible to ～|Vます stem + 得る (うる/える)・得ない|それはあり得ない。|That's impossible.|Formal. あり得る is read ありうる or ありえる; あり得ない is always ありえない.",
"G339|chu||1|〜がたい|hard to ～ (emotionally/abstractly)|Vます stem + がたい|信じがたい話だ。|It's a hard story to believe.|Abstract difficulty. にくい is physical or practical difficulty.",
"G340|chu||2|〜ようがない|there's no way to ～|Vます stem + ようがない|連絡先がわからないので、知らせようがない。|I've no contact details, so there's no way to tell them.|You lack the MEANS, not the ability.",
"G341|chu||2|〜ものの|although ～|普通形 + ものの|買ったものの、一度も使っていない。|I bought it, but haven't used it once.|Written, slightly literary concession.",
"G342|chu||1|〜とはいえ|even so / that said|普通形 + とはいえ|春とはいえ、まだ寒い。|It may be spring, but it's still cold.|Acknowledges a fact, then pushes back against it.",
"G343|chu||2|〜にもかかわらず|despite ～|普通形/N + にもかかわらず|雨にもかかわらず、大勢集まった。|Despite the rain, a big crowd gathered.|Formal のに. No emotional complaint attached.",
"G344|chu||1|〜を問わず|regardless of ～|N + を問わず|経験の有無を問わず、応募できます。|You may apply regardless of experience.|Job ads and notices. Pairs with 男女, 年齢, 昼夜.",
"G345|chu||1|〜はもとより|not to mention ～|N + はもとより|漢字はもとより、ひらがなも書ける。|Not to mention kanji, he can write hiragana too.|Formal version of はもちろん.",
"G346|chu||2|〜からには／〜以上は|now that ～, (naturally)|普通形 + からには・以上は|引き受けたからには、最後までやります。|Now that I've taken it on, I'll see it through.|A strong resolution or judgement must follow.",
"G347|chu||2|〜限り|as long as ～ / to the limit of|V辞書/Vている/Vない + 限り|私が知っている限り、彼は正直だ。|As far as I know, he's honest.|Sets the boundary within which the statement holds.",
"G348|chu||1|〜に限って|of all things, ～ (bad luck)|N + に限って|急いでいる日に限って、電車が遅れる。|Precisely on the days I'm in a hurry, the train is late.|Ironic bad timing. Also 〜に限る = \"nothing beats\".",
"G349|chu||2|〜だけに|precisely because ～ (all the more)|普通形 + だけに|期待していただけに、がっかりした。|Precisely because I'd hoped for it, I was disappointed.|The reason makes the result all the more intense.",
"G350|chu||2|〜てからでないと|not until you've ～|Vて + からでないと + NEGATIVE|説明を聞いてからでないと、始められません。|We can't start until we've heard the explanation.|Requires a negative ending in the second clause.",
"G351|chu||3|〜たとたん|the moment ～ happened|Vた + とたん|ドアを開けたとたん、猫が飛び出した。|The moment I opened the door, the cat shot out.|Sudden and unexpected. The second clause must be PAST and not a plan.",
"G352|chu||3|〜うちに|while ～ (before it changes)|V辞書/Vている/Vない ・ いA ・ なA な ・ N の + うちに|熱いうちに、召し上がってください。|Please eat it while it's hot.|Do it before the window closes. ないうちに = before it happens.",
"G353|chu||3|〜最中に|right in the middle of ～|Vている ・ N の + 最中に|食事の最中に、電話が鳴った。|The phone rang right in the middle of dinner.|An interruption at the peak of an activity.",
"G354|chu||3|〜っぽい|-ish / tends to be|N ・ Vます stem ・ いA(－い) + っぽい|子どもっぽい話し方。|A childish way of speaking.|Casual and usually slightly critical. 忘れっぽい = forgetful.",
"G355|chu||2|〜まい|will not / probably not (literary)|V辞書 (G1) ・ Vます stem/ないstem + まい (G2/3)|二度と行くまいと思った。|I resolved never to go again.|Literary negative volitional. Also するまい / すまい.",
"G356|chu||2|〜ものだ|used to / that's how it is|Vた + ものだ ・ V辞書 + ものだ|子どものころ、よくここで遊んだものだ。|As a child I used to play here a lot.|た形 = nostalgic recollection. 辞書形 = a general truth or social norm.",
"G357|chu||2|〜ものか|as if ～! (strong denial)|普通形 + ものか|あんな店、二度と行くものか。|As if I'd ever go back to that place!|Emphatic, emotional refusal. Casual: もんか.",
"G358|chu||1|〜ずにはいられない|can't help but ～|Vない (drop ない) + ずにはいられない|笑わずにはいられなかった。|I couldn't help laughing.|Irresistible impulse. する → せずにはいられない.",
"G359|chu||1|〜てならない／〜てたまらない|unbearably ～|Vて ・ いA くて ・ なA で + ならない・たまらない|将来が心配でならない。|I'm terribly worried about the future.|Overwhelming feeling you can't suppress. てしかたがない is similar.",
"G360|chu||1|〜のではないだろうか|isn't it perhaps that ～?|普通形 + のではないだろうか|考えすぎているのではないだろうか。|Aren't you perhaps overthinking it?|A hedged, indirect assertion — very common in academic writing.",
"C01|s1|1|5|は vs が|Topic vs subject|は presents KNOWN information as the topic and often implies contrast; が introduces NEW information, answers a question word, and is required inside subordinate clauses.|だれが来ましたか。→ 田中さんが来ました。(new) ・ 田中さんは学生です。(topic)||Rule of thumb: if the answer replaces a question word, it takes が.",
"C02|s1|6|5|に vs で (場所)|Place particles|に marks where something EXISTS or ends up; で marks where an ACTION takes place.|家にいます。(exist) ・ 家で勉強します。(action) ・ いすに座ります。(end up)||座る, 住む, 泊まる, 乗る all take に — the person ends up there.",
"C03|s1|5|5|に vs へ (方向)|Direction particles|Both work for destination. へ stresses the DIRECTION headed; に stresses the ARRIVAL point. に is also required for indirect objects, where へ can't go.|京都へ行きます ≒ 京都に行きます ・ 友達に電話します (に only)||If you can replace it with \"to a person\", only に works.",
"C04|s1|17|4|まで vs までに|Until vs by|まで = continuing UNTIL that point. までに = a DEADLINE, by which a one-off action must happen.|5時まで働きます。(work until 5) ・ 5時までに帰ります。(be back by 5)||Continuous verb → まで. Momentary verb → までに.",
"C05|s1|9|4|から vs ので|Because|から is subjective — your own reason, opinion, will; it can precede a command or invitation. ので is objective and softer, good for excuses and polite requests.|寒いから、窓を閉めて。 ・ 用事があるので、失礼します。||In a polite excuse to a superior, ので sounds far better than から.",
"C06|s1|25|4|と・たら・ば・なら|The four conditionals|と = automatic, inevitable result (no request/will allowed). たら = most flexible, any second clause. ば = focuses on the condition itself. なら = picks up what the other person just said.|押すと出ます ・ 雨が降ったら行きません ・ 安ければ買います ・ 京都なら春がいい||If the second clause is a request, invitation or intention, と is wrong.",
"C07|s2|42|3|ために vs ように|In order to|ために: the goal is something you CONTROL (same subject, volitional verb). ように: the goal is beyond your direct control — potential verbs, intransitives, negatives.|大学に入るために勉強する ・ 忘れないようにメモする||If the verb before it is potential/negative/intransitive, it must be ように.",
"C08|s2|45|3|のに vs ても|Although|のに = \"even though\", with surprise or dissatisfaction attached. ても = \"even if\", hypothetical, no complaint.|薬を飲んだのに治らない (annoyed) ・ 薬を飲んでも治らない (even if)||のに always looks at something that actually happened.",
"C09|s1|24|4|あげる・くれる・もらう|Direction of giving|あげる: I/someone → someone else (away from me). くれる: someone → ME (toward me). もらう: I receive, subject is the receiver.|私は彼に本をあげた ・ 彼が私に本をくれた ・ 私は彼に本をもらった||Anything coming toward you or your in-group MUST be くれる, never あげる.",
"C10|s2|29|4|自動詞ています vs 他動詞てあります|Two ways to describe a state|自動詞+ています just describes how things ARE. 他動詞+てあります says someone did it deliberately and left it that way.|窓が開いています (it's open) ・ 窓が開けてあります (someone opened it on purpose)||てあります implies intention and a human agent behind the scene.",
"C11|s2|43|3|そうです (様態) vs そうです (伝聞)|Looks like vs I hear that|Appearance そうだ: attaches to the ます-STEM / adjective stem — 降りそう, おいしそう. Hearsay そうだ: attaches to the PLAIN FORM — 降るそうだ, おいしいそうだ.|雨が降りそうです (looks like) ・ 雨が降るそうです (I hear)||The attachment shape is the ONLY difference. Exam questions live here.",
"C12|s2|47|3|ようだ・らしい・みたいだ|Degrees of inference|ようだ: your own reasoning from evidence you observed. らしい: information from OUTSIDE, held at arm's length. みたいだ: the casual spoken form of ようだ.|熱がある。風邪のようだ (my judgement) ・ 風邪らしい (I heard)||らしい also has a second job: 男らしい = \"befitting a man\".",
"C13|s1|17|4|なければなりません vs なくてもいい|Must vs need not|なければなりません = obligation, no choice. なくてもいいです = permission NOT to do it.|薬を飲まなければなりません ・ 薬を飲まなくてもいいです||Both start from ない — only the tail differs. Don't confuse with てはいけません (must NOT).",
"C14|s1|15|4|てもいい vs てはいけない|Permission vs prohibition|てもいいです = you may. てはいけません = you must not.|入ってもいいです ・ 入ってはいけません||The negative counterpart of てもいい in everyday speech is usually ないでください (softer).",
"C15|s2|27|4|可能形 vs ことができる|Two ways to say \"can\"|Identical meaning. The potential form is everyday and shorter; ことができる is more formal/written. Object: を → が with the potential form.|日本語が話せます ・ 日本語を話すことができます||Note the particle flip — 日本語を話せます is heard, but が is the textbook answer.",
"C16|s2|27|4|だけ vs しか〜ない|Only|だけ is neutral: \"just this much\". しか always takes a NEGATIVE verb and adds \"and that's not enough\".|1000円だけあります (I have 1000, fine) ・ 1000円しかありません (only 1000, not enough)||If the verb is positive, しか is impossible.",
"C17|s2|27|4|見えます vs 見られます|Spontaneous vs potential|見えます: it enters your eyes whether you like it or not. 見られます: you are ABLE to see it, usually because circumstances allow.|窓から海が見えます ・ その映画はネットで見られます||Same split for 聞こえます (reaches your ears) vs 聞けます (you can listen to it).",
"C18|s1|15|4|知っています vs わかります|Know vs understand|知っています = the information is in your head (acquired). わかります = you comprehend / it makes sense.|電話番号を知っています ・ 意味がわかります||The negative of 知っています is 知りません, never 知っていません. わかりません is normal.",
"C19|s2|43|3|ていきます vs てきます|Going vs coming|てきます: moving toward here, or a change that came UP TO NOW. ていきます: moving away from here, or a change continuing FROM NOW ON.|買ってきます (buy and come back) ・ 増えてきた (has been increasing) ・ 増えていく (will keep increasing)||Time flows the same way as space: きます = past→now, いきます = now→future.",
"C20|s1|14|5|ています — three jobs|Progressive, state, habit|Same shape, three meanings: (1) doing it right now, (2) the resulting state of a past change, (3) a repeated habit.|食べています (eating now) ・ 結婚しています (married — state) ・ 毎朝走っています (habit)||Verbs of instant change (結婚する, 死ぬ, 知る, 住む) give the STATE reading, never \"in the middle of\".",
"C21|s2|46|3|たばかり vs たところ|Just did|たところ: objectively, the action finished seconds ago. たばかり: subjectively, it still feels recent — could be months.|今、着いたところです ・ 日本へ来たばかりです||ばかり can stretch: 買ったばかりの車 is fine even a year on.",
"C22|s2|46|3|はず・べき・わけ|Should / ought / naturally|はず = logical expectation from evidence. べき = moral obligation. わけ = a conclusion that naturally follows.|来るはずです (should arrive) ・ 行くべきです (ought to go) ・ 高いわけです (no wonder it's dear)||べき carries a moral tone — never use it to a superior.",

/* ================= verb conjugation ================= */
const I2U={"い":"う","き":"く","ぎ":"ぐ","し":"す","ち":"つ","に":"ぬ","び":"ぶ","み":"む","り":"る"};
const I2A={"い":"わ","き":"か","ぎ":"が","し":"さ","ち":"た","に":"な","び":"ば","み":"ま","り":"ら"};
const I2E={"い":"え","き":"け","ぎ":"げ","し":"せ","ち":"て","に":"ね","び":"べ","み":"め","り":"れ"};
const I2O={"い":"お","き":"こ","ぎ":"ご","し":"そ","ち":"と","に":"の","び":"ぼ","み":"も","り":"ろ"};
const TE1={"い":"って","ち":"って","り":"って","み":"んで","び":"んで","に":"んで","き":"いて","ぎ":"いで","し":"して"};
const VFORMS=[["masu","ます形"],["dict","辞書形"],["nai","ない形"],["te","て形"],["ta","た形"],
  ["pot","可能形"],["vol","意向形"],["ba","ば形"],["tara","たら形"],["pass","受身形"],
  ["caus","使役形"],["imp","命令形"],["taiF","たい形"]];
const VFLABEL=Object.fromEntries(VFORMS);

function conj(v,form){
  const g=v.g, kStem=v.w.slice(0,-2), rStem=v.r.slice(0,-2);
  const mk=(kT,rT,cut)=>({k:v.w.slice(0,v.w.length-2-(cut||0))+kT, r:v.r.slice(0,v.r.length-2-(cut||0))+rT});
  if(g==="3k"){
    const kPre=v.w.slice(0,-3), rPre=v.r.slice(0,-3);
    const T={masu:["来ます","きます"],dict:["来る","くる"],nai:["来ない","こない"],te:["来て","きて"],
      ta:["来た","きた"],pot:["来られる","こられる"],vol:["来よう","こよう"],ba:["来れば","くれば"],
      tara:["来たら","きたら"],pass:["来られる","こられる"],caus:["来させる","こさせる"],
      imp:["来い","こい"],taiF:["来たい","きたい"]};
    const t=T[form]||T.dict; return{k:kPre+t[0],r:rPre+t[1]};
  }
  if(g==="3"){
    const kPre=v.w.slice(0,-3), rPre=v.r.slice(0,-3);
    const T={masu:"します",dict:"する",nai:"しない",te:"して",ta:"した",pot:"できる",vol:"しよう",
      ba:"すれば",tara:"したら",pass:"される",caus:"させる",imp:"しろ",taiF:"したい"};
    const t=T[form]||T.dict; return{k:kPre+t,r:rPre+t};
  }
  if(g==="2"){
    const T={masu:"ます",dict:"る",nai:"ない",te:"て",ta:"た",pot:"られる",vol:"よう",ba:"れば",
      tara:"たら",pass:"られる",caus:"させる",imp:"ろ",taiF:"たい"};
    const t=T[form]||T.dict; return{k:kStem+t,r:rStem+t};
  }
  const c=rStem.slice(-1);
  const iku=(v.r==="いきます"||v.r.endsWith("ていきます"));
  const base=(ch,tail)=>mk(ch+tail,ch+tail,1);
  switch(form){
    case "masu":  return{k:v.w,r:v.r};
    case "taiF":  return base(c,"たい");
    case "dict":  return base(I2U[c],"");
    case "nai":   return base(I2A[c],"ない");
    case "pot":   return base(I2E[c],"る");
    case "vol":   return base(I2O[c],"う");
    case "ba":    return base(I2E[c],"ば");
    case "imp":   return base(I2E[c],"");
    case "pass":  return base(I2A[c],"れる");
    case "caus":  return base(I2A[c],"せる");
    case "te":    return iku?mk("って","って",1):mk(TE1[c],TE1[c],1);
    case "ta":    {const t=iku?"って":TE1[c];const p=t.replace("て","た").replace("で","だ");return mk(p,p,1);}
    case "tara":  {const t=iku?"って":TE1[c];const p=t.replace("て","た").replace("で","だ")+"ら";return mk(p,p,1);}
  }
  return{k:v.w,r:v.r};
}

/* ================= adjective conjugation ================= */
const AFORMS=[["mod","名詞修飾"],["neg","否定"],["past","過去"],["pastneg","過去否定"],
  ["adv","副詞"],["te","て形"],["ba","条件形"],["naru","〜なる"]];
const AFLABEL=Object.fromEntries(AFORMS);
function adjConj(a,form){
  const stemK=a.w.slice(0,-1), stemR=a.r.slice(0,-1);            // i-adj: drop final い
  const yoK=a.w.slice(0,-2)+"よ", yoR=a.r.slice(0,-2)+"よ";       // いい / かっこいい
  const T={i:{mod:["",""],neg:["くない","ないです"],past:["かった","かったです"],
      pastneg:["くなかった","くなかったです"],adv:["く",""],te:["くて",""],ba:["ければ",""],naru:["くなる","くなります"]},
    ii:{mod:["",""],neg:["くない","ないです"],past:["かった","かったです"],
      pastneg:["くなかった","くなかったです"],adv:["く",""],te:["くて",""],ba:["ければ",""],naru:["くなる","くなります"]},
    na:{mod:["な",""],neg:["じゃない","じゃないです"],past:["だった","でした"],
      pastneg:["じゃなかった","じゃなかったです"],adv:["に",""],te:["で",""],ba:["なら",""],naru:["になる","になります"]}};
  const t=T[a.t][form];
  if(a.t==="na"){
    const k=a.w+t[0], r=a.r+t[0];
    return{k:form==="mod"?k+"＋名詞":k, r, pol:t[1]?a.r+t[1]:""};
  }
  if(form==="mod") return{k:a.w+"＋名詞",r:a.r,pol:""};
  const b=a.t==="ii"?[yoK,yoR]:[stemK,stemR];
  return{k:b[0]+t[0], r:b[1]+t[0], pol:t[1]?(a.t==="ii"?yoR:stemR)+t[1]:""};
}

let JV=null,EV=null,unlocked=false,speakToken=0,noJa=false,voicesSettled=false,currentU=null;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
function pickVoices(){const vs=allVoices();const isJa=v=>v.lang.replace("_","-").startsWith("ja");
  JV=(S.cfg.jvURI&&vs.find(v=>v.voiceURI===S.cfg.jvURI))||vs.find(v=>/Google/i.test(v.name)&&isJa(v))
     ||vs.find(v=>/Kyoko/i.test(v.name)&&isJa(v))||vs.find(isJa)||null;
  EV=vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))||vs.find(v=>v.lang.startsWith("en"))||null;
  noJa=vs.length>0&&!JV;}
async function ensureVoices(){for(let i=0;i<20;i++){if(allVoices().length)break;await new Promise(r=>setTimeout(r,120));}
  pickVoices();voicesSettled=true;}
if(typeof speechSynthesis!=="undefined"){speechSynthesis.onvoiceschanged=()=>pickVoices();pickVoices();ensureVoices();}
function unlock(){if(unlocked)return;unlocked=true;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("あ");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener("touchstart",unlock,{once:true});
document.addEventListener("click",unlock,{once:true});
function speak(text,jp=true,rate=0.92,_retry=false){
  const myToken=++speakToken;
  return new Promise(async res=>{try{
    if(!voicesSettled)await ensureVoices();
    const busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(busy)speechSynthesis.cancel();
    setTimeout(()=>{
      if(myToken!==speakToken)return res();
      pickVoices();
      const u=new SpeechSynthesisUtterance(text); currentU=u;
      u.lang=jp?"ja-JP":"en-US";
      let v=jp?JV:EV, r=jp?rate:1.0;
      if(_retry){r=1.0;if(jp){const alt=allVoices().find(x=>x.lang.replace("_","-").startsWith("ja")&&v&&x.localService!==v.localService);if(alt)v=alt;}}
      if(v)u.voice=v;
      u.rate=Math.max(0.7,r);u.pitch=1;
      let done=false,started=false;
      const finish=()=>{if(done)return;done=true;clearInterval(kick);res()};
      u.onstart=()=>started=true; u.onend=finish; u.onerror=finish;
      setTimeout(finish,600+text.length*(jp?185:75)/u.rate+1500);
      setTimeout(()=>{if(!started&&!done&&!_retry){done=true;clearInterval(kick);
        try{speechSynthesis.cancel()}catch(e){}
        setTimeout(()=>speak(text,jp,1.0,true).then(res),160);}},1400);
      const kick=setInterval(()=>{try{speechSynthesis.resume()}catch(e){}},2500);
      speechSynthesis.speak(u);
      setTimeout(()=>{try{speechSynthesis.resume()}catch(e){}},120);
    },busy?230:40);
  }catch(e){res()}});
}

/* ---------- range parser (same syntax as 漢字の糸) ---------- */
function parseRanges(body,max){
  const toks=body.toLowerCase().split(/[,&＆、]+|\band\b/).map(t=>t.trim()).filter(Boolean);
  if(!toks.length)return null;
  const out=[];
  for(let t of toks){
    t=t.replace(/^[ln]\s*/,"");
    const m=t.match(/^([1-9]\d?)(?:\s*[-–~〜]\s*([1-9]\d?))?$/);
    if(!m)return null;
    let lo=+m[1],hi=m[2]?+m[2]:+m[1];
    if(hi<lo)[lo,hi]=[hi,lo];
    if(lo<1||hi>max)return null;
    out.push([lo,hi]);
  }
  return out;
}
const inRanges=(v,rs)=>v!=null&&rs.some(([lo,hi])=>v>=lo&&v<=hi);
const anyRange=()=>filt.s1||filt.s2||filt.chu||filt.nl.size||filt.lr;

/* passes the range filter? lv is "s1"/"s2"/"chu" (grammar) or derived from lesson */
function passRange(l,n,lv){
  if(!anyRange())return true;
  const series=lv||(l==null?null:(l<=25?"s1":"s2"));
  const inR=!filt.lr||inRanges(l,filt.lr);
  if(filt.s1&&series==="s1"&&inR)return true;
  if(filt.s2&&series==="s2"&&inR)return true;
  if(filt.chu&&series==="chu")return true;
  if(n&&filt.nl.has(n))return true;
  if(filt.lr&&!filt.s1&&!filt.s2&&!filt.chu&&inRanges(l,filt.lr))return true;
  return false;
}

/* ================= item builders =================
   Every drillable item is {id, deck, ...} where id is STABLE across
   updates so stars survive. */
function baseItems(){
  if(deck==="word") return WORDS.map(w=>({id:"w:"+w.w+"|"+w.r,deck:"word",o:w,l:w.l,n:w.n,lv:null}));
  if(deck==="gram") return GRAM.map(g=>({id:"g:"+g.id,deck:"gram",o:g,l:g.l,n:g.n,lv:g.lv}));
  if(deck==="verb") return VERBS.map(v=>({id:"v:"+v.w+"|"+v.r,deck:"verb",o:v,l:v.l,n:null,lv:null}));
  if(deck==="adj")  return ADJS.map(a=>({id:"a:"+a.w+"|"+a.r,deck:"adj",o:a,l:a.l,n:null,lv:null}));
  /* starred deck: pull every starred item from every source */
  const all=[].concat(
    WORDS.map(w=>({id:"w:"+w.w+"|"+w.r,deck:"word",o:w,l:w.l,n:w.n,lv:null})),
    GRAM.map(g=>({id:"g:"+g.id,deck:"gram",o:g,l:g.l,n:g.n,lv:g.lv})),
    VERBS.map(v=>({id:"v:"+v.w+"|"+v.r,deck:"verb",o:v,l:v.l,n:null,lv:null})),
    ADJS.map(a=>({id:"a:"+a.w+"|"+a.r,deck:"adj",o:a,l:a.l,n:null,lv:null})));
  return all.filter(it=>starOn(it.id));
}
function searchText(it){
  const o=it.o;
  if(it.deck==="gram")return (o.p+" "+o.mean+" "+o.form+" "+o.ex+" "+(o.exen||"")+" "+o.note).toLowerCase();
  return (o.w+" "+o.r+" "+o.m).toLowerCase();
}
function matches(it,q){
  if(!q)return true;
  const rr=q.match(/^l\s*([\d\s,\-–&]+)$/i);
  if(rr){const rs=parseRanges(rr[1],50);return rs?inRanges(it.l,rs):false}
  const nn=q.match(/^n([1-5])$/i);
  if(nn)return it.n===+nn[1];
  return searchText(it).includes(q);
}
function filtered(){
  const q=query.trim().toLowerCase();
  let out=baseItems().filter(it=>passRange(it.l,it.n,it.lv)&&matches(it,q));
  if(deck==="verb"&&opt.vg.size) out=out.filter(it=>opt.vg.has(it.o.g==="3k"?"3":it.o.g));
  if(deck==="adj"&&opt.at.size)  out=out.filter(it=>opt.at.has(it.o.t==="ii"?"i":it.o.t));
  if(sortMode==="kana") out.sort((a,b)=>(a.o.r||a.o.p||"").localeCompare(b.o.r||b.o.p||"","ja"));
  else if(sortMode==="rand") out.sort(()=>Math.random()-.5);
  else out.sort((a,b)=>{
    const la=a.l==null?99:a.l, lb=b.l==null?99:b.l;
    if(la!==lb)return la-lb;
    return (a.o.r||a.o.p||"").localeCompare(b.o.r||b.o.p||"","ja");});
  return out;
}
/* one item can yield several CARDS (a verb × each selected form) */
function cardsFrom(items){
  const out=[];
  for(const it of items){
    if(it.deck==="verb"&&deck!=="star"){
      const fs=[...opt.vforms]; if(!fs.length)fs.push("dict");
      for(const f of fs) out.push({...it,form:f,key:it.id+"#"+f});
    } else if(it.deck==="adj"&&deck!=="star"){
      const fs=[...opt.aforms]; if(!fs.length)fs.push("neg");
      for(const f of fs) out.push({...it,form:f,key:it.id+"#"+f});
    } else if(it.deck==="verb"){ out.push({...it,form:"dict",key:it.id+"#dict"});
    } else if(it.deck==="adj"){  out.push({...it,form:"neg",key:it.id+"#neg"});
    } else out.push({...it,key:it.id});
  }
  return out;
}

/* ================= UI: filters & options ================= */
function chipHTML(cls,data,label,on){return `<button class="chip ${cls}${on?" on":""}" data-${data}>${label}</button>`}
function renderFilters(){
  const showChu=(deck==="gram"||deck==="star");
  const showJ=(deck==="word"||deck==="gram"||deck==="star");  /* verbs/adjs carry no JLPT tag */
  $("filterRow").innerHTML=
    chipHTML("","f=\"s1\"","初級 I",filt.s1)+
    chipHTML("","f=\"s2\"","初級 II",filt.s2)+
    (showChu?chipHTML("","f=\"chu\"","中級",filt.chu):"")+
    (showJ?[5,4,3,2,1].map(n=>chipHTML("nchip",`f="n${n}"`,"N"+n,filt.nl.has(n))).join(""):"")+
    `<input id="lrange" inputmode="numeric" placeholder="L 5-8, 12" value="${esc(filt.lrText)}" autocomplete="off">`;
  $("filterRow").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const f=b.dataset.f;
    if(f==="s1")filt.s1=!filt.s1; else if(f==="s2")filt.s2=!filt.s2; else if(f==="chu")filt.chu=!filt.chu;
    else{const n=+f[1];filt.nl.has(n)?filt.nl.delete(n):filt.nl.add(n)}
    renderFilters();render();});
  const lr=$("lrange");
  lr.oninput=e=>{const v=e.target.value.trim();
    filt.lrText=e.target.value;
    filt.lr=v?parseRanges(v,50):null;
    lr.style.borderColor=(v&&!filt.lr)?"var(--seal)":"";
    render();};
}
function renderOpts(){
  const w=$("optWrap");
  if(deck==="word"){
    w.innerHTML=`<div class="rowlab">出題 · WHAT YOU SEE FIRST</div><div class="selrow">
      <select id="wcue">
        <option value="ja">漢字 → 読み・意味</option>
        <option value="en">英語 → 日本語</option>
        <option value="kana">かな → 漢字・意味</option>
      </select></div>`;
    $("wcue").value=opt.wcue; $("wcue").onchange=e=>{opt.wcue=e.target.value};
  } else if(deck==="gram"){
    w.innerHTML=`<div class="rowlab">出題 · CARD FACE</div><div class="selrow">
      <select id="gface">
        <option value="mean">文型 → 意味・例文</option>
        <option value="rev">意味 → 文型</option>
        <option value="form">文型 → 接続 (どの形につく?)</option>
      </select></div>`;
    $("gface").value=opt.gface; $("gface").onchange=e=>{opt.gface=e.target.value};
  } else if(deck==="verb"){
    w.innerHTML=`<div class="rowlab">グループ · VERB GROUP</div>
      <div class="chips" id="vgRow">
        ${chipHTML("fchip",'g="1"',"１類 五段",opt.vg.has("1"))}
        ${chipHTML("fchip",'g="2"',"２類 一段",opt.vg.has("2"))}
        ${chipHTML("fchip",'g="3"',"３類 する・来る",opt.vg.has("3"))}
      </div>
      <div class="rowlab">答えの形 · DRILL THESE FORMS</div>
      <div class="chips" id="vfRow">
        ${VFORMS.filter(f=>f[0]!=="masu").map(f=>chipHTML("fchip",`v="${f[0]}"`,f[1],opt.vforms.has(f[0]))).join("")}
      </div>
      <div class="rowlab">出題 · CUE</div><div class="selrow">
        <select id="vcue">
          <option value="masu">ます形 → その形</option>
          <option value="dict">辞書形 → その形</option>
          <option value="en">英語 → その形</option>
          <option value="rev">その形 → 何の動詞? (逆引き)</option>
        </select></div>`;
    $("vgRow").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      const g=b.dataset.g; opt.vg.has(g)?opt.vg.delete(g):opt.vg.add(g); renderOpts(); render();});
    $("vfRow").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; opt.vforms.has(v)?opt.vforms.delete(v):opt.vforms.add(v);
      if(!opt.vforms.size)opt.vforms.add("dict");
      renderOpts(); render();});
    $("vcue").value=opt.vcue; $("vcue").onchange=e=>{opt.vcue=e.target.value};
  } else if(deck==="adj"){
    w.innerHTML=`<div class="rowlab">種類 · TYPE</div>
      <div class="chips" id="atRow">
        ${chipHTML("fchip",'t="i"',"い形容詞",opt.at.has("i"))}
        ${chipHTML("fchip",'t="na"',"な形容詞",opt.at.has("na"))}
      </div>
      <div class="rowlab">答えの形 · DRILL THESE FORMS</div>
      <div class="chips" id="afRow">
        ${AFORMS.map(f=>chipHTML("fchip",`a="${f[0]}"`,f[1],opt.aforms.has(f[0]))).join("")}
      </div>`;
    $("atRow").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      const t=b.dataset.t; opt.at.has(t)?opt.at.delete(t):opt.at.add(t); renderOpts(); render();});
    $("afRow").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{

/* ================= list render ================= */
function tagsFor(it){
  let t="";
  if(it.l!=null)t+=`<span class="tag ltag">L${it.l}</span>`;
  else if(it.lv==="chu")t+=`<span class="tag ltag">中級</span>`;
  if(it.n)t+=`<span class="tag ntag">N${it.n}</span>`;
  if(it.deck==="verb")t+=`<span class="tag gtag">${it.o.g==="3k"?"3":it.o.g}類</span>`;
  if(it.deck==="adj")t+=`<span class="tag gtag">${it.o.t==="na"?"な":"い"}</span>`;
  if(starOn(it.id))t+=`<span class="tag startag">★</span>`;
  return t;
}
function rowHTML(it){
  const o=it.o;
  if(it.deck==="gram")
    return `<div class="hit" data-k="${esc(it.id)}"><span class="w jp">${esc(o.p)}</span>
      <span class="m">${esc(o.mean)}</span>${tagsFor(it)}</div>`;
  if(it.deck==="verb"){
    const f=[...opt.vforms][0]||"dict";
    return `<div class="hit" data-k="${esc(it.id)}"><span class="w jp">${esc(o.w)}</span>
      <span class="r">${esc(conj(o,f).k)}</span><span class="m">${esc(o.m)}</span>${tagsFor(it)}</div>`;
  }
  if(it.deck==="adj"){
    const f=[...opt.aforms][0]||"neg";
    return `<div class="hit" data-k="${esc(it.id)}"><span class="w jp">${esc(o.w)}</span>
      <span class="r">${esc(adjConj(o,f).k)}</span><span class="m">${esc(o.m)}</span>${tagsFor(it)}</div>`;
  }
  return `<div class="hit" data-k="${esc(it.id)}"><span class="w jp">${esc(o.w)}</span>
    <span class="r">${esc(o.r)}</span><span class="m">${esc(o.m)}</span>${tagsFor(it)}</div>`;
}
let CUR=[];
function render(){
  CUR=filtered();
  const cards=cardsFrom(CUR);
  const g=$("goBtn");
  g.disabled=cards.length<1;
  g.textContent=cards.length?`▶ フラッシュカード · ${cards.length}枚`:"▶ 該当なし";
  $("stats").textContent=`${WORDS.length.toLocaleString()} words · ${GRAM.length} grammar · ${VERBS.length} verbs · ${ADJS.length} adjectives · ★${starCount()}`;
  const nh=$("noHits");
  if(!CUR.length){
    $("hits").innerHTML="";
    nh.classList.remove("hidden");
    nh.innerHTML=deck==="star"
      ?"No starred cards yet.<br>Open any flashcard and tap ★ to save it here."
      :"Nothing matches.<br>Try a kanji, kana, English word, L11-12, or N3.";
    return;
  }
  nh.classList.add("hidden");
  const show=CUR.slice(0,LIST_CAP);
  $("hits").innerHTML=show.map(rowHTML).join("")
    +(CUR.length>show.length?`<div class="note">Showing the first ${LIST_CAP} of ${CUR.length}. Narrow the range, or just start — the deck uses all ${CUR.length}.</div>`:"")
    +(canStore?"":`<div class="note">⚠ This preview can't save stars. Open the hosted page and they'll stick.</div>`);
  $("hits").querySelectorAll(".hit").forEach(el=>el.onclick=()=>{
    const it=CUR.find(x=>x.id===el.dataset.k); if(!it)return;
    const cs=cardsFrom([it]); openFlash(cs,0);});
}

/* ================= card faces ================= */
function sizeCls(s){return s.length>14?"xlong":s.length>6?"long":""}
function faceWord(c,back){
  const o=c.o, cue=opt.wcue;
  if(!back){
    if(cue==="en")return `<div class="cue">Say it in Japanese</div><div class="fc-mean" style="font-size:1.2rem">${esc(o.m)}</div><div class="fc-hint">tap to flip</div>`;
    const t=cue==="kana"?o.r:o.w;
    return `<div class="fc-main jp ${sizeCls(t)}">${esc(t)}</div><div class="fc-hint">tap to flip</div>`;
  }
  return `<div class="fc-main jp ${sizeCls(o.w)}">${esc(o.w)}</div>
    <div class="fc-read jp">${esc(o.r)}</div>
    <div class="fc-mean">${esc(o.m)}</div>
    <div class="fc-tags">${tagsFor(c)}</div>`;
}
function faceGram(c,back){
  const o=c.o;
  if(o.vs){ /* contrast card */
    if(!back)return `<div class="askform">違いは?</div><div class="fc-main jp ${sizeCls(o.p)}">${esc(o.p)}</div>
      <div class="fc-sub">${esc(o.mean)}</div><div class="fc-hint">tap to flip</div>`;
    return `<div class="fc-main jp ${sizeCls(o.p)}" style="font-size:1.35rem">${esc(o.p)}</div>
      <div class="fc-mean" style="text-align:left">${esc(o.form)}</div>
      <div class="fc-ex jp">${esc(o.ex)}</div>
      ${o.note?`<div class="fc-note">${esc(o.note)}</div>`:""}
      <div class="fc-tags">${tagsFor(c)}</div>`;
  }
  if(opt.gface==="rev"){
    if(!back)return `<div class="cue">Which pattern?</div><div class="fc-mean" style="font-size:1.15rem">${esc(o.mean)}</div><div class="fc-hint">tap to flip</div>`;
    return `<div class="fc-main jp ${sizeCls(o.p)}">${esc(o.p)}</div>
      <div class="fc-sub">${esc(o.form)}</div>
      <div class="fc-ex jp">${esc(o.ex)}<small>${esc(o.exen||"")}</small></div>
      <div class="fc-tags">${tagsFor(c)}</div>`;
  }
  if(opt.gface==="form"){
    if(!back)return `<div class="askform">接続は?</div><div class="fc-main jp ${sizeCls(o.p)}">${esc(o.p)}</div>
      <div class="fc-sub">${esc(o.mean)}</div><div class="fc-hint">tap to flip</div>`;
    return `<div class="fc-main jp" style="font-size:1.5rem">${esc(o.form)}</div>
      <div class="fc-ex jp">${esc(o.ex)}<small>${esc(o.exen||"")}</small></div>
      ${o.note?`<div class="fc-note">${esc(o.note)}</div>`:""}
      <div class="fc-tags">${tagsFor(c)}</div>`;
  }
  if(!back)return `<div class="fc-main jp ${sizeCls(o.p)}">${esc(o.p)}</div><div class="fc-hint">tap to flip</div>`;
  return `<div class="fc-mean" style="font-size:1.1rem">${esc(o.mean)}</div>
    <div class="fc-sub">${esc(o.form)}</div>
    <div class="fc-ex jp">${esc(o.ex)}<small>${esc(o.exen||"")}</small></div>
    ${o.note?`<div class="fc-note">${esc(o.note)}</div>`:""}
    <div class="fc-tags">${tagsFor(c)}</div>`;
}
function faceVerb(c,back){
  const o=c.o, f=c.form, ans=conj(o,f), cueForm=opt.vcue;
  if(cueForm==="rev"){
    if(!back)return `<div class="askform">何の動詞?</div><div class="fc-main jp ${sizeCls(ans.k)}">${esc(ans.k)}</div>
      <div class="fc-sub">${VFLABEL[f]}</div><div class="fc-hint">tap to flip</div>`;
    return `<div class="fc-main jp ${sizeCls(o.w)}">${esc(o.w)}</div>
      <div class="fc-read jp">${esc(o.r)}</div><div class="fc-mean">${esc(o.m)}</div>
      <div class="fc-tags">${tagsFor(c)}</div>`;
  }
  if(!back){
    if(cueForm==="en")return `<div class="askform">${VFLABEL[f]}</div><div class="fc-mean" style="font-size:1.15rem">${esc(o.m)}</div><div class="fc-hint">tap to flip</div>`;
    const cue=cueForm==="dict"?conj(o,"dict").k:o.w;
    return `<div class="askform">${VFLABEL[f]}</div><div class="fc-main jp ${sizeCls(cue)}">${esc(cue)}</div><div class="fc-hint">tap to flip</div>`;
  }
  return `<div class="fc-main jp ${sizeCls(ans.k)}">${esc(ans.k)}</div>
    <div class="fc-read jp">${esc(ans.r)}</div>
    <div class="fc-sub">${GLABEL[o.g]} ・ ${esc(o.w)} ・ ${esc(o.m)}</div>
    <div class="fc-tags">${tagsFor(c)}</div>`;
}
function faceAdj(c,back){
  const o=c.o, f=c.form, ans=adjConj(o,f);
  if(!back)return `<div class="askform">${AFLABEL[f]}</div><div class="fc-main jp ${sizeCls(o.w)}">${esc(o.w)}</div>
    <div class="fc-sub">${esc(o.m)}</div><div class="fc-hint">tap to flip</div>`;
  return `<div class="fc-main jp ${sizeCls(ans.k)}">${esc(ans.k)}</div>
    <div class="fc-read jp">${esc(ans.r)}</div>
    ${ans.pol?`<div class="fc-sub">丁寧: ${esc(ans.pol)}</div>`:""}
    <div class="fc-sub">${ATLABEL[o.t]}</div>
    <div class="fc-tags">${tagsFor(c)}</div>`;
}
function face(c,back){
  if(c.deck==="gram")return faceGram(c,back);
  if(c.deck==="verb")return faceVerb(c,back);
  if(c.deck==="adj") return faceAdj(c,back);
  return faceWord(c,back);
}
/* what the 🔊 button should say for a card */
function sayText(c){
  const o=c.o;
  if(c.deck==="gram")return o.ex.replace(/[「」]/g,"");
  if(c.deck==="verb")return conj(o,c.form).r;
  if(c.deck==="adj") return adjConj(o,c.form).r;
  return o.r;
}

/* ================= flashcards ================= */
let order=[],pos=0,flipped=false,misses=[],seen=new Set();
function openFlash(cards,start){
  if(!cards.length)return;
  order=cards.slice(); pos=start||0; misses=[]; seen=new Set();
  $("flashView").classList.remove("hidden");
  document.body.style.overflow="hidden";
  showCard();
}
function showCard(){
  $("fStage").classList.remove("hidden"); $("fNav").classList.remove("hidden");
  $("fJudge").classList.add("hidden");
  const c=order[pos];
  flipped=false;
  $("fCard").classList.remove("flipped");
  $("fFront").innerHTML=face(c,false);
  $("fBack").innerHTML=face(c,true);
  $("fCount").textContent=`${pos+1} / ${order.length}`;
  $("fBar").style.width=((pos)/order.length*100)+"%";
  $("fStar").classList.toggle("on",starOn(c.id));
}
function flip(){
  flipped=!flipped;
  $("fCard").classList.toggle("flipped",flipped);
  $("fJudge").classList.toggle("hidden",!flipped);
  if(flipped){const c=order[pos];seen.add(c.key);if(S.cfg.auto)speak(sayText(c));}
}
function step(d){
  if(pos+d>=order.length)return finish();
  pos=Math.max(0,Math.min(order.length-1,pos+d));
  showCard();
}
function judge(ok){
  const c=order[pos];
  if(!ok&&!misses.some(m=>m.key===c.key))misses.push(c);
  step(1);
}
function finish(){
  $("fNav").classList.add("hidden"); $("fJudge").classList.add("hidden");
  $("fBar").style.width="100%";
  $("fCount").textContent="おしまい";
  const done=seen.size, right=Math.max(0,done-misses.length);
  $("fStage").innerHTML=`<div class="done">
    <h2 class="jp">おしまい</h2>
    <div class="score">${done?right+" / "+done:"—"}</div>
    <div class="fc-sub">${done?`${misses.length} card${misses.length===1?"":"s"} marked あやふや`:"Nothing graded — flip a card and tap ○ or × to keep score."}</div>
    ${misses.length?`<button class="btn" id="dRedo">× ${misses.length}枚だけ もう一回</button>`:""}
    <button class="btn" id="dAgain">最初から</button>
    <button class="btn" id="dBack">一覧に戻る</button>
  </div>`;
  if(misses.length)$("dRedo").onclick=()=>{const m=misses.slice();$("fStage").innerHTML=stageHTML();wire();openFlash(m,0)};
  $("dAgain").onclick=()=>{const o=order.slice();$("fStage").innerHTML=stageHTML();wire();openFlash(o,0)};
  $("dBack").onclick=()=>{$("fStage").innerHTML=stageHTML();wire();exitFlash()};
}
function stageHTML(){return `<div class="fc" id="fCard"><div class="fface front" id="fFront"></div><div class="fface back" id="fBack"></div></div>`}
function wire(){$("fCard").onclick=flip}
function exitFlash(){
  $("flashView").classList.add("hidden");
  document.body.style.overflow="";
  try{speechSynthesis.cancel()}catch(e){}
  render();
}
$("fCard").onclick=flip;
$("fPrev").onclick=()=>step(-1);
$("fNext").onclick=()=>step(1);
$("fOk").onclick=()=>judge(true);
$("fNo").onclick=()=>judge(false);
$("fExit").onclick=exitFlash;
$("fSpeak").onclick=()=>{const c=order[pos];if(c)speak(sayText(c))};
$("fStar").onclick=()=>{const c=order[pos];if(!c)return;toggleStar(c.id);
  $("fStar").classList.toggle("on",starOn(c.id));
  $("fBack").innerHTML=face(c,true);};
$("fShuf").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;showCard()};
document.addEventListener("keydown",e=>{
  if($("flashView").classList.contains("hidden"))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")step(1);
  else if(e.key==="ArrowLeft")step(-1);
  else if(e.key==="Escape")exitFlash();
  else if(e.key.toLowerCase()==="s")$("fStar").click();
  else if(flipped&&(e.key==="1"))judge(false);
  else if(flipped&&(e.key==="2"))judge(true);
});

/* ================= wiring ================= */
$("deckRow").querySelectorAll(".deck").forEach(b=>b.onclick=()=>{
  deck=b.dataset.d;
  $("deckRow").querySelectorAll(".deck").forEach(x=>x.classList.toggle("on",x===b));
  renderFilters(); renderOpts(); render();});
$("sortRow").querySelectorAll(".seg").forEach(b=>b.onclick=()=>{
  sortMode=b.dataset.sort;
  $("sortRow").querySelectorAll(".seg").forEach(x=>x.classList.toggle("on",x===b));
  render();});
$("autoChip").classList.toggle("on",!!S.cfg.auto);
$("autoChip").onclick=()=>{S.cfg.auto=!S.cfg.auto;save();$("autoChip").classList.toggle("on",!!S.cfg.auto);
  if(S.cfg.auto){unlock();speak("音声、オンです。")}};
$("search").addEventListener("input",e=>{query=e.target.value;render()});
$("clearBtn").onclick=()=>{query="";$("search").value="";
  filt.s1=filt.s2=filt.chu=false;filt.nl.clear();filt.lr=null;filt.lrText="";renderFilters();render()};
$("goBtn").onclick=()=>{const cards=cardsFrom(CUR);
  if(sortMode==="rand")cards.sort(()=>Math.random()-.5);
  openFlash(cards,0)};

renderFilters(); renderOpts(); render();
</script>
<script>
/* auto-updater: iOS home-screen apps cache HTML hard. On launch, fetch a fresh
   copy (cache-bypassed); if its version differs, hot-swap the document in place.
   Same-origin, so localStorage stars are untouched. Bump APPV each release. */
(function(){var APPV="2026.08.30-1";
try{if(sessionStorage.getItem("itoUpdS")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
